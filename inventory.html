<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#1d2530;--muted:#626b78;--line:#dfe3e8;
  --pri:#0f5f73;--pri-ink:#ffffff;--pri-soft:#e5f1f4;
  --warn-bg:#fff5d6;--warn-ink:#7a5200;--warn-line:#eac565;
  --bad-bg:#fdeceb;--bad-ink:#b42318;--bad-line:#f1a59e;
  --ok-bg:#e8f6ee;--ok-ink:#067647;
  --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h4{font-size:14px;margin:14px 0 8px;color:var(--muted)}
p{margin:0 0 10px}
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--pri-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand strong{font-size:17px}
.ver{font-size:12px;opacity:.8}
.who{font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.who select{min-height:34px;padding:4px 8px;border-radius:8px;border:0;font:inherit;color:var(--ink)}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#cloudSt{font-size:12px;opacity:.85}
.tag.demo{background:#fff3c4;color:#7a5200}
a.btn{text-decoration:none}
body.busy #app button,body.busy #nav button,body.busy #modal button{opacity:.6;pointer-events:none}
.cklist{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.store-warn{background:var(--bad-bg);color:var(--bad-ink);padding:8px 16px;font-size:14px}
nav{position:sticky;top:54px;z-index:15;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 12px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.nav{border:0;background:none;font:inherit;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;flex:0 0 auto}
.nav.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.subnav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:14px}
.sub{flex:1 1 0;border:0;background:none;font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;color:var(--muted);cursor:pointer;min-height:42px}
.sub.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.btn.danger{border-color:var(--bad-line);color:var(--bad-ink)}
.btn.armed{background:var(--bad-ink);border-color:var(--bad-ink);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:6px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:40px;width:100%}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.pk:focus-visible,.icard:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input.wide{margin-bottom:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-bottom:10px;cursor:pointer}
.seg{display:flex;gap:6px}
.segbtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);cursor:pointer;font-size:14px;background:#fff}
.segbtn.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:#eef0f3;color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.t-sale{background:var(--pri-soft);color:var(--pri)}
.tag.t-void{background:var(--bad-bg);color:var(--bad-ink)}
.tag.t-ok{background:var(--ok-bg);color:var(--ok-ink)}
.tag.t-warn{background:var(--warn-bg);color:var(--warn-ink)}
.t-bad{color:var(--bad-ink);font-weight:600}
.t-warn{color:var(--warn-ink);font-weight:600}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px}
.alert{border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;border:1px solid}
.alert.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.alert.info{background:var(--pri-soft);border-color:#b9dbe3;color:var(--pri)}
.alert.ok{background:var(--ok-bg);border-color:#b7e3c9;color:var(--ok-ink)}
.alert b{display:block;margin-bottom:2px}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:120px}
.stat span{display:block;font-size:12.5px;color:var(--muted)}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.cat-h{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.icard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.icard.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.icard.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.icard .nm{font-weight:600;line-height:1.35}
.icard .q{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.icard .q small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.icard .meta{font-size:12.5px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.pk{text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:1px;min-height:64px}
.pk b{font-size:14px;line-height:1.3}
.pk small{font-size:12px;color:var(--muted)}
.pk.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset;background:var(--pri-soft)}
.mention{position:relative}
.mlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden;background:#fff}
.mopt{text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:10px 12px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.mopt:last-child{border-bottom:0}
.mopt:hover,.mopt:focus-visible{background:var(--pri-soft)}
.mopt small{color:var(--muted);font-size:12.5px}
#custHint{margin:8px 0 0}
#custHint:empty{display:none}
.picked{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:var(--pri-soft);border-radius:8px;padding:10px 12px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.nw td,table.nw th{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f9fa}
tr.voided td{color:var(--muted);text-decoration:line-through}
tr.voided td.nostrike{text-decoration:none}
.step{display:inline-flex;align-items:center;gap:4px}
.step input.qty{width:64px;text-align:right}
input.money{width:110px;text-align:right}
input.cnt{width:90px;text-align:right}
.total{text-align:right;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums}
.warnline:empty{display:none}
.warnline{margin-top:10px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;font-size:14px}
.hide{display:none!important}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--pri);text-decoration:underline;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.foot{color:var(--muted);font-size:12.5px;margin:24px 0 8px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:all .2s;background:#1d2530;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad-ink)}
#toast.ok{background:var(--ok-ink)}
.modal{position:fixed;inset:0;background:rgba(20,26,33,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal[hidden]{display:none}
.modal-box{background:var(--card);border-radius:12px;max-width:760px;width:100%;padding:18px;position:relative}
.modal-x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;width:40px;height:40px;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:640px){
  main{padding:12px}
  .card{padding:12px}
  .form-grid{grid-template-columns:1fr 1fr}
  .grid-items{grid-template-columns:1fr 1fr}
  .pick{grid-template-columns:1fr 1fr}
  .icard .q{font-size:22px}
  th,td{padding:6px}
  .step input.qty{width:48px}
  input.money{width:92px}
  td.iname{min-width:120px}
  input.cnt{width:64px}
  td select{min-width:96px}
  nav{top:0;position:relative}
  .top{position:relative}
  .hide-sm{display:none}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{margin-top:4px}
}
@media (max-width:640px){
  table.lines thead{display:none}
  table.lines tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.lines td{border:0;padding:0;min-width:0}
  table.lines td.iname{flex:1 1 100%}
  table.lines td.num{text-align:left}
  table.lines td:last-child{margin-left:auto}
  table.lines td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted)}
}
@media (max-width:380px){ .form-grid{grid-template-columns:1fr} }
@media print{ .top,nav,.actions,#toast{display:none} body{background:#fff} .card{border:0} }
</style>

<body>
<header class="top">
  <div class="brand"><strong>普印通 庫存系統</strong><span class="ver">v2</span></div>
  <div class="hdr-r"><span id="whoBox" class="who"></span><span id="ptSys"></span></div>
</header>
<div id="storeWarn" class="store-warn" hidden>這個瀏覽器不允許儲存資料，關閉頁面後這次輸入的資料會消失。</div>
<div id="demoBar" class="store-warn" hidden>示範模式：這裡是示範資料，只存在這台電腦的瀏覽器。正式使用請從公司網址開啟（和設備保養系統同一個網址，最後加 inventory.html）。</div>
<nav id="nav" aria-label="主選單"></nav>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button class="modal-x" data-act="closeModal" aria-label="關閉">✕</button><div id="modalBody"></div></div></div>
<script>
'use strict';
/* =====================================================================
   普印通 耗材進銷存 — 第一版原型
   1. 常數  2. 工具  3. 核心邏輯（單據、流水帳、成本、盤點、報表）
   4. 示範資料  5. 畫面
   正式版時，第 3 節的每個開單函式改成 Supabase RPC（同一交易內寫單據、流水帳、庫存）。
   ===================================================================== */

/* ===== 1. 常數 ===== */
const STORE_KEY = 'printtown_inventory_v1';
const DATA_VERSION = 2;
// 身份沿用設備保養系統的人員資料：管理者／會計部／行政人員／工程部
const ROLES = { admin: '管理者', acct: '會計部', asst: '行政人員', eng: '工程部' };
const PERMS = {
  viewCost: ['admin', 'acct', 'asst'],
  issue: ['admin', 'acct', 'asst', 'eng'],
  editPrice: ['admin', 'acct', 'asst'],
  stockOps: ['admin', 'acct', 'asst'],   // 進貨、其他入庫、退回、其他出庫
  init: ['admin'],
  count: ['admin', 'acct', 'asst'],
  approve: ['admin'],
  void: ['admin'],
  settings: ['admin'],
  export: ['admin'],
};
const LOCS = { MAIN: { name: '總倉', available: true }, NG: { name: '不良品區', available: false } };
// 分類名稱與設備保養系統的耗材目錄相同（另加定影組、轉印帶）
const CATEGORIES = ['黑色碳粉', '藍色碳粉', '紅色碳粉', '黃色碳粉', '感光滾筒', '回收盒', '定影組', '轉印帶', '其他'];
const BASIS = ['黑色張數', '彩色張數', '總計張數', '天數'];
const UNITS = ['支', '個', '盒', '組'];
const DT = {
  INIT:       { name: '期初建帳', prefix: 'INIT' },
  PURCHASE:   { name: '進貨入庫', prefix: 'IN' },
  IN_OTHER:   { name: '其他入庫', prefix: 'IN' },
  RETURN:     { name: '退回入庫', prefix: 'RT' },
  ISSUE_SVC:  { name: '服務出庫', prefix: 'OUT' },
  ISSUE_SALE: { name: '銷貨出庫', prefix: 'OUT' },
  OUT_OTHER:  { name: '其他出庫', prefix: 'OUT' },
  MOVE:       { name: '移倉', prefix: 'MV' },   // 已取消，只保留給舊資料顯示與作廢
  ADJ:        { name: '盤點調整', prefix: 'ADJ' },
  VOID:       { name: '作廢', prefix: null },
};
const IN_TYPES = ['INIT', 'PURCHASE', 'IN_OTHER', 'RETURN'];
const OUT_TYPES = ['ISSUE_SVC', 'ISSUE_SALE', 'OUT_OTHER'];
const REASON_CATS = { in: '入庫', out: '出庫', count: '盤差', free: '免收費' };
const DEFAULT_REASONS = {
  in: ['期初建帳', '供應商贈送', '拆機回收', '客戶退回未使用', '其他'],
  out: ['報廢（過期／損壞）', '退回供應商', '內部使用', '其他'],
  count: ['點錯', '漏開單', '損壞未登記', '原因不明'],
  free: ['計張合約', '保固', '品質補償', '業務招待', '其他'],
};

/* ===== 2. 工具 ===== */
const pad = (n, l = 2) => String(n).padStart(l, '0');
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function isYmd(s) { if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; return ymd(parseYmd(s)) === s; }
function monthEnd(ym) { const [y, m] = ym.split('-').map(Number); return ymd(new Date(y, m, 0)); }
const r4 = x => Math.round(x * 10000) / 10000;
const r2 = x => Math.round(x * 100) / 100;
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtN(n) { return (Number(n) || 0).toLocaleString('zh-TW', { maximumFractionDigits: 2 }); }
function fmtM(n) { const v = Math.round(Number(n) || 0); return (v < 0 ? '−' : '') + 'NT$ ' + Math.abs(v).toLocaleString('zh-TW'); }
function fmtQ(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }

/* ===== 3. 核心邏輯 ===== */
let S = null;
let storageOK = true;
let todayOverride = null;
function today() { return todayOverride || ymd(new Date()); }

function emptyState() {
  return {
    version: DATA_VERSION, users: [], customers: [], items: [], suppliers: [], reasons: [],
    docs: [], ledger: [], bal: {}, counts: [], seqs: {},
    settings: { safetyDays: 14 }, meta: { seq: 0, idc: 0, demo: false, userId: null },
  };
}
function save() {
  if (S.meta.cloud) return;   // 雲端版不存在瀏覽器
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && (d.version === 1 || d.version === 2) && Array.isArray(d.items) && Array.isArray(d.ledger)) return d; }
  } catch (e) { storageOK = false; }
  return null;
}
// 第一版（v1）資料升級：出庫改存客戶名稱、不綁設備；免收費原因加「計張合約」並排第一
function migrate(d) {
  if (d.version === DATA_VERSION) return d;
  d.meta = d.meta || {};
  (d.docs || []).forEach(doc => {
    if (doc.customerName == null) { const c = (d.customers || []).find(x => x.id === doc.customerId); doc.customerName = c ? c.name : ''; }
    if (doc.type === 'ADJ') { const c = (d.counts || []).find(x => x.id === doc.countId); if (c) doc.note = '盤點 ' + c.date; }   // 舊備註含盤點單號
  });
  d.reasons = d.reasons || [];
  if (!d.reasons.some(r => r.cat === 'free' && r.name === '計張合約')) {
    d.meta.idc = (d.meta.idc || 0) + 1;
    d.reasons.unshift({ id: 'R' + d.meta.idc, cat: 'free', name: '計張合約', active: true });
  }
  delete d.devices;
  d.version = DATA_VERSION;
  return d;
}
function uid(p) {
  if (S.meta.cloud) { const a = crypto.getRandomValues(new Uint8Array(6)); return p + Date.now().toString(36) + Array.from(a, b => (b % 36).toString(36)).join(''); }
  S.meta.idc = (S.meta.idc || 0) + 1; return p + S.meta.idc;
}
function fail(m) { throw new Error(m); }
function me() { return S.users.find(u => u.id === S.meta.userId) || S.users[0]; }
function role() { const u = me(); return u ? u.role : null; }
function can(p) { return (PERMS[p] || []).includes(role()); }
function need(p, msg) { if (!can(p)) fail(msg || `「${ROLES[role()] || '目前身分'}」沒有這個權限`); }
const item = id => S.items.find(x => x.id === id);
const cust = id => S.customers.find(x => x.id === id);
const sup = id => S.suppliers.find(x => x.id === id);
const reason = id => S.reasons.find(x => x.id === id);
const user = id => S.users.find(x => x.id === id);
const docById = id => S.docs.find(x => x.id === id);
function docRef(d) { return d ? `${d.date} ${DT[d.type].name}` : ''; }
function getBal(itemId, loc) { const b = S.bal[itemId] && S.bal[itemId][loc]; return b ? { qty: b.qty, avg: b.avg } : { qty: 0, avg: 0 }; }
function setBal(itemId, loc, b) { if (!S.bal[itemId]) S.bal[itemId] = {}; S.bal[itemId][loc] = { qty: b.qty, avg: b.avg }; }

// 同一交易：失敗就整筆還原，對應正式版的資料庫交易
function transact(fn) {
  const snap = JSON.stringify(S);
  try { const r = fn(); save(); return r; }
  catch (e) { S = JSON.parse(snap); throw e; }
}

// 寫一筆流水帳並更新庫存與移動加權平均成本
// mode: 'in' 入庫（加權）、'out' 依當下平均成本出、'outAtCost' 依指定成本移除（作廢入庫用）
function ledgerMove(doc, itemId, loc, qty, unitCost, mode, bucket, srcType) {
  const b = getBal(itemId, loc);
  let cost = r4(Number(unitCost) || 0), avg = b.avg;
  if (qty > 0) {
    mode = 'in';
    avg = b.qty <= 0 ? cost : (b.qty * b.avg + qty * cost) / (b.qty + qty);
  } else if (mode === 'outAtCost') {
    const q = -qty;
    if (b.qty > 0 && b.qty - q > 0) avg = (b.qty * b.avg - q * cost) / (b.qty - q);
    if (avg < 0) avg = 0;
  } else {
    mode = 'out';
    cost = b.avg;
  }
  const nb = { qty: b.qty + qty, avg: r4(avg) };
  setBal(itemId, loc, nb);
  S.meta.seq = (S.meta.seq || 0) + 1;
  S.ledger.push({
    id: 'L' + S.meta.seq, seq: S.meta.seq, date: doc.date, itemId, loc, qty, unitCost: cost, mode,
    balQty: nb.qty, balAvg: nb.avg, docId: doc.id, docNo: doc.no, docType: doc.type,
    srcType: srcType || doc.type, bucket,
  });
  return cost;
}

/* --- 驗證 --- */
function checkDate(d) { if (!isYmd(d)) fail('請選擇正確的日期'); if (d > today()) fail('日期不能晚於今天'); }
function checkItem(id, allowInactive) { const it = item(id); if (!it) fail('找不到品項'); if (!it.active && !allowInactive) fail(`「${it.name}」已停用`); return it; }
function checkQty(q, it) { if (!Number.isInteger(q) || q <= 0) fail(`「${it.name}」的數量必須是大於 0 的整數`); }
function checkMoney(c, label) { if (typeof c !== 'number' || !isFinite(c) || c < 0) fail(`${label}必須是 0 以上的數字`); }
function checkDup(lines, key) { const seen = new Set(); for (const l of lines) { const k = key ? key(l) : l.itemId; if (seen.has(k)) fail('同一品項請合併成一行'); seen.add(k); } }
function checkReason(id, cat) { const r = reason(id); if (!r || r.cat !== cat) fail(`請選擇${REASON_CATS[cat]}原因`); if (!r.active) fail('這個原因已停用'); return r; }
function checkHandler(id) { if (!user(id)) fail('請選擇經手人'); return id; }
function checkLines(lines) { if (!Array.isArray(lines) || !lines.length) fail('請至少加入一個品項'); }

function nextNo(type, date) {
  const p = DT[type].prefix, ym = date.slice(0, 7).replace('-', ''), k = p + ym;
  S.seqs[k] = (S.seqs[k] || 0) + 1;
  return `${p}-${ym}-${pad(S.seqs[k], 3)}`;
}
function newDoc(type, h) {
  const doc = {
    id: uid('D'), no: '', type, status: 'valid', createdBy: me().id, createdAt: new Date().toISOString(),
    date: h.date, handlerId: h.handlerId || me().id, customerId: null, customerName: '',
    supplierId: null, origDocId: null, charge: null, invoiceNo: '', reasonId: null, reasonText: '',
    discountReason: '', note: '', lines: [],
  };
  Object.assign(doc, h);
  doc.lines = [];
  doc.no = S.meta.cloud ? doc.id : (h.no || nextNo(type, h.date));
  return doc;
}

/* --- 依單據記帳 ---
   每張單據都可以用 applyDoc 重新算出流水帳；庫存、平均成本都由「單據依序重播」得到。
   雲端版以伺服器收到的先後（seq）為準，多人同時開單也不會算錯。 */
function applyDoc(doc) {
  const t = doc.type;
  if (t === 'INIT' || t === 'PURCHASE' || t === 'IN_OTHER') {
    doc.lines.forEach(l => { l.unitCost = ledgerMove(doc, l.itemId, l.loc, l.qty, l.unitCost, 'in', 'in'); });
  } else if (t === 'RETURN') {   // 以原出庫的成本沖回
    const o = docById(doc.origDocId);
    doc.lines.forEach(l => {
      const ol = o ? o.lines.find(x => x.itemId === l.itemId) : null;
      l.price = ol && ol.price != null ? ol.price : null;
      l.unitCost = ledgerMove(doc, l.itemId, l.loc, l.qty, ol ? ol.unitCost : 0, 'in', 'in');
    });
  } else if (OUT_TYPES.includes(t)) {
    doc.lines.forEach(l => { l.unitCost = ledgerMove(doc, l.itemId, l.loc, -l.qty, 0, 'out', 'out'); });
  } else if (t === 'MOVE') {   // 已取消的移倉，只為舊資料保留
    doc.lines.forEach(l => {
      l.unitCost = ledgerMove(doc, l.itemId, l.fromLoc, -l.qty, 0, 'out', 'out');
      l.inCost = ledgerMove(doc, l.itemId, l.toLoc, l.qty, l.toLoc === 'MAIN' ? (l.inCost || 0) : l.unitCost, 'in', 'in');
    });
  } else if (t === 'ADJ') {
    doc.lines.forEach(l => { const avg = getBal(l.itemId, 'MAIN').avg; l.unitCost = ledgerMove(doc, l.itemId, 'MAIN', l.dir * l.qty, avg, l.dir > 0 ? 'in' : 'out', 'adj'); });
  } else if (t === 'VOID') {
    const o = docById(doc.origDocId);
    doc.lines = [];
    if (!o) return;
    if (IN_TYPES.includes(o.type)) {
      o.lines.forEach(l => { const c = ledgerMove(doc, l.itemId, l.loc, -l.qty, l.unitCost, 'outAtCost', 'in', o.type); doc.lines.push({ itemId: l.itemId, loc: l.loc, qty: l.qty, dir: -1, unitCost: c }); });
    } else if (OUT_TYPES.includes(o.type)) {
      o.lines.forEach(l => { const c = ledgerMove(doc, l.itemId, l.loc, l.qty, l.unitCost, 'in', 'out', o.type); doc.lines.push({ itemId: l.itemId, loc: l.loc, qty: l.qty, dir: 1, unitCost: c, price: l.price ?? null }); });
    } else if (o.type === 'MOVE') {
      o.lines.forEach(l => {
        ledgerMove(doc, l.itemId, l.toLoc, -l.qty, l.inCost, 'outAtCost', 'in', 'MOVE');
        ledgerMove(doc, l.itemId, l.fromLoc, l.qty, l.unitCost, 'in', 'out', 'MOVE');
        doc.lines.push({ itemId: l.itemId, fromLoc: l.toLoc, toLoc: l.fromLoc, qty: l.qty, unitCost: l.inCost, inCost: l.unitCost });
      });
    }
    o.status = 'voided'; o.voidDocId = doc.id;
  }
}
// 從第一張單據重算全部（雲端版依 seq 排序；示範版維持原本順序）
function rebuild() {
  S.bal = {}; S.ledger = []; S.meta.seq = 0;
  const big = Number.MAX_SAFE_INTEGER;
  S.docs.sort((a, b) => (a.seq ?? big) - (b.seq ?? big));
  S.docs.forEach(d => { d.status = 'valid'; delete d.voidDocId; });
  S.docs.forEach(d => applyDoc(d));
}
function post(build) {
  return transact(() => { const doc = build(); applyDoc(doc); S.docs.push(doc); return doc; });
}

/* --- 開單 --- */
function initStock(inp) {
  return post(() => {
    need('init', '只有管理者可以做期初建帳');
    checkDate(inp.date); checkLines(inp.lines);
    checkDup(inp.lines, l => l.itemId + '|' + l.loc);
    inp.lines.forEach(l => { const it = checkItem(l.itemId); if (!LOCS[l.loc]) fail('倉位不正確'); checkQty(l.qty, it); checkMoney(l.unitCost, `「${it.name}」的單位成本`); });
    const doc = newDoc('INIT', { date: inp.date, note: String(inp.note || '').trim(), handlerId: me().id });
    doc.lines = inp.lines.map(l => ({ itemId: l.itemId, loc: l.loc, qty: l.qty, unitCost: l.unitCost }));
    return doc;
  });
}
function purchase(inp) {
  return post(() => {
    need('stockOps');
    checkDate(inp.date); if (!sup(inp.supplierId)) fail('請選擇供應商');
    checkLines(inp.lines); checkDup(inp.lines);
    inp.lines.forEach(l => { const it = checkItem(l.itemId); checkQty(l.qty, it); checkMoney(l.unitCost, `「${it.name}」的進貨單價`); });
    const doc = newDoc('PURCHASE', { date: inp.date, supplierId: inp.supplierId, invoiceNo: String(inp.invoiceNo || '').trim(), note: String(inp.note || '').trim(), handlerId: checkHandler(inp.handlerId || me().id) });
    doc.lines = inp.lines.map(l => ({ itemId: l.itemId, loc: 'MAIN', qty: l.qty, unitCost: l.unitCost }));
    return doc;
  });
}
function inOther(inp) {
  return post(() => {
    need('stockOps');
    checkDate(inp.date); checkReason(inp.reasonId, 'in');
    checkLines(inp.lines); checkDup(inp.lines, l => l.itemId + '|' + l.loc);
    inp.lines.forEach(l => { const it = checkItem(l.itemId); if (!LOCS[l.loc]) fail('倉位不正確'); checkQty(l.qty, it); checkMoney(l.unitCost, `「${it.name}」的單位成本`); });
    const doc = newDoc('IN_OTHER', { date: inp.date, reasonId: inp.reasonId, note: String(inp.note || '').trim(), handlerId: checkHandler(inp.handlerId || me().id) });
    doc.lines = inp.lines.map(l => ({ itemId: l.itemId, loc: l.loc, qty: l.qty, unitCost: l.unitCost }));
    return doc;
  });
}
function cleanName(v) { return String(v || '').replace(/^[@＠]+/, '').trim(); }
function issue(inp) {
  return post(() => {
    need('issue');
    checkDate(inp.date);
    const handlerId = checkHandler(inp.handlerId || me().id);
    const customerName = cleanName(inp.customerName);
    if (!customerName) fail('請填寫客戶');
    if (customerName.length > 80) fail('客戶名稱太長（最多 80 字）');
    // 用 @ 提及選的會帶客戶 id；手打的名稱若剛好跟名單一樣，也自動對上
    const picked = inp.customerId && cust(inp.customerId) && cust(inp.customerId).name === customerName ? cust(inp.customerId) : null;
    const linked = picked || S.customers.find(c => c.name === customerName) || null;
    const charge = inp.charge === true;
    const priv = can('editPrice');
    checkLines(inp.lines); checkDup(inp.lines);
    let freeReasonId = null, discountReason = '';
    if (!charge) { freeReasonId = inp.freeReasonId; checkReason(freeReasonId, 'free'); }
    const ls = inp.lines.map(l => {
      const it = checkItem(l.itemId); checkQty(l.qty, it);
      let price = null;
      if (charge) { price = priv ? l.price : it.price; checkMoney(price, `「${it.name}」的單價`); price = r2(price); }
      return { it, qty: l.qty, price };
    });
    if (charge && priv && ls.some(x => x.price < x.it.price)) {
      discountReason = String(inp.discountReason || '').trim();
      if (!discountReason) fail('有品項的單價低於售價，請填寫原因');
    }
    const type = charge ? 'ISSUE_SALE' : 'ISSUE_SVC';
    const doc = newDoc(type, {
      date: inp.date, handlerId, customerId: linked ? linked.id : null, customerName, charge,
      reasonId: freeReasonId, discountReason, invoiceNo: charge ? String(inp.invoiceNo || '').trim() : '',
      note: String(inp.note || '').trim(),
    });
    doc.lines = ls.map(x => ({ itemId: x.it.id, loc: 'MAIN', qty: x.qty, price: x.price }));
    return doc;
  });
}
function outOther(inp) {
  return post(() => {
    need('stockOps');
    checkDate(inp.date); checkReason(inp.reasonId, 'out');
    if (!LOCS[inp.loc]) fail('請選擇倉位');
    if (inp.supplierId && !sup(inp.supplierId)) fail('找不到供應商');
    checkLines(inp.lines); checkDup(inp.lines);
    inp.lines.forEach(l => { const it = checkItem(l.itemId, true); checkQty(l.qty, it); });
    const doc = newDoc('OUT_OTHER', { date: inp.date, reasonId: inp.reasonId, supplierId: inp.supplierId || null, note: String(inp.note || '').trim(), handlerId: checkHandler(inp.handlerId || me().id) });
    doc.lines = inp.lines.map(l => ({ itemId: l.itemId, loc: inp.loc, qty: l.qty }));
    return doc;
  });
}
function validReturnsOf(id) { return S.docs.filter(d => d.type === 'RETURN' && d.origDocId === id && d.status === 'valid'); }
function returnable(docId) {
  const o = docById(docId); if (!o || !OUT_TYPES.includes(o.type)) return [];
  const rets = validReturnsOf(docId);
  return o.lines.map(l => {
    const returned = rets.reduce((s, r) => s + r.lines.filter(x => x.itemId === l.itemId).reduce((a, x) => a + x.qty, 0), 0);
    return { itemId: l.itemId, qty: l.qty, returned, left: l.qty - returned, unitCost: l.unitCost, price: l.price ?? null };
  });
}
function returnIn(inp) {
  return post(() => {
    need('stockOps');
    checkDate(inp.date);
    const o = docById(inp.origDocId);
    if (!o || !OUT_TYPES.includes(o.type)) fail('請選擇原出庫單');
    if (o.status !== 'valid') fail('原出庫單已作廢，不能退回');
    if (inp.date < o.date) fail('退回日期不能早於原出庫日期');
    if (!LOCS[inp.loc]) fail('請選擇退回的倉位');
    const lines = (inp.lines || []).filter(l => l.qty !== 0 && l.qty !== '' && l.qty != null);
    checkLines(lines); checkDup(lines);
    const ra = returnable(o.id);
    lines.forEach(l => {
      const it = checkItem(l.itemId, true); checkQty(l.qty, it);
      const r = ra.find(x => x.itemId === l.itemId); if (!r) fail(`原出庫單沒有「${it.name}」`);
      if (l.qty > r.left) fail(`「${it.name}」最多只能退 ${r.left}`);
    });
    const doc = newDoc('RETURN', { date: inp.date, origDocId: o.id, customerId: o.customerId, customerName: o.customerName || '', note: String(inp.note || '').trim(), handlerId: checkHandler(inp.handlerId || me().id) });
    doc.lines = lines.map(l => ({ itemId: l.itemId, loc: inp.loc, qty: l.qty }));
    return doc;
  });
}
function voidCheck(o) {
  if (!o) return '找不到單據';
  if (o.type === 'VOID') return '作廢單不能再作廢';
  if (o.status === 'voided') return '這張單已經作廢';
  if (o.type === 'ADJ') return '盤點調整單不能作廢，請重新盤點';
  if (OUT_TYPES.includes(o.type) && validReturnsOf(o.id).length) return '這張出庫單已有退回入庫，請先作廢退回單';
  return '';
}
function voidDoc(id, reasonText) {
  return post(() => {
    need('void', '只有管理者可以作廢單據');
    const o = docById(id); const why = voidCheck(o); if (why) fail(why);
    const rt = String(reasonText || '').trim(); if (!rt) fail('請填寫作廢原因');
    return newDoc('VOID', { no: o.no + '-V', date: today(), origDocId: o.id, reasonText: rt, customerId: o.customerId, customerName: o.customerName || '', supplierId: o.supplierId, handlerId: me().id });
  });
}

/* --- 盤點 --- */
function openCount() { return S.counts.find(c => c.status === 'draft' || c.status === 'submitted') || null; }
function countStart(date) {
  return transact(() => {
    need('count'); checkDate(date);
    if (openCount()) fail('已經有進行中的盤點');
    const its = sortItems(S.items.filter(i => i.active || getBal(i.id, 'MAIN').qty !== 0));
    if (!its.length) fail('沒有可以盤點的品項');
    const ym = date.slice(0, 7).replace('-', ''), k = 'CNT' + ym;
    S.seqs[k] = (S.seqs[k] || 0) + 1;
    const c = { id: uid('C'), no: `CNT-${ym}-${pad(S.seqs[k], 3)}`, date, loc: 'MAIN', status: 'draft', createdBy: me().id, createdAt: new Date().toISOString(), lines: its.map(i => ({ itemId: i.id, actual: null, reasonId: null, book: null, diff: null })), rejectNote: '' };
    S.counts.push(c); return c;
  });
}
function countSave(id, lines) {
  return transact(() => {
    need('count');
    const c = S.counts.find(x => x.id === id); if (!c) fail('找不到盤點單'); if (c.status !== 'draft') fail('這張盤點單已送出');
    (lines || []).forEach(l => {
      const cl = c.lines.find(x => x.itemId === l.itemId); if (!cl) return;
      const a = l.actual;
      if (a === '' || a == null) cl.actual = null;
      else { if (!Number.isInteger(a) || a < 0) fail(`「${item(l.itemId).name}」的實盤數必須是 0 以上的整數`); cl.actual = a; }
      cl.reasonId = l.reasonId || null;
    });
    return c;
  });
}
function countSubmit(id) {
  return transact(() => {
    need('count');
    const c = S.counts.find(x => x.id === id); if (!c) fail('找不到盤點單'); if (c.status !== 'draft') fail('這張盤點單已送出');
    c.lines.forEach(l => {
      const it = item(l.itemId);
      if (l.actual == null) fail(`「${it.name}」還沒輸入實盤數`);
      l.book = getBal(l.itemId, 'MAIN').qty;
      l.diff = l.actual - l.book;
      if (l.diff !== 0) { const r = reason(l.reasonId); if (!r || r.cat !== 'count') fail(`「${it.name}」有差異（${fmtQ(l.diff)}），請選擇原因`); }
      else l.reasonId = null;
    });
    c.status = 'submitted'; c.submittedBy = me().id; c.submittedAt = new Date().toISOString(); c.rejectNote = '';
    return c;
  });
}
function countApprove(id) {
  return transact(() => {
    need('approve', '只有管理者可以簽核盤點');
    const c = S.counts.find(x => x.id === id); if (!c) fail('找不到盤點單'); if (c.status !== 'submitted') fail('這張盤點單不是待簽核狀態');
    const diffs = c.lines.filter(l => l.diff !== 0);
    if (diffs.length) {
      const doc = newDoc('ADJ', { date: c.date, countId: c.id, note: '盤點 ' + c.date, handlerId: me().id });
      doc.lines = diffs.map(l => ({ itemId: l.itemId, loc: 'MAIN', qty: Math.abs(l.diff), dir: Math.sign(l.diff), reasonId: l.reasonId }));
      applyDoc(doc); S.docs.push(doc); c.adjDocId = doc.id;
    }
    c.status = 'approved'; c.approvedBy = me().id; c.approvedAt = new Date().toISOString();
    return c;
  });
}
function countReject(id, note) {
  return transact(() => {
    need('approve', '只有管理者可以退回盤點');
    const c = S.counts.find(x => x.id === id); if (!c) fail('找不到盤點單'); if (c.status !== 'submitted') fail('這張盤點單不是待簽核狀態');
    const n = String(note || '').trim(); if (!n) fail('請填寫退回原因');
    c.status = 'draft'; c.rejectNote = n; c.lines.forEach(l => { l.book = null; l.diff = null; });
    return c;
  });
}

/* --- 主檔維護 --- */
function sortItems(list) { return [...list].sort((a, b) => (CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category)) || a.code.localeCompare(b.code)); }
function intIn(v, label, min, max) { const n = typeof v === 'string' ? (v.trim() === '' ? NaN : Number(v)) : v; if (!Number.isInteger(n) || n < min || (max != null && n > max)) fail(`${label}必須是 ${min}${max != null ? '～' + max : ' 以上'}的整數`); return n; }
function saveItem(inp) {
  return transact(() => {
    need('settings', '只有管理者可以修改品項');
    const code = String(inp.code || '').trim(), name = String(inp.name || '').trim();
    if (!code) fail('請填寫料號'); if (!name) fail('請填寫品名');
    if (S.items.some(i => i.code.toLowerCase() === code.toLowerCase() && i.id !== inp.id)) fail(`料號「${code}」已經有了`);
    if (!CATEGORIES.includes(inp.category)) fail('請選擇分類');
    if (!['原廠', '副廠'].includes(inp.brand)) fail('請選擇原廠或副廠');
    const unit = String(inp.unit || '').trim(); if (!unit) fail('請填寫單位');
    const models = [...new Set((Array.isArray(inp.models) ? inp.models : String(inp.models || '').split(/[,，、\s]+/)).map(s => String(s).trim()).filter(Boolean))];
    const price = inp.price === '' || inp.price == null ? NaN : Number(inp.price); checkMoney(price, '售價');

function lastPurchaseCost(itemId) {
  for (let i = S.docs.length - 1; i >= 0; i--) { const d = S.docs[i]; if (d.type === 'PURCHASE' && d.status === 'valid') { const l = d.lines.find(x => x.itemId === itemId); if (l) return l.unitCost; } }

}
function out30(itemId) {
  const from = addDays(today(), -29); let n = 0;
  S.ledger.forEach(e => { if (e.itemId !== itemId || e.date < from || e.date > today()) return; if (OUT_TYPES.includes(e.srcType)) n -= e.qty; else if (e.srcType === 'RETURN') n -= e.qty; });
  return n;
}
function ledgerRows(f = {}) {
  return S.ledger.filter(e => (!f.itemId || e.itemId === f.itemId) && (!f.loc || e.loc === f.loc) && (!f.from || e.date >= f.from) && (!f.to || e.date <= f.to)).sort((a, b) => b.seq - a.seq);
}
function monthSummary(ym, loc = 'MAIN') {
  const start = ym + '-01', end = monthEnd(ym);
  const ids = new Set(S.items.filter(i => i.active).map(i => i.id));
  S.ledger.forEach(e => { if (e.loc === loc && e.date <= end) ids.add(e.itemId); });
  return sortItems(S.items.filter(i => ids.has(i.id))).map(it => {
    let open = 0, inq = 0, outq = 0, adj = 0, last = null;
    S.ledger.forEach(e => {
      if (e.itemId !== it.id || e.loc !== loc) return;
      if (e.date < start) open += e.qty;
      else if (e.date <= end) { if (e.bucket === 'in') inq += e.qty; else if (e.bucket === 'out') outq -= e.qty; else adj += e.qty; }
      if (e.date <= end && (!last || e.seq > last.seq)) last = e;
    });
    const close = open + inq - outq + adj, avg = last ? last.balAvg : 0;
    return { item: it, open, in: inq, out: outq, adj, close, avg, value: r2(close * avg) };
  });
}
function outRows(f = {}) {
  const rows = [];
  S.docs.forEach(d => {
    if (d.status !== 'valid' || !(OUT_TYPES.includes(d.type) || d.type === 'RETURN')) return;
    if (f.from && d.date < f.from) return; if (f.to && d.date > f.to) return;
    const isRet = d.type === 'RETURN';
    const kind = isRet ? '退回' : d.type === 'ISSUE_SVC' ? '服務' : d.type === 'ISSUE_SALE' ? '銷貨' : '其他';
    if (f.kind && f.kind !== kind) return;
    if (f.cust) { const name = (d.customerName || '').toLowerCase(); if (!String(f.cust).toLowerCase().split(/\s+/).filter(Boolean).every(k => name.includes(k))) return; }
    if (f.handlerId && d.handlerId !== f.handlerId) return;
    const sale = d.type === 'ISSUE_SALE' || (isRet && docById(d.origDocId)?.type === 'ISSUE_SALE');
    d.lines.forEach(l => {
      const q = isRet ? -l.qty : l.qty;
      const cost = r2(q * l.unitCost), rev = sale ? r2(q * (l.price || 0)) : 0;
      rows.push({ doc: d, kind, line: l, qty: q, cost, rev, margin: sale ? r2(rev - cost) : null });
    });
  });
  return rows.sort((a, b) => (b.doc.date.localeCompare(a.doc.date)) || (b.doc.no.localeCompare(a.doc.no)));
}
function countDiffRows() {
  const rows = [];
  S.counts.filter(c => c.status === 'approved').forEach(c => {
    const adj = c.adjDocId ? docById(c.adjDocId) : null;
    c.lines.filter(l => l.diff !== 0).forEach(l => {
      const al = adj ? adj.lines.find(x => x.itemId === l.itemId) : null;
      rows.push({ count: c, line: l, unitCost: al ? al.unitCost : 0, value: r2(l.diff * (al ? al.unitCost : 0)), adj });
    });
  });
  return rows.sort((a, b) => b.count.date.localeCompare(a.count.date));
}

/* --- 帳務自我檢查：重播流水帳，核對庫存、平均成本與單據 --- */
function verify() {
  const probs = [], b = {};
  const lab = e => `${e.date} ${DT[e.docType] ? DT[e.docType].name : ''}`;
  [...S.ledger].sort((x, y) => x.seq - y.seq).forEach(e => {
    const k = e.itemId + '|' + e.loc, cur = b[k] || { qty: 0, avg: 0 };
    let avg = cur.avg;
    if (e.qty > 0) avg = cur.qty <= 0 ? e.unitCost : (cur.qty * cur.avg + e.qty * e.unitCost) / (cur.qty + e.qty);
    else if (e.mode === 'outAtCost') { const q = -e.qty; if (cur.qty > 0 && cur.qty - q > 0) avg = (cur.qty * cur.avg - q * e.unitCost) / (cur.qty - q); if (avg < 0) avg = 0; }
    else if (Math.abs(e.unitCost - cur.avg) > 0.001) probs.push(`${lab(e)}：出庫成本與當時平均成本不符`);
    const nq = cur.qty + e.qty, na = r4(avg);
    if (nq !== e.balQty || Math.abs(na - e.balAvg) > 0.001) probs.push(`${lab(e)}：流水帳結存不符`);
    b[k] = { qty: nq, avg: na };
  });
  Object.entries(S.bal).forEach(([itemId, locs]) => Object.entries(locs).forEach(([loc, v]) => {
    const r = b[itemId + '|' + loc] || { qty: 0, avg: 0 };
    if (r.qty !== v.qty || Math.abs(r.avg - v.avg) > 0.001) probs.push(`${item(itemId) ? item(itemId).name : itemId}／${LOCS[loc] ? LOCS[loc].name : loc}：庫存與流水帳不符`);
  }));
  Object.keys(b).forEach(k => { const [i, l] = k.split('|'); if (!(S.bal[i] && S.bal[i][l])) probs.push(`${item(i) ? item(i).name : i}：缺少庫存紀錄`); });
  const cnt = {}; S.ledger.forEach(e => { cnt[e.docId] = (cnt[e.docId] || 0) + 1; });
  S.docs.forEach(d => {
    const base = d.type === 'VOID' ? docById(d.origDocId) : d;
    const exp = base && base.type === 'MOVE' ? d.lines.length * 2 : d.lines.length;
    if ((cnt[d.id] || 0) !== exp) probs.push(`${docRef(d)}：流水帳筆數不符`);
    if (d.status === 'voided' && !S.docs.some(v => v.type === 'VOID' && v.origDocId === d.id)) probs.push(`${docRef(d)}：已作廢但找不到作廢單`);
    if (OUT_TYPES.includes(d.type) && returnable(d.id).some(r => r.left < 0)) probs.push(`${docRef(d)}：退回數量超過出庫數量`);
  });
  const nos = new Set(); S.docs.forEach(d => { if (nos.has(d.no)) probs.push(`${docRef(d)}：內部編號重複`); nos.add(d.no); });
  return probs;
}

function itemLabel(it) { return `${esc(it.name)}${it.brand === '副廠' ? ' <span class="tag">副廠</span>' : ''}${it.active ? '' : ' <span class="tag t-void">已停用</span>'}`; }

function locOpts(sel) { return Object.entries(LOCS).map(([k, v]) => opt(k, v.name, sel)).join(''); }
function dateF(form, label = '日期') { return field(label, `<input type="date" max="${today()}" data-bind="${form}.date" value="${esc(ui[form].date)}">`); }

function segOpt(path, v, label, on) { return `<label class="segbtn${on ? ' on' : ''}"><input type="radio" name="${path}" value="${v}" data-bind="${path}" data-rerender ${on ? 'checked' : ''}>${label}</label>`; }

// 客戶提示來源：最近出庫填過的客戶名稱排前面，再來是客戶名單
function custPool() {
  const pool = [], seen = new Set();
  for (let i = S.docs.length - 1; i >= 0; i--) {
    const d = S.docs[i], n = d.customerName;
    if (!n || seen.has(n) || d.type === 'VOID') continue;
    seen.add(n);
    const c = S.customers.find(x => x.name === n);
    pool.push({ id: c ? c.id : '', name: n, sub: c ? [c.contact, c.phone].filter(Boolean).join('　') : '曾填過的客戶' });
  }
  S.customers.forEach(c => { if (!seen.has(c.name)) { seen.add(c.name); pool.push({ id: c.id, name: c.name, sub: [c.contact, c.phone].filter(Boolean).join('　') }); } });
  return pool;
}
function custMatches(q) {
  const kws = cleanName(q).toLowerCase().split(/\s+/).filter(Boolean), pool = custPool();
  if (!kws.length) return pool.slice(0, 8);
  // 名稱命中的排前面，聯絡人、電話、地址命中的排後面
  const byName = p => kws.every(k => p.name.toLowerCase().includes(k));
  const byAny = p => { const c = p.id ? cust(p.id) : null; const hay = [p.name, p.sub, c ? c.address : ''].join(' ').toLowerCase(); return kws.every(k => hay.includes(k)); };
  return pool.filter(byName).concat(pool.filter(p => !byName(p) && byAny(p))).slice(0, 8);
}
function mentionHtml() {
  const f = ui.issue; if (!f.mentionOpen) return '';
  const list = custMatches(f.customerName); f._m = list;
  if (!list.length) return '';
  return `<div class="mlist" role="listbox" aria-label="客戶提示">${list.map((p, i) => `<button class="mopt" role="option" data-act="mentionPick" data-i="${i}"><b>${esc(p.name)}</b>${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</button>`).join('')}</div>`;
}
function custHint() {
  const f = ui.issue, n = cleanName(f.customerName);
  if (!n) return '';
  const c = (f.customerId && cust(f.customerId)) || S.customers.find(x => x.name === n);
  if (c) return esc([c.contact, c.phone, c.address].filter(Boolean).join('　'));
  if (custPool().some(p => p.name === n)) return '曾填過的客戶';
  if (f.mentionOpen && custMatches(n).length) return '';
  return '新的客戶名稱，存檔後下次打字就會出現在提示裡';
}

function issueCust() {

/* --- 頁面：入庫・移倉 --- */

}
const activeItems = () => sortItems(S.items.filter(i => i.active));

}
function recvOther() {
  const f = ui.inx;
  return `<section class="card"><h3>其他入庫</h3><p class="muted">供應商贈送、拆機回收、客戶退回未使用等。拆機回收預設進不良品區、成本 0；贈品成本 0。</p><div class="form-grid">${field('原因（必填）', selReasons('inx.reasonId', 'in', f.reasonId, 'data-change="inxReason"'))}</div><h4>品項</h4>${picker('inx', activeItems())}${linesTable('inx', { loc: true, cost: true })}<div class="form-grid">${dateF('inx')}${handlerF('inx')}${noteF('inx')}</div><div class="actions"><button class="btn pri" data-act="inxSave">存檔</button></div></section>`;
}
function retCandidates() {
  const kws = String(ui.ret.q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  return S.docs.filter(d => OUT_TYPES.includes(d.type) && d.status === 'valid' && returnable(d.id).some(r => r.left > 0)).filter(d => {

    return kws.every(k => hay.includes(k));

}
function retList() {

  return `<div class="tbl"><table class="nw"><thead><tr><th>日期</th><th>類型</th><th>對象</th><th>品項</th><th class="num">數量</th><th></th></tr></thead><tbody>${list.slice(0, 20).map(d => `<tr><td>${d.date}</td><td>${typeTag(d)}</td><td>${esc(docTarget(d))}</td><td>${docItems(d)}</td><td class="num">${docQty(d)}</td><td><button class="btn sm" data-act="retPick" data-id="${d.id}">選這張</button></td></tr>`).join('')}</tbody></table></div>`;
}
function recvReturn() {

  h += `<div class="tbl" style="margin-top:12px"><table><thead><tr><th>品項</th><th class="num">原出庫</th><th class="num">已退回</th><th class="num">可退</th><th class="num">這次退回</th></tr></thead><tbody>${ra.map(r => { const it = item(r.itemId); return `<tr><td>${itemLabel(it)}</td><td class="num">${r.qty}</td><td class="num">${r.returned}</td><td class="num">${r.left}</td><td class="num"><input type="number" class="cnt" min="0" max="${r.left}" step="1" inputmode="numeric" aria-label="退回數量" data-bind="ret.qty.${r.itemId}" data-type="int" value="${esc(f.qty[r.itemId] ?? '')}" ${r.left <= 0 ? 'disabled' : ''}></td></tr>`; }).join('')}</tbody></table></div>`;

}

}

/* --- 頁面：盤點 --- */
function pageCount() {
  const c = openCount();
  let h = '';
  if (!c) {
    h += can('count') ? `<section class="card"><p>目前沒有進行中的盤點。品項一頁列完，輸入實際點到的數量即可。</p><div class="form-grid">${field('盤點日期', `<input type="date" max="${today()}" data-bind="cnt.date" value="${esc(ui.cnt.date)}">`)}</div><div class="actions"><button class="btn pri" data-act="countStart">開始盤點</button></div></section>` : '<section class="card"><p class="muted">目前沒有待簽核的盤點。</p></section>';
  } else if (c.status === 'draft') {
    if (ui.cnt.loadedId !== c.id) { ui.cnt.loadedId = c.id; ui.cnt.actual = {}; ui.cnt.reason = {}; c.lines.forEach(l => { ui.cnt.actual[l.itemId] = l.actual == null ? '' : l.actual; ui.cnt.reason[l.itemId] = l.reasonId || ''; }); }
    const edit = can('count');
    h += `<section class="card"><h3>盤點日 ${c.date}　<span class="tag t-warn">盤點中</span></h3>`;
    if (c.rejectNote) h += `<div class="alert warn"><b>管理者退回</b>${esc(c.rejectNote)}</div>`;
    h += `<p class="muted">帳面數是目前的即時數字；盤點中仍可開單，差異以「送出」當下的帳面數計算。</p><div class="tbl"><table><thead><tr><th>品項</th><th class="num">帳面數</th><th class="num">實盤數</th><th class="num">差異</th><th>差異原因</th></tr></thead><tbody>`;
    c.lines.forEach(l => {
      const it = item(l.itemId), book = getBal(l.itemId, 'MAIN').qty, a = ui.cnt.actual[l.itemId], diff = a === '' || a == null ? null : a - book;
      h += `<tr><td class="iname">${itemLabel(it)}<div class="muted sm">${esc(it.code)}</div></td><td class="num">${book}</td><td class="num"><input type="number" class="cnt" min="0" step="1" inputmode="numeric" aria-label="實盤數" data-bind="cnt.actual.${l.itemId}" data-type="int" data-live="countRow" data-id="${l.itemId}" value="${esc(a)}" ${edit ? '' : 'disabled'}></td><td class="num" id="cd-${l.itemId}">${cdHtml(diff)}</td><td><select data-bind="cnt.reason.${l.itemId}" id="cr-${l.itemId}" aria-label="差異原因" ${!edit || !diff ? 'disabled' : ''}>${opt('', diff ? '請選擇' : '—', ui.cnt.reason[l.itemId])}${S.reasons.filter(r => r.cat === 'count' && r.active).map(r => opt(r.id, r.name, ui.cnt.reason[l.itemId])).join('')}</select></td></tr>`;
    });
    h += '</tbody></table></div>';
    if (edit) h += '<div class="actions"><button class="btn" data-act="countDraft">暫存</button><button class="btn pri" data-act="countSubmit">送出簽核</button></div>';
    h += '</section>';
  } else {
    h += `<section class="card"><h3>盤點日 ${c.date}　<span class="tag t-sale">待簽核</span></h3><p class="muted">送出人：${esc(userName(c.submittedBy))}</p>${countTable(c)}`;
    if (can('approve')) h += `<div class="form-grid">${field('退回原因（退回時必填）', `<input type="text" data-bind="cnt.rejectNote" value="${esc(ui.cnt.rejectNote)}">`, 'wide')}</div><div class="actions"><button class="btn pri" data-act="countApprove" data-id="${c.id}">核准並調整庫存</button><button class="btn danger" data-act="countReject" data-id="${c.id}">退回重盤</button></div>`;
    else h += '<p class="muted">等待管理者簽核。</p>';
    h += '</section>';
  }
  const hist = S.counts.filter(x => x.status === 'approved').reverse();
  h += `<section class="card"><h3>歷次盤點</h3>${hist.length ? `<div class="tbl"><table class="nw"><thead><tr><th>盤點日</th><th>送出人</th><th>簽核人</th><th class="num">差異品項</th></tr></thead><tbody>${hist.map(x => `<tr class="click" data-act="openCount" data-id="${x.id}"><td>${x.date}</td><td>${esc(userName(x.submittedBy))}</td><td>${esc(userName(x.approvedBy))}</td><td class="num">${x.lines.filter(l => l.diff !== 0).length}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">還沒有盤點紀錄。</p>'}</section>`;
  return h;
}
function cdHtml(diff) { return diff == null ? '<span class="muted">—</span>' : diff === 0 ? '0' : `<span class="t-bad">${fmtQ(diff)}</span>`; }
function countTable(c) {
  const priv = can('viewCost');
  return `<div class="tbl"><table><thead><tr><th>品項</th><th class="num">帳面數</th><th class="num">實盤數</th><th class="num">差異</th><th>原因</th>${priv && c.adjDocId ? '<th class="num">差異金額</th>' : ''}</tr></thead><tbody>${c.lines.map(l => { const it = item(l.itemId), adj = c.adjDocId ? docById(c.adjDocId).lines.find(x => x.itemId === l.itemId) : null; return `<tr><td>${itemLabel(it)}</td><td class="num">${l.book}</td><td class="num">${l.actual}</td><td class="num">${cdHtml(l.diff)}</td><td>${l.reasonId ? esc(reason(l.reasonId).name) : ''}</td>${priv && c.adjDocId ? `<td class="num">${adj ? fmtM(l.diff * adj.unitCost) : ''}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}

/* --- 頁面：單據 --- */
function docMatches(d) {
  const f = ui.docs;
  if (f.type && d.type !== f.type) return false;
  if (f.from && d.date < f.from) return false; if (f.to && d.date > f.to) return false;
  const kws = String(f.kw || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!kws.length) return true;
  const hay = [DT[d.type].name, docTarget(d), d.lines.map(l => item(l.itemId) ? item(l.itemId).name + ' ' + item(l.itemId).code : '').join(' '), d.note, d.invoiceNo, d.reasonText, userName(d.handlerId)].join(' ').toLowerCase();
  return kws.every(k => hay.includes(k));
}
function docListHtml() {
  const order = new Map(S.docs.map((d, i) => [d.id, i]));
  const list = S.docs.filter(docMatches).sort((x, y) => y.date.localeCompare(x.date) || order.get(y.id) - order.get(x.id)), priv = can('viewCost');
  if (!list.length) return '<p class="empty">沒有符合的單據。</p>';
  return `<p class="muted sm">共 ${list.length} 張${list.length > 200 ? '，顯示最新 200 張' : ''}。點一列看明細。</p><div class="tbl"><table class="nw"><thead><tr><th>日期</th><th>類型</th><th>對象</th><th>品項</th><th class="num">數量</th>${priv ? '<th class="num">成本金額</th>' : ''}<th>經手人</th><th>狀態</th></tr></thead><tbody>${list.slice(0, 200).map(d => `<tr class="click${d.status === 'voided' ? ' voided' : ''}" data-act="openDoc" data-id="${d.id}"><td>${d.date}</td><td class="nostrike">${typeTag(d)}</td><td>${esc(docTarget(d))}</td><td>${docItems(d)}</td><td class="num">${docQty(d)}</td>${priv ? `<td class="num">${fmtM(docCost(d))}</td>` : ''}<td>${esc(userName(d.handlerId))}</td><td class="nostrike">${statusTag(d)}</td></tr>`).join('')}</tbody></table></div>`;
}
function pageDocs() {
  const f = ui.docs;
  return `<section class="card"><div class="form-grid">${field('類型', `<select data-bind="docs.type" data-live="docList">${opt('', '全部', f.type)}${Object.entries(DT).filter(([k]) => k !== 'MOVE' || S.docs.some(d => d.type === 'MOVE')).map(([k, v]) => opt(k, v.name, f.type)).join('')}</select>`)}${field('起日', `<input type="date" data-bind="docs.from" data-live="docList" value="${esc(f.from)}">`)}${field('迄日', `<input type="date" data-bind="docs.to" data-live="docList" value="${esc(f.to)}">`)}${field('關鍵字', `<input type="search" data-bind="docs.kw" data-live="docList" value="${esc(f.kw)}" placeholder="客戶、品項、備註、經手人">`)}</div></section><section class="card" id="docList">${docListHtml()}</section>`;
}
function docDetail(id) {
  const d = docById(id); if (!d) return '<p>找不到單據。</p>';
  const priv = can('viewCost'), o = d.origDocId ? docById(d.origDocId) : null;
  const link = x => `<button class="linkbtn" data-act="openDoc" data-id="${x.id}">${esc(docRef(x))}</button>`;
  const kv = [['日期', d.date], ['經手人', esc(userName(d.handlerId))], ['建立', `${esc(userName(d.createdBy))}・${new Date(d.createdAt).toLocaleString('zh-TW', { hour12: false })}`]];
  const cn = d.customerName || (d.customerId && cust(d.customerId) ? cust(d.customerId).name : '');
  if (cn) kv.push(['客戶', esc(cn)]);
  if (d.type === 'ISSUE_SALE' || d.type === 'ISSUE_SVC') kv.push(['收費', d.charge ? '收費' : '不收費']);
  if (d.supplierId && sup(d.supplierId)) kv.push(['供應商', esc(sup(d.supplierId).name)]);
  if (d.reasonId && reason(d.reasonId)) kv.push([d.type === 'ISSUE_SVC' ? '不收費原因' : '原因', esc(reason(d.reasonId).name)]);
  if (d.reasonText) kv.push([d.type === 'VOID' ? '作廢原因' : '原因', esc(d.reasonText)]);
  if (d.discountReason) kv.push(['低於售價原因', esc(d.discountReason)]);
  if (d.invoiceNo) kv.push([d.type === 'PURCHASE' ? '供應商發票或出貨單' : '發票號碼', esc(d.invoiceNo)]);
  if (o) kv.push([d.type === 'VOID' ? '作廢的原單' : '原出庫單', link(o)]);
  if (d.voidDocId && docById(d.voidDocId)) kv.push(['作廢紀錄', link(docById(d.voidDocId))]);
  const rets = S.docs.filter(x => x.type === 'RETURN' && x.origDocId === d.id);
  if (rets.length) kv.push(['退回入庫', rets.map(x => link(x) + (x.status === 'voided' ? '（已作廢）' : '')).join('、')]);
  if (d.note) kv.push(['備註', esc(d.note)]);
  const showPrice = priv && d.lines.some(l => l.price != null);
  let h = `<h3>${DT[d.type].name}　${statusTag(d)}</h3><dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  h += `<div class="tbl"><table><thead><tr><th>品項</th><th>倉位</th><th class="num">數量</th>${priv ? '<th class="num">單位成本</th><th class="num">成本金額</th>' : ''}${showPrice ? '<th class="num">單價</th><th class="num">銷售金額</th>' : ''}</tr></thead><tbody>${d.lines.map(l => {
    const it = item(l.itemId), loc = l.fromLoc ? `${LOCS[l.fromLoc].name} → ${LOCS[l.toLoc].name}` : LOCS[l.loc].name;
    const sign = l.dir ? (l.dir > 0 ? '+' : '−') : '';
    return `<tr><td>${it ? itemLabel(it) : ''}</td><td>${loc}</td><td class="num">${sign}${l.qty}</td>${priv ? `<td class="num">${fmtN(l.unitCost)}</td><td class="num">${fmtM(l.qty * l.unitCost)}</td>` : ''}${showPrice ? `<td class="num">${l.price != null ? fmtN(l.price) : ''}</td><td class="num">${l.price != null ? fmtM(l.qty * l.price) : ''}</td>` : ''}</tr>`;
  }).join('')}</tbody></table></div>`;
  if (can('void')) {
    const why = voidCheck(d);
    if (!why) h += `<section class="card" style="margin:16px 0 0"><h3>作廢這張單</h3><p class="muted sm">作廢會產生一筆反向的作廢紀錄，原單保留並標示「已作廢」。作廢後請重開正確的單。</p><div class="form-grid">${field('作廢原因（必填）', '<input type="text" id="voidReason" placeholder="例：數量登錄錯誤">', 'wide')}</div><div class="actions"><button class="btn danger" data-act="voidDoc" data-id="${d.id}">作廢</button></div></section>`;
    else if (d.type !== 'VOID' && d.status !== 'voided') h += `<p class="muted sm" style="margin-top:12px">${esc(why)}</p>`;
  }
  return h;
}

/* --- 頁面：報表 --- */
function repTabs() { const t = [['ledger', '庫存流水帳'], ['sum', '月出入庫彙總'], ['out', '出庫明細']]; if (can('viewCost')) t.push(['diff', '盤差紀錄']); return t; }
function pageRep() {

  let fl = '';

// 每個欄位標型別：'' 文字、num 數字、qty 帶正負號數量、money 金額
function repData() {
  const priv = can('viewCost'), C = (h, t = '') => ({ h, t });
  if (ui.rep === 'ledger') {
    const rows = Inv.ledgerRows(ui.led);
    const cols = [C('日期'), C('類型'), C('品項'), C('倉位'), C('異動', 'qty'), C('結存', 'num')].concat(priv ? [C('單位成本', 'num'), C('結存平均成本', 'num')] : []).concat([C('對象'), C('經手人')]);
    return { cols, ids: rows.map(e => e.docId), rows: rows.map(e => { const d = docById(e.docId), it = item(e.itemId); return [e.date, d.type === 'VOID' ? '作廢（' + DT[e.srcType].name + '）' : DT[e.docType].name, it ? it.name : '', LOCS[e.loc].name, e.qty, e.balQty].concat(priv ? [e.unitCost, e.balAvg] : []).concat([docTarget(d), userName(d.handlerId)]); }) };
  }
  if (ui.rep === 'sum') {
    const ym = /^\d{4}-\d{2}$/.test(ui.sum.ym) ? ui.sum.ym : today().slice(0, 7);
    const rows = Inv.monthSummary(ym, ui.sum.loc);
    const cols = [C('料號'), C('品名'), C('期初', 'num'), C('入庫', 'num'), C('出庫', 'num'), C('盤差', 'qty'), C('期末', 'num')].concat(priv ? [C('期末平均成本', 'num'), C('期末金額', 'money')] : []);
    return { cols, ym, total: priv ? rows.reduce((s, r) => s + r.value, 0) : null, rows: rows.map(r => [r.item.code, r.item.name, r.open, r.in, r.out, r.adj, r.close].concat(priv ? [r.avg, r.value] : [])) };
  }
  if (ui.rep === 'out') {
    const rows = Inv.outRows(ui.outr);
    const why = d => d.reasonId && reason(d.reasonId) ? reason(d.reasonId).name : d.discountReason ? '低於售價：' + d.discountReason : '';
    const cols = [C('日期'), C('類別'), C('客戶'), C('品項'), C('數量', 'num'), C('原因'), C('經手人')].concat(priv ? [C('成本', 'money'), C('銷售金額', 'money'), C('毛利', 'money')] : []).concat([C('發票')]);
    return {
      cols, ids: rows.map(r => r.doc.id),
      rows: rows.map(r => { const d = r.doc, it = item(r.line.itemId); return [d.date, r.kind, d.customerName || '', it ? it.name : '', r.qty, why(d), userName(d.handlerId)].concat(priv ? [r.cost, r.margin == null ? '' : r.rev, r.margin == null ? '' : r.margin] : []).concat([d.invoiceNo || '']); }),
      sums: { qty: rows.reduce((s, r) => s + r.qty, 0), cost: rows.reduce((s, r) => s + r.cost, 0), rev: rows.reduce((s, r) => s + r.rev, 0), margin: rows.reduce((s, r) => s + (r.margin || 0), 0) },
    };
  }
  const rows = Inv.countDiffRows();
  return { cols: [C('盤點日'), C('品項'), C('帳面', 'num'), C('實盤', 'num'), C('差異', 'qty'), C('原因'), C('差異金額', 'money'), C('簽核人')], rows: rows.map(r => [r.count.date, item(r.line.itemId).name, r.line.book, r.line.actual, r.line.diff, r.line.reasonId ? reason(r.line.reasonId).name : '', r.value, userName(r.count.approvedBy)]) };
}
function repBody() {
  const D = repData(), priv = can('viewCost');
  let h = '';
  if (ui.rep === 'out') h += `<div class="summary"><div class="stat"><span>筆數</span><b>${D.rows.length}</b></div><div class="stat"><span>淨出庫數量</span><b>${D.sums.qty}</b></div>${priv ? `<div class="stat"><span>成本</span><b>${fmtM(D.sums.cost)}</b></div><div class="stat"><span>銷售金額</span><b>${fmtM(D.sums.rev)}</b></div><div class="stat"><span>銷貨毛利</span><b>${fmtM(D.sums.margin)}</b></div>` : ''}</div>`;
  if (ui.rep === 'sum') h += `<p class="muted sm">${esc(D.ym)}・期末＝期初＋入庫－出庫＋盤差。作廢在作廢當天沖回，原月份不變。</p>`;
  if (ui.rep === 'ledger') h += '<p class="muted sm">依記帳順序由新到舊；「結存」是該筆記帳後的數量。</p>';
  if (can('export')) h += `<div class="actions" style="margin:0 0 10px"><button class="btn sm" data-act="exportRep">匯出 CSV</button></div>`;
  if (!D.rows.length) return h + '<p class="empty">沒有資料。</p>';
  const cls = c => (c.t ? 'num' : '');
  const cell = (v, c) => v === '' || v == null ? '' : c.t === 'money' ? fmtM(v) : c.t === 'qty' ? fmtQ(v) : typeof v === 'number' ? fmtN(v) : esc(v);
  h += `<div class="tbl"><table class="nw"><thead><tr>${D.cols.map(c => `<th class="${cls(c)}">${c.h}</th>`).join('')}</tr></thead><tbody>${D.rows.map((r, ri) => `<tr${D.ids ? ` class="click" data-act="openDoc" data-id="${D.ids[ri]}"` : ''}>${r.map((v, i) => `<td class="${cls(D.cols[i])}">${cell(v, D.cols[i])}</td>`).join('')}</tr>`).join('')}</tbody>${D.total != null ? `<tfoot><tr><td colspan="${D.cols.length - 1}" class="num"><b>期末金額合計</b></td><td class="num"><b>${fmtM(D.total)}</b></td></tr></tfoot>` : ''}</table></div>`;
  return h;
}

  d.lines = r.data.lines.map((l, i) => ({ ...l, loc: l.loc || 'MAIN', ...(m && Array.isArray(m.lines) && m.lines[i] ? m.lines[i] : {}) }));
  if (m) { d.invoiceNo = String(m.invoiceNo || ''); d.discountReason = String(m.discountReason || ''); }
  if (!d.createdAt) d.createdAt = r.created_at;
  return d;
}
const countsToState = rows => rows.filter(okRowId).map(r => ({ rejectNote: '', ...r.data, id: String(r.id) })).filter(c => Array.isArray(c.lines));
// 單據送到雲端時，數量與金額分開（金額只有管理者、會計部、行政人員讀得到）
function pubDoc(d) {
  const x = { id: d.id, type: d.type, date: d.date, handlerId: d.handlerId, customerId: d.customerId || null, customerName: d.customerName || '', supplierId: d.supplierId || null,
    origDocId: d.origDocId || null, charge: d.charge ?? null, reasonId: d.reasonId || null, reasonText: d.reasonText || '', note: d.note || '', countId: d.countId || null };
  x.lines = d.type === 'VOID' ? [] : d.lines.map(l => { const y = { itemId: l.itemId, loc: l.loc || 'MAIN', qty: l.qty }; if (l.dir) y.dir = l.dir; if (l.reasonId) y.reasonId = l.reasonId; return y; });
  return x;
}
function moneyOf(d) {
  if (['INIT', 'PURCHASE', 'IN_OTHER'].includes(d.type)) return { lines: d.lines.map(l => ({ unitCost: Number(l.unitCost) || 0 })), invoiceNo: d.invoiceNo || '' };
  if (d.type === 'ISSUE_SALE') return { lines: d.lines.map(l => ({ price: Number(l.price) || 0 })), invoiceNo: d.invoiceNo || '', discountReason: d.discountReason || '' };
  return null;
}
async function loadAll(who) {
  const priv = ['admin', 'acct', 'asst'].includes(who.role);
  const [apps, master, docs, money, counts] = await Promise.all([
    fetchPaged(() => sb.from('app_records').select('coll,id,data').in('coll', ['staff', 'customers', 'catalog']).order('coll').order('id')),
    fetchPaged(() => sb.from('inv_master').select('coll,id,data').order('coll').order('id')),
    fetchPaged(() => sb.from('inv_docs').select('seq,id,type,date,data,created_at').order('seq')),
    priv ? fetchPaged(() => sb.from('inv_money').select('doc_id,data').order('doc_id')) : Promise.resolve([]),
    fetchPaged(() => sb.from('inv_counts').select('id,data').order('id')),
  ]);
  S = emptyState(); S.meta.cloud = true; S.meta.demo = false;
  const rows = c => apps.filter(r => r.coll === c && okRowId(r));
  S.users = rows('staff').map(r => ({ id: String(r.id), name: String(r.data.name || r.data.email || r.id), role: roleOfStaff(r.data), active: r.data.active === true }));
  let mine = S.users.find(u => u.id === who.staffId);
  if (!mine) { mine = { id: who.staffId, name: who.name || who.email, role: who.role, active: true }; S.users.push(mine); }
  mine.role = who.role;   // 本人的身份以資料庫為準
  S.meta.userId = who.staffId;
  S.customers = rows('customers').map(r => ({ id: String(r.id), name: String(r.data.name || '').trim(), contact: String(r.data.contact || ''), phone: String(r.data.phone || ''), address: String(r.data.address || '') })).filter(c => c.name);
  S.catalogSrc = rows('catalog').map(r => ({ ...r.data, id: String(r.id) }));
  masterToState(master);
  const mm = new Map(money.map(x => [String(x.doc_id), x.data]));
  S.docs = docs.filter(docRowOk).map(r => mergeDoc(r, mm.get(String(r.id))));
  lastSeq = docs.reduce((a, r) => Math.max(a, Number(r.seq) || 0), 0);
  S.counts = countsToState(counts);
  rebuild();
}
// 取回別人剛存的單據、主檔與盤點；有變動才重算
async function syncNow() {
  if (DEMO || !sb || phase !== 'ready') return false;
  let changed = false;
  const rows = await fetchPaged(() => sb.from('inv_docs').select('seq,id,type,date,data,created_at').gt('seq', lastSeq).order('seq'));
  if (rows.length) {
    const mm = new Map();
    if (can('viewCost')) for (let i = 0; i < rows.length; i += 200) {
      (await must(sb.from('inv_money').select('doc_id,data').in('doc_id', rows.slice(i, i + 200).map(r => r.id)))).forEach(x => mm.set(String(x.doc_id), x.data));
    }
    rows.filter(docRowOk).forEach(r => { S.docs = S.docs.filter(d => d.id !== String(r.id)); S.docs.push(mergeDoc(r, mm.get(String(r.id)))); });
    lastSeq = rows.reduce((a, r) => Math.max(a, Number(r.seq) || 0), lastSeq);
    changed = true;
  }
  const [master, counts] = await Promise.all([
    fetchPaged(() => sb.from('inv_master').select('coll,id,data').order('coll').order('id')),
    fetchPaged(() => sb.from('inv_counts').select('id,data').order('id')),
  ]);
  const before = JSON.stringify([S.items, S.suppliers, S.reasons, S.settings, S.counts]);
  masterToState(master); S.counts = countsToState(counts);
  if (JSON.stringify([S.items, S.suppliers, S.reasons, S.settings, S.counts]) !== before) changed = true;
  if (S.docs.some(d => d.seq == null)) { S.docs = S.docs.filter(d => d.seq != null); changed = true; }
  if (changed) rebuild();
  return changed;
}
let lockP = Promise.resolve();
function exclusive(fn) { const p = lockP.then(() => fn()); lockP = p.catch(() => {}); return p; }
// 先在本機檢查並記帳（不合規定直接擋下），再送雲端；雲端拒絕就還原，畫面和雲端一致
async function commit(localFn, remoteFn) {
  if (DEMO) return localFn();
  return exclusive(async () => {
    try { await syncNow(); } catch (e) { throw cloudError(e); }
    const snap = JSON.stringify(S);
    const result = localFn();
    try { await remoteFn(result); } catch (e) { S = JSON.parse(snap); throw cloudError(e); }
    try { await syncNow(); } catch (e) { /* 已存進雲端；下次同步會補上 */ }
    return result;
  });
}
const commitDoc = localFn => commit(localFn, async doc => { const r = await rpc('inv_post', { p_doc: pubDoc(doc), p_money: moneyOf(doc) }); doc.seq = Number(r && r.seq); });
const countData = c => { const { id, ...rest } = c; return rest; };
const commitCount = (localFn, mode) => commit(localFn, async c => {
  if (mode === 'insert') await must(sb.from('inv_counts').insert({ id: c.id, data: countData(c) }));
  else { const r = await must(sb.from('inv_counts').update({ data: countData(c) }).eq('id', c.id).select('id')); if (!r || !r.length) throw new Error('盤點單已被別人更新或沒有權限，請重新整理'); }
});
const commitApprove = id => commit(() => Inv.countApprove(id), async c => {
  const adj = c.adjDocId ? docById(c.adjDocId) : null;
  await rpc('inv_count_approve', { p_count_id: id, p_doc: adj ? pubDoc(adj) : null });
});
const commitMaster = (coll, localFn) => commit(localFn, async rec => {
  const list = (Array.isArray(rec) ? rec : [rec]).map(x => { const { id, ...data } = x; return { coll, id: coll === 'settings' ? 'main' : id, data }; });
  const r = await must(sb.from('inv_master').upsert(list, { onConflict: 'coll,id' }).select('id'));
  if (!r || r.length !== list.length) throw new Error('沒有權限修改設定');
});
const commitDelete = (coll, id, localFn) => commit(localFn, async () => {
  const r = await must(sb.from('inv_master').delete().eq('coll', coll).eq('id', id).select('id'));
  if (!r || !r.length) throw new Error('刪除沒有成功（可能沒有權限）');
});
// 畫面上的存檔一律經過這裡：示範模式直接存在瀏覽器，雲端模式送到 Supabase
const W = {
  issue: x => commitDoc(() => Inv.issue(x)),
  outOther: x => commitDoc(() => Inv.outOther(x)),
  purchase: x => commitDoc(() => Inv.purchase(x)),
  inOther: x => commitDoc(() => Inv.inOther(x)),
  returnIn: x => commitDoc(() => Inv.returnIn(x)),
  initStock: x => commitDoc(() => Inv.initStock(x)),
  voidDoc: (id, why) => commitDoc(() => Inv.voidDoc(id, why)),
  countStart: d => commitCount(() => Inv.countStart(d), 'insert'),
  countSave: (id, lines) => commitCount(() => Inv.countSave(id, lines), 'update'),
  countSubmit: (id, lines) => commitCount(() => { Inv.countSave(id, lines); return Inv.countSubmit(id); }, 'update'),
  countReject: (id, note) => commitCount(() => Inv.countReject(id, note), 'update'),
  countApprove: id => commitApprove(id),
  saveItem: x => commitMaster('items', () => Inv.saveItem(x)),
  importCatalog: ids => commitMaster('items', () => Inv.importCatalog(ids)),
  saveSupplier: x => commitMaster('suppliers', () => Inv.saveSupplier(x)),
  saveReason: x => commitMaster('reasons', () => Inv.saveReason(x)),
  saveSettings: x => commitMaster('settings', () => Inv.saveSettings(x)),
  deleteItem: id => commitDelete('items', id, () => Inv.deleteItem(id)),
  deleteSupplier: id => commitDelete('suppliers', id, () => Inv.deleteSupplier(id)),
};
function setBusy(on) { busy = on; document.body.classList.toggle('busy', on); const c = $('#cloudSt'); if (c) c.textContent = on ? '☁ 儲存中…' : '☁ 已同步'; }
function softRender() {
  const a = document.activeElement;
  if ((a && a.closest && a.closest('#app') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) || !$('#modal').hidden || busy) { setTimeout(softRender, 1500); return; }
  render();
}
async function syncQuiet() {
  if (DEMO || phase !== 'ready' || busy) return;
  try { if (await exclusive(() => syncNow())) softRender(); } catch (e) { const c = $('#cloudSt'); if (c) c.textContent = '☁ 暫時無法同步'; }
}
async function cloudBoot() {
  if (!CLOUD_ON) { phase = 'stop'; phaseMsg = '雲端設定（config.js）不完整。請確認 inventory.html 和 index.html、config.js 放在 GitHub 的同一個資料夾。'; return render(); }
  try { await loadSupabase(); } catch (e) { phase = 'stop'; phaseMsg = '雲端元件無法載入，請確認網路後重新整理。'; return render(); }
  sb = window.supabase.createClient(CLOUD.url, CLOUD.key);
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { phase = 'login'; return render(); }
    if (((session.user.app_metadata || {}).provider || '') !== 'google') { phase = 'stop'; phaseMsg = '本系統僅接受 Google 帳號登入。'; return render(); }
    let who;
    try { who = await rpc('inv_me'); }
    catch (e) { phase = 'stop'; phaseMsg = '庫存系統還沒有安裝到資料庫。請管理者先在 Supabase 的 SQL Editor 執行 inventory-setup-v2.sql。'; return render(); }
    if (!who || !who.staffId) { phase = 'deny'; return render(); }
    try { const b = await rpc('billing_whoami'); BILLING_OK = !!(b && b.member === true); } catch (e) { BILLING_OK = false; }
    await loadAll(who);
    phase = 'ready';
    freshForms();
  } catch (e) { console.error(e); phase = 'stop'; phaseMsg = '載入失敗：' + (cloudError(e).message); return render(); }
  render();
  setInterval(syncQuiet, 60000);
  window.addEventListener('focus', syncQuiet);
}

/* --- 事件 --- */
function closeMention() { if (ui.issue && ui.issue.mentionOpen) { ui.issue.mentionOpen = false; const ml = $('#mentionList'); if (ml) ml.innerHTML = ''; const ch = $('#custHint'); if (ch) ch.innerHTML = custHint(); } }
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  if (!e.target.closest('.mention')) closeMention();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (busy) return;
  runAct(fn, el, e);
});
function runAct(fn, el, e) {
  let r;
  try { r = fn(el, e); } catch (err) { toast(err.message || String(err), 'err'); return; }
  if (r && typeof r.then === 'function') {
    setBusy(true);
    r.catch(err => { toast((err && err.message) || String(err), 'err'); render(); }).finally(() => setBusy(false));
  }
}
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind || el.type === 'radio' || el.type === 'checkbox' || el.type === 'file') return;
  setBound(el);
  if (el.dataset.live && LIVE[el.dataset.live]) { try { LIVE[el.dataset.live](el); } catch (err) { console.error(err); } }
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.bind) setBound(el);
  if (el.id === 'userSel') { setUser(el.value); freshForms(); ui.itemForm = null; ui.supForm = null; ui.verifyMsg = ''; closeModal(); render(); toast(`已切換為 ${me().name}（${ROLES[role()]}）`, 'ok'); return; }
  if (el.dataset.change && ACT[el.dataset.change]) { runAct(ACT[el.dataset.change], el, e); return; }
  if (el.hasAttribute('data-rerender')) render();
});
document.addEventListener('focusin', e => { if (e.target.id === 'custInput') { ui.issue.mentionOpen = true; $('#mentionList').innerHTML = mentionHtml(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) closeModal(); else closeMention();
});

/* --- 啟動 --- */
(function boot() {
  if (!DEMO) { S = emptyState(); S.meta.cloud = true; render(); cloudBoot(); return; }
  S = load();
  if (S && S.version === 1 && S.meta && S.meta.demo) S = null;   // 第一版的示範資料：直接換成新版示範
  if (!S) seedDemo(); else { S = migrate(S); save(); }
  if (!user(S.meta.userId)) S.meta.userId = S.users[0].id;
  freshForms();
  render();
})();
</script>
