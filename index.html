    <summary style="cursor:pointer;list-style:none;font-weight:700;font-size:16px">＋ 新增客戶 <span class="muted" style="font-size:13px;font-weight:400">（點此展開）</span></summary>
    <form onsubmit="addCustomer(event)" style="margin-top:12px"><div class="form-row">
      <div><label>客戶名稱</label><input name="name" required placeholder="例如：範例客戶 D"></div>
      <div><label>聯繫電話</label><input name="phone" type="tel" placeholder="例如：02-2345-6789"></div>
      <div><label>備用電話</label><input name="phone2" type="tel" placeholder="選填"></div>
      <div><label>聯絡人</label><input name="contact" placeholder="例如：王小姐"></div>
      <div><label>地址</label><input name="address"></div>
      <div><label>備註</label><input name="note"></div>
      <div><button class="primary" type="submit">新增客戶</button></div>
    </div></form></details>`;
}

function viewManage() {
  ensureSel();
  if (qrLab.open) return qrLabHtml();   // V66：QR 標籤列印
  if (qrFocus) {   // V66：掃 QR 進來——直接顯示這台設備
    const qd = S.devices.find(d => d.id === qrFocus && devVisible(d));
    if (qd && custOf(qd)) { selDev = qd.id; selCust = qd.customerId; return qrPageHtml(qd); }
    qrFocus = null;
  }
  const dev = S.devices.find(d => d.id === selDev) || null;
  const top = customerFormHtml() + overviewHtml();
  if (!S.customers.length) return top + '<div class="card"><div class="empty">尚無客戶。請先在最上方新增客戶。</div></div>' + manageHtml();
  let h = top;
  return h + recentHtml() + manageHtml();
}

function deviceHtml(dev) {
  const lr = lastReading(dev.id), sv = svcStatus(dev);
  const avgTxt = x => x == null ? '—' : x.avg != null ? `${fmt(x.avg)} 張／月` : `<span class="muted">${esc(x.msg)}</span>`;
  const svTag = svcMonthTag(dev);
  return `<div class="card sec-dev"><h2>設備資料</h2>
    <table style="min-width:0"><tbody>
      <tr><th style="width:110px">客戶</th><td>${esc(custName(dev))} ${contractTag(dev)}${(() => { const c = S.customers.find(x => x.id === dev.customerId); return c && (c.phone || c.phone2) ? ` <span class="muted">☎ ${esc(c.phone || '')}${c.phone2 ? '　備用 ☎ ' + esc(c.phone2) : ''}</span>` : ''; })()}</td>
          <th style="width:110px">安裝地點</th><td>${esc(dev.location || '—')}</td></tr>
      <tr><th style="width:110px">機型</th><td>${esc(KIND[dev.kind])}｜${esc(dev.brand)} ${esc(dev.model)}${isPrint(dev) ? `｜${dev.hasColor ? '彩色機' : '黑白機'}` : ''}</td>
          <th>保養週期</th><td>${devCycle(dev).label}${cycOpt(dev.cycleMonths) ? '' : '（沿用客戶原本的週期，儲存設備後固定）'}　${svTag}</td><th>上次服務</th><td>${sv.last || '—'}</td></tr>
      ${isPrint(dev) ? `      <tr><th>黑白月均</th><td>${avgTxt(avgOf(dev.id, 'bw'))}</td>
          <th>彩色月均</th><td>${dev.hasColor ? avgTxt(avgOf(dev.id, 'color')) : '—'}</td></tr>
      <tr><th>最近讀數</th><td>${(() => { const lv = visitsOf(dev.id).filter(x => x.bw != null).pop();
            return lv ? `黑白 ${fmt(lv.bw)}${dev.hasColor && lv.color != null ? ` ／ 彩色 ${fmt(lv.color)}` : ''}（${lv.date}）` : '—'; })()}</td>
          ${isLarge(dev) ? (() => { const g = visitsOf(dev.id).filter(x => x.colorLarge != null).pop();
            return `<th>彩色大尺寸</th><td>${g ? `${fmt(g.colorLarge)}（${g.date}）` : '—'}</td>`; })() : ''}</tr>
` : ''}
      ${featRowsHtml(dev)}
      ${isPrint(dev) ? '' : `<tr><th>上次保養清潔</th><td colspan="3">${lastCleanSvc(dev) ? esc(lastCleanSvc(dev)) : '<span class="muted">尚無紀錄</span>'}</td></tr>
      <tr><th>耗材最近更換</th><td colspan="3">${odorReplHtml(dev)}</td></tr>`}
      <tr><th>最新主管意見</th><td colspan="3">${(() => { const o = latestOpinion(dev.id); return o ? `${esc(o.supOpinion)} <span class="muted">（${o.date}）</span>` : '<span class="muted">尚無</span>'; })()}</td></tr>
    </tbody></table></div>`;
}

function remindHtml(dev) {
  const items = reminderItems(dev);
  return `<div class="card sec-remind"><h2>提醒</h2>
    ${items.length ? items.map(i => `<div style="margin:6px 0">${i.tag} ${esc(i.text)}</div>`).join('') : '<span class="tag t-ok">目前沒有提醒</span>'}
    <p class="note">黃色為一般提醒；紅色只用於已逾期需立即備貨。只列需要處理的事項；耗材暫時無法推估的原因，請看下方「耗材管理」的說明，補齊後即自動推估。</p></div>`;
}

// 服務紀錄：登錄 ＋ 逐次拜訪病歷 ＋ 一覽
function visitPageHtml(dev, visits, i) {
  const v = visits[i], m = visitMetrics(dev, visits, i);
  const bwCell = isPrint(dev) ? (v.bw != null ? fmt(v.bw) : '—') : '不計張數';
  const coCell = isPrint(dev) && dev.hasColor ? (v.color != null ? fmt(v.color) : '—') : '—';
  const sg = x => x == null ? '—' : (x > 0 ? '+' : '') + fmt(x);
  const deltaCell = isPrint(dev) ? sg(m.bwDelta) + (dev.hasColor ? ' ／ ' + sg(m.coDelta) : '') : '—';
  const avgCell = !isPrint(dev) ? '—'
    : m.avgBw != null ? fmt(m.avgBw) + (dev.hasColor && m.avgCo != null ? ' ／ ' + fmt(m.avgCo) : '') + ' 張／月'
    : '<span class="muted">—</span>';
  const alertHtml = m.alerts.length
    ? m.alerts.map(a => `<div style="margin:4px 0"><span class="tag t-warn">提示</span> ${esc(a)}</div>`).join('')
    : '<span class="tag t-ok">無系統提示</span>';
  const evHtml = m.events.length ? m.events.map(x => `<span class="tag t-info">${esc(x)}</span>`).join(' ')
    : '<span class="muted">本次未更換耗材</span>';
  return `<div>
    <h2>第 ${seqNo(visits.length, i)} 筆｜${esc(v.date)}｜${esc(svcText(v))}${seqTag(visits.length, i)}</h2>
    ${isPrint(dev) ? `<table style="min-width:0"><thead><tr><th>拜訪日期</th><th>服務類型</th><th class="num">黑白張數</th><th class="num">彩色張數</th>${isLarge(dev) ? '<th class="num">彩色大尺寸張數</th>' : ''}
      <th class="num">本次增量（黑白 ／ 彩色${isLarge(dev) ? '含大尺寸' : ''}）</th><th class="num">距上次</th><th class="num">近六個月平均</th></tr></thead>
    <tbody><tr><td>${esc(v.date)}<div class="muted">擔當工程師：${esc(v.engineer || '—')}</div></td><td>${svcHtml(v)}</td>
      <td class="num">${bwCell}</td><td class="num">${coCell}</td>${isLarge(dev) ? `<td class="num">${v.colorLarge != null ? fmt(v.colorLarge) : '—'}</td>` : ''}<td class="num">${deltaCell}</td>
      <td class="num">${m.gap == null ? '首次拜訪' : m.gap + ' 天'}</td><td class="num">${avgCell}</td></tr></tbody></table>`
    : `<table style="min-width:0"><thead><tr><th>拜訪日期</th><th>服務類型</th><th class="num">距上次</th></tr></thead>
    <tbody><tr><td>${esc(v.date)}<div class="muted">擔當工程師：${esc(v.engineer || '—')}</div></td><td>${svcHtml(v)}</td>
      <td class="num">${m.gap == null ? '首次拜訪' : m.gap + ' 天'}</td></tr></tbody></table>`}
    <h2 style="margin-top:14px">系統提示</h2><div>${alertHtml}</div>
    <h2 style="margin-top:14px">本次更換耗材</h2><div>${evHtml}</div>
    <h2 style="margin-top:14px">登錄內容</h2>
    <div style="display:grid;gap:8px;margin-bottom:12px">
      <div><label>服務卡客戶已親簽</label><div>${v.engConfirmed ? '<span class="tag t-ok">客戶已親簽</span>' : '<span class="muted">未勾選</span>'}</div></div>
      ${[['服務紀錄', v.serviceRecord], ['客戶交代事宜', v.customerInstruction], ['下回保養提醒', v.nextNote, 1], ['耗材庫存', v.consumableStock], ['採購信號', v.purchaseSignal, 1], ['備註', v.note, 1]]
        .filter(([k, x, opt]) => !opt || String(x || '').trim()).map(([k, x]) => `<div><label>${k}</label><div style="white-space:pre-wrap">${esc(x || '—')}</div></div>`).join('')}
    </div>
    <form onsubmit="saveVisitNote(event,'${v.id}')">
      <div class="form-row"><div style="grid-column:1/-1"><label>主訴（客戶反映）</label>
        <textarea class="taBox" name="complaint" rows="2">${esc(v.complaint || '')}</textarea></div></div>
      <div class="form-row"><div style="grid-column:1/-1"><label>處置與建議</label>
        <textarea class="taBox" name="treatment" rows="3">${esc(v.treatment || '')}</textarea></div></div>
      <div class="act-bar"><div class="act-l"><button class="primary" type="submit">儲存主訴與處置</button></div>
        <div class="act-r"><span class="muted" style="font-size:12px">需連續按三次</span><button class="ghost danger" type="button" onclick="delLog('${v.id}')">刪除此次服務紀錄</button></div></div>
    </form></div>`;
}

// V54：歷史紀錄依服務日期由近到遠排列（第 1 筆＝日期最近）；只顯示最近 3 筆，更早的收折在下方
const HIST_SHOW = 3;
function recentSplitHtml(rows, hRow, tblStyle, openOlder) {
  const recent = rows.slice(0, HIST_SHOW), older = rows.slice(HIST_SHOW);
  const tbl = rs => `<div style="overflow-x:auto"><table class="hist-tbl" style="${tblStyle}">${hRow}<tbody>${rs.join('')}</tbody></table></div>`;
  return tbl(recent) + (older.length ? `<details class="hist-older" ${openOlder ? 'open' : ''} style="margin:6px 0 10px"><summary style="cursor:pointer;font-weight:600;padding:6px 0">顯示更早的 ${older.length} 筆紀錄（點此展開）</summary>${tbl(older)}</details>` : '');
}
function serviceHtml(dev) {
  const visits = visitsOf(dev.id);
  const lr0 = lastReading(dev.id);
  const qBanner = quickDev === dev.id ? `<div class="alert-box">快速紀錄：${esc(custName(dev))}｜${esc(dev.location || '—')}（${esc(KIND[dev.kind])} ${esc(dev.model)}）。日期預設今天、擔當工程師預設上次人員；填好後按「儲存服務紀錄」。</div>` : '';
  const form = logFormHtml(dev, null, {formId: 'serviceForm', banner: qBanner, onsubmit: 'addLog(event)',
    buttons: '<button class="primary" type="submit">儲存服務紀錄</button>'});

  let body = '<div class="empty">尚無拜訪紀錄。</div>';
  let summary = '';
  if (visits.length) {
    if (chartIdx == null || chartIdx < 0 || chartIdx >= visits.length) chartIdx = visits.length - 1;
    const i = chartIdx, n = visits.length;
    const nav = `<div class="visit-nav" style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0">
      <button class="ghost" type="button" title="日期較近的一筆" ${i === n - 1 ? 'disabled' : ''} onclick="goVisit(${i + 1})">← 較新一筆</button>
      <div>第 <b>${seqNo(n, i)}</b> 筆 ／ 共 ${n} 筆<span class="muted" style="font-size:12px">（1＝日期最近）</span></div>
      <button class="ghost" type="button" title="日期較早的一筆" ${i === 0 ? 'disabled' : ''} onclick="goVisit(${i - 1})">較舊一筆 →</button></div>`;
    body = `<div id="visitDetail" style="margin-top:14px;padding-top:4px;border-top:2px solid #e2e8f0">${nav}${visitPageHtml(dev, visits, i)}</div>`;
    const rowsArr = visits.map((x, k) => k).reverse().map(k => {
      const x = visits[k], mm = visitMetrics(dev, visits, k);
      return `<tr class="visit-row" data-seq="${seqNo(n, k)}" onclick="goVisit(${k})" title="點擊查看這次服務的詳細內容" style="cursor:pointer;${k === i ? 'background:#eff6ff' : lastSavedLogId === x.id ? 'background:#fef9c3' : ''}">
        <td style="white-space:nowrap"><button class="ghost seq-btn" type="button" onclick="event.stopPropagation();goVisit(${k})">第 ${seqNo(n, k)} 筆</button>${seqTag(n, k)}</td>
        <td>${esc(x.date)}</td><td>${svcHtml(x)}</td>
        ${isPrint(dev) ? `<td class="num">${x.bw != null ? fmt(x.bw) : '—'}</td>
        <td class="num">${dev.hasColor && x.color != null ? fmt(x.color) : '—'}</td>${isLarge(dev) ? `<td class="num">${x.colorLarge != null ? fmt(x.colorLarge) : '—'}</td>` : ''}
        <td class="num" style="white-space:nowrap">${avgCellHtml(dev, mm)}</td>` : ''}
        <td style="font-size:13px">${clip(x.purchaseSignal, 20)}</td>
        <td>${mm.alerts.length ? `<span class="tag t-warn">${mm.alerts.length} 則提示</span>` : '<span class="tag t-ok">無</span>'}</td>
        <td><button class="ghost danger" type="button" onclick="event.stopPropagation();delLog('${x.id}')">刪除</button></td></tr>`;
    });
    const hRow = `<thead><tr><th style="white-space:nowrap">序號<div class="muted" style="font-weight:400;font-size:11px">1＝日期最近</div></th><th>日期</th><th>服務</th>${isPrint(dev) ? `<th class="num">黑白</th><th class="num">彩色</th>${isLarge(dev) ? '<th class="num">彩色大尺寸</th>' : ''}
      <th class="num">${avgHeadOf(dev)}</th>` : ''}<th>採購信號</th><th>系統提示</th><th></th></tr></thead>`;
    summary = `<div class="muted" style="font-size:13px;margin-bottom:4px">依服務日期排列，日期最近的為第 1 筆（與登打先後無關）。點擊任一列，詳細內容顯示在列表下方。</div>${recentSplitHtml(rowsArr, hRow, 'min-width:900px', seqNo(n, i) > HIST_SHOW)}`;
  }
  return `<div class="card sec-svc"><h2>服務紀錄</h2>${form}</div>
    <div class="card sec-svc"><h2>服務歷史紀錄</h2>${summary}${body}
      <p class="note">平均值依每次拜訪當時的近六個月視窗計算，與儀表板規則相同。</p></div>`;
}

// 耗材庫存：自動預估更換時間
function odorConsCardHtml(dev) {
  const names = odorReplNames(dev), m = odorLastRepl(dev);
  const rows = names.map(n => { const r = m.get(n); return `<tr><td><b>${esc(n)}</b></td><td>${r ? esc(r.date) : '<span class="muted">尚無更換紀錄</span>'}</td><td class="num">${r ? r.qty + ' 件' : '—'}</td><td class="num">${r ? r.n + ' 次' : '—'}</td></tr>`; }).join('');
  return `<div class="card sec-cons"><h2>耗材更換紀錄</h2>
    ${rows ? `<div style="overflow-x:auto"><table style="min-width:420px"><thead><tr><th>耗材項目</th><th>最近更換日</th><th class="num">最近更換數量</th><th class="num">累計次數</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">此設備類別尚未設定耗材更換項目。</div>'}
    <p class="note">除味設備的耗材更換只記錄在「服務紀錄」裡：新增保養紀錄時勾選「已更換」即可。這裡只列出紀錄，不管庫存、不推估更換日，也不會出現在儀表板的耗材提醒。</p></div>`;
}
function consHtml(dev) {
  if (!isPrint(dev)) return odorConsCardHtml(dev);   // V63：除味設備不使用耗材管理
  const groups = consGroups();
  const list = S.consumables.filter(c => c.deviceId === dev.id);
  const gOf = c => groups.find(g => g.members.some(s => s.c.id === c.id)) || null;
  const mg = groups.filter(g => g.merged && g.members.some(s => s.dev.id === dev.id));
  const mSum = mg.length ? `<div class="alert-box">本機的碳粉與同客戶同機種的設備合併計算：張數與用量加總，庫存為共用（任一台登打即同步），補貨時機以總用量為準。感光滾筒、廢粉回收盒、其他仍逐機計算。</div>
    <div style="overflow-x:auto"><table style="min-width:860px"><thead><tr><th>合併群組</th><th>耗材</th><th class="num">合併庫存</th><th class="num">合併月均用量</th><th>庫存可用至</th><th>狀態</th></tr></thead>
    <tbody>${mg.map(g => `<tr><td>${esc(custName(dev))}｜${esc(dev.model)}<div class="muted">${g.members.length} 台</div></td><td>${esc(g.name)}</td>
      <td class="num">${g.ok ? fmt(g.stock) + ' 件' : (g.missing ? '<span class="tag t-info">尚未填寫庫存</span>' : '—')}</td>
      <td class="num">${g.ok ? fmt(g.monthly) + ' ' + g.u + ' ／月' : '—'}</td>
      <td>${g.ok ? iso(g.exhaust) + `<div class="muted">約 ${Math.round(g.coverDays)} 天</div>` : '—'}</td><td>${tierTag(g)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const cu = custOf(dev);
  const rows = list.map(c => {
    const s = consStatus(c), g = gOf(c);
    if (!s || !g) return '';
    const obs = observedRatio(c);
    const obsTxt = obs == null ? '<span class="muted">尚無更換紀錄</span>'
      : `過去 ${obs.n} 次平均 ${(obs.r * 100).toFixed(0)}%` +
        (Math.abs(obs.r * 100 - (c.coverage ?? 100)) >= 10 ? ` <span class="tag t-warn">與設定差距大</span>` : '');
    const spec = c.basis === 'days' ? `${fmt(c.ratedLife)} 天`
      : `${fmt(c.ratedLife)} 張 × ${c.coverage ?? 100}% = <b>${fmt(effLife(c))} 張</b>`;
    const b = effBasis(c);
    const head = `${esc(c.name)}<div class="muted">${esc(c.category)}・${BASIS_LABEL[b]}${isToner(c) ? '（依顏色）' : '（逐機）'}</div>`;
    const priceTxt = `<div class="muted">單位成本 ${money(c.unitCost || 0)}／售 ${money(c.sellPrice || 0)}</div>`;
    const stockCell = `<td><form onsubmit="setStock(event,'${c.id}')" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0">
        <input name="stock" type="number" min="0" step="1" value="${c.stock == null ? '' : esc(c.stock)}" placeholder="未填寫" style="width:96px"><span class="muted">件</span>
        <button class="ghost" type="submit">儲存</button></form>
        ${c.stock == null ? '<div><span class="tag t-info">尚未填寫庫存</span></div>' : ''}${mergeMates(c).length > 1 ? '<div class="muted">合併群組共用庫存</div>' : ''}
        <div class="muted">安全 ${c.minStock ?? 0}・交期 ${c.leadDays ?? 7} 天</div></td>`;
    const cyc = cycleSignal(c);
    const cycTxt = cyc == null ? '' : cyc.n < 2 ? '<div class="muted">使用週期：更換紀錄不足兩次</div>'
      : `<div>使用週期：平均 ${fmt(cyc.avg)} 天${cyc.expect != null ? `（預期約 ${fmt(cyc.expect)} 天）` : ''}${cyc.abnormal ? ' <span class="tag t-danger">週期異常</span>' : ''}</div>`;
    const actions = `<div class="cons-act"><button class="ghost" type="button" onclick="markReplaced('${c.id}')">標記已更換</button>
      <button class="ghost" type="button" onclick="resetCons('${c.id}')">重置推估</button>
      <button class="ghost" type="button" onclick="editStock('${c.id}')">安全庫存</button></div>`;
    if (!s.ok || !g.ok) return `<tr style="background:#f8fafc"><td>${head}${actions}</td>
      <td style="font-size:13px">${spec}${priceTxt}</td><td>—</td>${stockCell}
      <td colspan="4"><span class="muted">${esc(s.ok ? g.reason : s.reason)}</span>${cycTxt}</td>
      <td>${tierTag(g)}</td></tr>`;
    const mu = `${fmt(s.monthly)} ${s.u} ／月${g.merged ? `<div class="muted">合併 ${g.members.length} 台</div>` : ''}`;
    const cover = `${iso(g.exhaust)}<div class="muted">約 ${Math.round(g.coverDays)} 天${g.merged ? '（合併）' : ''}</div>`;
    const order = g.orderIn < 0 ? `<span class="tag t-danger">已逾期 ${-g.orderIn} 天</span>` : `${iso(g.orderDate)}<div class="muted">${g.orderIn} 天後</div>`;
    return `<tr><td>${head}${actions}</td><td style="font-size:13px">${spec}<div class="muted">${obsTxt}</div>${priceTxt}${cycTxt}</td>
      <td class="num">${mu}</td>${stockCell}
      <td>${fmt(s.remaining)} ${s.u}<div class="muted">${leftTxt(s)}</div></td>
      <td>${iso(s.dueDate)}</td><td>${cover}</td>

      <td>${tierTag(g)}</td></tr>`;

let armedMsg = null, armedAt = 0;

let armed3 = {msg: null, n: 0, at: 0};
function confirmThrice(msg, key) {   // key：同一天、同名的不同項目也各算各的（例如同一天的兩筆服務紀錄）
  const now = Date.now(); armedMsg = null; const id3 = (key == null ? '' : key + '|') + msg;
  if (armed3.msg === id3 && now - armed3.at < 8000) {
    armed3.n++; armed3.at = now;
    if (armed3.n >= 3) { armed3 = {msg: null, n: 0, at: 0}; return true; }
    toast(`${msg}　刪除要連續按 3 次：目前第 ${armed3.n} 次，請再按 ${3 - armed3.n} 次（每次間隔 8 秒內）`);

  }
  armed3 = {msg: id3, n: 1, at: now};
  toast(`${msg}　刪除要連續按 3 次：目前第 1 次，請再按 2 次（每次間隔 8 秒內）`);
  return false;
}

  const now = Date.now(); armed3 = {msg: null, n: 0, at: 0};

// 逐次拜訪：增量、距上次天數、截至該次的近六個月平均、系統提示
function visitMetrics(dev, visits, i) {
  const v = visits[i], prev = i > 0 ? visits[i - 1] : null;
  const dt = toDate(v.date);
  const out = {gap: null, bwDelta: null, coDelta: null, avgBw: null, avgCo: null, rate: null, alerts: [], fix: [], events: []};   // V65：fix＝需要修正這筆紀錄的問題（才會列入設備提醒）
  if (prev) out.gap = daysBetween(toDate(prev.date), dt);

  if (isPrint(dev)) S.events.filter(e => e.date === v.date).forEach(e => {
    const c = S.consumables.find(x => x.id === e.consId && x.deviceId === dev.id);
    if (!c) return;
    out.events.push(c.name);
    (e.flags || []).forEach(f => out.alerts.push(`耗材更換異常（${c.name}）：${f}`));
  });
  else consReplOf(v).forEach(x => out.events.push(`${x.name} ×${x.qty}`));   // V63：除味設備只讀紀錄上勾選的更換項目

  const prevSvc = isSvcLog(v) ? visits.slice(0, i).reverse().find(isSvcLog) : null;   // V63：所有服務紀錄都算保養，拜訪間隔比對前一筆紀錄
  if (prevSvc) {
    const sg = daysBetween(toDate(prevSvc.date), dt);
    if (sg < 14) out.alerts.push(`距上次拜訪僅 ${sg} 天，請確認是否重複登錄`);
    { const mI = s => { const t = toDate(s); return t.getFullYear() * 12 + t.getMonth(); }, mg = mI(v.date) - mI(prevSvc.date);
      if (mg > devCycle(dev).m) out.alerts.push(`距上次拜訪已 ${mg} 個月，超過保養週期（${devCycle(dev).label}）`); }
  }

  if (isPrint(dev)) {
    if (v.bw == null) { out.alerts.push('本次未記錄張數'); if (devContract(dev) !== '賣斷') out.fix.push('本次未記錄張數'); }   // 賣斷機不需要抄表，不列提醒
    const prevR = visits.slice(0, i).reverse().find(x => x.bw != null);
    if (v.bw != null && prevR) {
      out.bwDelta = v.bw - prevR.bw;
      if (out.bwDelta < 0) { out.alerts.push('黑白張數低於上次，請確認是否換機或歸零'); out.fix.push('黑白張數低於上次，請確認是否換機或歸零'); }
      const vCo = colorOf(dev, v), pCo = colorOf(dev, prevR);
      if (dev.hasColor && vCo != null && pCo != null) {
        out.coDelta = vCo - pCo;
        if (out.coDelta < 0) { out.alerts.push('彩色張數低於上次，請確認是否換機或歸零'); out.fix.push('彩色張數低於上次，請確認是否換機或歸零'); }
      }
      const start = new Date(dt.getTime() - WIN * DAY);
      const pts = visits.slice(0, i + 1).filter(x => x.bw != null).map(x => ({dt: toDate(x.date), bw: x.bw, co: colorOf(dev, x)}));
      const inWin = pts.filter(p => p.dt >= start);
      const before = pts.filter(p => p.dt < start).pop();
      const seq = before ? [before, ...inWin] : inWin;
      if (seq.length >= 2) {
        const f = seq[0], l = seq[seq.length - 1];
        const months = (l.dt - f.dt) / DAY / MONTH;
        if (months > 0) {
          out.avgBw = (l.bw - f.bw) / months;
          if (dev.hasColor && l.co != null && f.co != null) out.avgCo = (l.co - f.co) / months;
        }
      }
      const mon = (dt - toDate(prevR.date)) / DAY / MONTH;
      if (mon > 0 && out.bwDelta >= 0) out.rate = out.bwDelta / mon;
      if (out.rate != null && out.avgBw > 0 && out.gap >= 14) {
        const dv = out.rate / out.avgBw - 1;
        if (Math.abs(dv) >= 0.5)
          out.alerts.push(`本次月用量 ${fmt(out.rate)} 張，較近六個月平均${dv > 0 ? '偏高' : '偏低'} ${Math.round(Math.abs(dv) * 100)}%`);
      }
    }
  }
  return out;
}

function addLog(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const txt = n => (f.get(n) || '').toString().trim();

const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());
function addStaff(e) {
  e.preventDefault(); if (!guardAdmin('僅管理者可新增人員')) return;
  const f = new FormData(e.target), t = n => (f.get(n) || '').toString().trim();
  if (!t('name')) return toast('請填寫姓名');
  if (S.staff.some(s => s.name === t('name'))) return toast('已有同名人員');
  const pw = CLOUD_ON ? '' : (f.get('pw') || '').toString();
  if (CLOUD_ON && !validEmail(t('email'))) return toast('請填寫正確的 Google 登入信箱');
  if (pw && pw.length < 4) return toast('初始密碼至少需要 4 碼');
  if (!pw && !CLOUD_ON) return toast('初始密碼至少需要 4 碼');
  const role = ROLES.includes(String(f.get('role'))) ? String(f.get('role')) : '工程部';
  const s = {id: uid(), name: t('name'), title: t('title'), phone: t('phone'), email: t('email').toLowerCase(), active: true, admin: role === '管理者', role, pw: null, extra: staffExtraFrom(f)};
  if (pw) setPw(s, pw);
  S.staff.push(s);
  if (S.ui && S.ui.goneStaff) S.ui.goneStaff = S.ui.goneStaff.filter(n => n !== s.name);
  logOp('新增人員', `${s.name}（${s.role}）`);
  save(); toast('已新增人員'); render();
}
function saveStaff(e, id) {
  e.preventDefault(); if (!guardAdmin('僅管理者可修改人員')) return;
  const s = S.staff.find(x => x.id === id); if (!s) return toast('找不到此人員');
  const f = new FormData(e.target), t = n => (f.get(n) || '').toString().trim();
  if (!t('name')) return toast('請填寫姓名');
  if (S.staff.some(x => x.id !== id && x.name === t('name'))) return toast('已有同名人員');
  const role = ROLES.includes(String(f.get('role'))) ? String(f.get('role')) : roleOf(s), admin = role === '管理者', active = f.get('active') === '1';
  const newPw = (f.get('newpw') || '').toString();
  if (newPw && newPw.length < 4) return toast('新密碼至少需要 4 碼');
  const otherAdmins = S.staff.filter(x => x.admin && x.active && x.id !== id).length;
  if ((!admin || !active) && s.admin && s.active && otherAdmins === 0) return toast('至少需保留一位在職管理者');
  if (CLOUD_ON && !validEmail(t('email'))) return toast('請填寫正確的 Google 登入信箱');
  const oldName = s.name, oldRole = roleOf(s);
  Object.assign(s, {name: t('name'), title: t('title'), phone: t('phone'), email: t('email').toLowerCase(), active, admin, role, extra: staffExtraFrom(f)});
  logOp('修改人員', oldName === s.name ? s.name : `${oldName}→${s.name}`);
  if (oldRole !== role) logOp('變更身份', `${s.name}：${oldRole} → ${role}`);
  if (newPw) { setPw(s, newPw); logOp('重設密碼', s.name); }
  save(); toast('已更新人員'); render();
}
function delStaff(id) {   // V74：真的刪除。管理者專用；不能刪自己；至少留一位在職管理者；要連按三次確認
  if (!guardAdmin('僅管理者可刪除人員')) return;
  const s = S.staff.find(x => x.id === id); if (!s) return toast('找不到此人員');
  if (s.id === CUR) return toast('不能刪除自己（目前登入中的帳號）');
  if (s.admin && s.active && !S.staff.some(x => x.admin && x.active && x.id !== id)) return toast('至少需保留一位在職管理者');
  if (!confirmThrice(`刪除「${s.name}」並收回登入權限？無法復原（暫時不用請改「停用」）`, s.id)) return;
  const n = (S.logs || []).filter(l => l.engineer === s.name).length;

  if (!CLOUD_ON) S.ui.goneStaff = [...new Set([...(S.ui.goneStaff || []), s.name])];   // 單機模式：避免重新開啟時被服務紀錄的姓名自動加回

function monthlyRows(from, to) {
  const out = [];
  S.devices.forEach(d => {
    if (!isPrint(d)) return;
    const c = S.customers.find(x => x.id === d.customerId) || {};
    const ls = S.logs.filter(l => l.deviceId === d.id && l.bw != null).sort((a, b) => a.date.localeCompare(b.date));
    const months = [...new Set(S.logs.filter(l => l.deviceId === d.id).map(l => l.date.slice(0, 7)))].sort();
    months.forEach(m => {
      if (from && m < from.slice(0, 7)) return;
      if (to && m > to.slice(0, 7)) return;
      const inM = ls.filter(l => l.date.slice(0, 7) === m);
      const before = ls.filter(l => l.date.slice(0, 7) < m);
      const end = inM[inM.length - 1], start = before[before.length - 1];
      const coEnd = inM.filter(l => colorOf(d, l) != null).pop(), coStart = before.filter(l => colorOf(d, l) != null).pop();
      const bwUse = end && start ? end.bw - start.bw : null;
      const coUse = d.hasColor && coEnd && coStart ? colorOf(d, coEnd) - colorOf(d, coStart) : null;
      const logsM = S.logs.filter(l => l.deviceId === d.id && l.date.slice(0, 7) === m);
      out.push([m, c.name || '', d.location, KIND[d.kind], d.model, end ? end.bw : '', d.hasColor && coEnd ? colorOf(d, coEnd) : '',
        bwUse != null && bwUse >= 0 ? bwUse : '', coUse != null && coUse >= 0 ? coUse : '',
        logsM.length, logsM.filter(isRepairLog).length]);
    });
  });
  return out;
}

function runExport(e) {
  e.preventDefault(); if (!denyIO()) return;
  const f = new FormData(e.target);
  const what = f.get('what'), fm = f.get('format');
  const from = (f.get('from') || '').toString(), to = (f.get('to') || '').toString();
  if (from && to && from > to) return toast('結束日期不可早於開始日期');
  if (what === 'logs') return fm === 'json'
    ? jsonOut(`printtown_logs_${rangeTag(from, to)}.json`, {range: {from, to}, logs: logsInRange(from, to)})
    : exportLogsCsv(from, to);
  if (what === 'monthly') return exportMonthlyCsv(from, to);
  if (what === 'roster') return exportRosterCsv();
  if (what === 'devices') return fm === 'json'
    ? jsonOut(`printtown_devices_${stampNow()}.json`, {devices: S.devices.map(d => ({...d, cycleLabel: devCycle(d).label}))}) : exportDevicesCsv();
  if (what === 'customers') return fm === 'json'
    ? jsonOut(`printtown_customers_${stampNow()}.json`, {customers: S.customers}) : exportCustomersCsv();
  if (what === 'cons') return fm === 'json'
    ? jsonOut(`printtown_consumables_${stampNow()}.json`, {consumables: S.consumables, catalog: S.catalog}) : exportConsCsv();
}

let restorePreview = null;                 // 待確認的還原內容（只存在記憶體，不寫入瀏覽器）
const RESTORE_LIMIT = 20 * 1024 * 1024;    // 備份檔上限 20MB
const RESTORE_MAX_ROWS = 50000;            // 每個集合筆數上限
const RESTORE_STR_MAX = 10000;             // 單一文字欄位長度上限
const RESTORE_COLLS = ['customers', 'devices', 'logs', 'consumables', 'events', 'catalog'];

// 檢查備份檔：格式、編號、重複、日期與數值、文字長度、資料關聯。任一項不通過就整份拒絕，不做部分還原。
function checkBackup(obj) {
  const fail = m => ({ok: false, msg: m});
  if (!obj || typeof obj !== 'object' || Array.isArray(obj) || obj.app !== 'printtown-service' || !obj.data || typeof obj.data !== 'object')
    return fail('這不是普印通設備保養系統的備份檔（找不到 app 或 data 欄位）。');
  const d = obj.data, out = {}, counts = {};
  for (const c of RESTORE_COLLS) {
    const arr = d[c] == null ? [] : d[c];
    if (!Array.isArray(arr)) return fail(`「${c}」格式錯誤（應為陣列）。`);
    if (arr.length > RESTORE_MAX_ROWS) return fail(`「${c}」筆數超過上限（${RESTORE_MAX_ROWS}）。`);
    const seen = new Set();
    for (const it of arr) {
      if (!it || typeof it !== 'object' || Array.isArray(it)) return fail(`「${c}」有不是物件的資料列。`);
      if (typeof it.id !== 'string' || !ID_RE.test(it.id)) return fail(`「${c}」有格式不合法的編號。`);
      if (seen.has(it.id)) return fail(`「${c}」有重複的編號。`);
      seen.add(it.id);
      if (!okData(c, it)) return fail(`「${c}」有日期或數值格式不正確的資料。`);
      for (const k of Object.keys(it)) {
        const v = it[k];
        if (typeof v === 'string' && v.length > RESTORE_STR_MAX) return fail(`「${c}」有過長的文字欄位。`);
        if (typeof v === 'number' && !isFinite(v)) return fail(`「${c}」有無效的數值。`);
        if (k === 'tags' && v != null && !Array.isArray(v)) return fail(`「${c}」的標籤格式不正確。`);
      }
    }
    out[c] = arr; counts[c] = arr.length;
  }
  if (out.devices.some(x => !KIND_ORDER.includes(x.kind))) return fail('有不認識的設備類別。');
  if (out.devices.some(x => x.installDate != null && x.installDate !== '' && !KIND_DATE_RE.test(String(x.installDate)))) return fail('有格式不正確的安裝時間。');
  const cIds = new Set(out.customers.map(x => x.id)), dIds = new Set(out.devices.map(x => x.id)), kIds = new Set(out.consumables.map(x => x.id));
  if (out.devices.some(x => !cIds.has(x.customerId))) return fail('有設備所屬的客戶不在備份中。');
  if (out.logs.some(x => !dIds.has(x.deviceId))) return fail('有服務紀錄所屬的設備不在備份中。');
  if (out.consumables.some(x => !dIds.has(x.deviceId))) return fail('有耗材所屬的設備不在備份中。');
  if (out.events.some(x => !kIds.has(x.consId))) return fail('有耗材事件所屬的耗材不在備份中。');
  // 補齊舊格式可能缺少的欄位，避免畫面因缺欄位出錯
  out.customers.forEach(x => { x.tags = x.tags || []; });
  out.devices.forEach(x => { x.tags = x.tags || []; x.feat = x.feat || {}; ['bwRate', 'colorRate', 'monthlyFee'].forEach(k => delete x[k]); });   // V55：舊備份的費率不還原到保養系統
  return {ok: true, data: out, counts};
}

function previewRestore(e) {
  const input = e.target, file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (!guardAdmin('僅管理者可還原備份')) return;
  if (file.size > RESTORE_LIMIT) { restorePreview = null; toast('備份檔超過 20MB，無法還原'); return render(); }
  const reader = new FileReader();
  reader.onload = () => {
    let obj = null;
    try { obj = JSON.parse(String(reader.result)); } catch (err) { obj = null; }
    if (obj === null) { restorePreview = null; toast('無法讀取：不是有效的 JSON 檔'); return render(); }
    const r = checkBackup(obj);
    if (!r.ok) { restorePreview = null; toast('還原檢查未通過：' + r.msg); return render(); }
    restorePreview = {data: r.data, counts: r.counts, name: file.name.slice(0, 120)};
    toast('檢查通過，請確認後按「確認還原」'); render();
  };
  reader.readAsText(file);
}

function applyRestore() {
  if (!guardAdmin('僅管理者可還原備份')) return;
  if (!restorePreview) return toast('請先選擇備份檔');
  const p = restorePreview, n = p.counts;
  if (!confirmTwice(`還原「${p.name}」？將取代目前的客戶、設備、服務紀錄與耗材（目前客戶 ${S.customers.length} 位→備份 ${n.customers} 位）。人員不會被改動。`)) return;
  exportBackup();   // 還原前先自動下載目前資料的備份
  S.customers = p.data.customers; S.devices = p.data.devices; S.logs = p.data.logs;
  S.consumables = p.data.consumables; S.events = p.data.events;
  const have = new Set(S.catalog.map(x => x.id)); let addCat = 0;
  p.data.catalog.forEach(x => { if (!have.has(x.id)) { S.catalog.push(x); addCat++; } });
  restorePreview = null; selCust = null; selDev = null; chartIdx = null; quickDev = null;
  planCust = null; planDevId = null; editLogId = null; lastStockAlert = null;
  ensureSel();
  logOp('還原備份', `${p.name}｜客戶 ${n.customers}、設備 ${n.devices}、服務紀錄 ${n.logs}、耗材 ${n.consumables}、耗材目錄新增 ${addCat}`);
  save(); toast(`已還原：客戶 ${n.customers} 位、設備 ${n.devices} 台、服務紀錄 ${n.logs} 筆、耗材 ${n.consumables} 項`); render();
}

/* 匯入 CSV（僅新增，不覆蓋既有資料） */
function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === '')).map(r => r.map(c => /^'[=+\-@\t\r]/.test(c) ? c.slice(1) : c));   // 還原匯出時加的防注入符號
}

const hashPw = (pw, salt) => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const str = salt + '|' + pw;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const setPw = (s, pw) => { const salt = uid(); s.pw = {salt, h: hashPw(pw, salt)}; };
const checkPw = (s, pw) => !!(s.pw && hashPw(pw, s.pw.salt) === s.pw.h);

}

`;
  return pwCard + `<div class="card"><h2>我的操作紀錄</h2>
      <div class="stats"><div class="stat"><div class="muted">操作總筆數</div><div class="n">${mine.length}</div></div>
      <div class="stat"><div class="muted">最近操作</div><div style="font-size:14px">${mine.length ? fmtTs(mine[mine.length - 1].t) : '—'}</div></div></div>
      ${mine.length ? `<div class="note">依動作統計：${Object.entries(cnt).map(([k, v]) => `${esc(k)} ${v} 次`).join('、')}</div>` : ''}
      <div style="overflow-x:auto;margin-top:10px"><table style="min-width:520px"><thead><tr><th>時間</th><th>動作</th><th>內容</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" class="empty">尚無紀錄</td></tr>'}</tbody></table></div>
      <p class="note">僅顯示最近 50 筆。完整分析請管理者於「操作分析」查看。</p></div>`;
}

/* ---- 操作分析（僅管理者） ---- */
let opsF = {staff: '', action: '', from: '', to: ''};
function setOpsFilter(e) {
  e.preventDefault(); const f = new FormData(e.target);
  opsF = {staff: f.get('staff') || '', action: f.get('action') || '', from: f.get('from') || '', to: f.get('to') || ''};
  render();
}
function viewOps() {
  if (!isAdmin()) return '<div class="card"><div class="empty">操作分析僅限管理者使用。</div></div>';
  const all = S.oplog || [];
  const dayOf = o => iso(new Date(o.t));
  const people = [...new Set(all.map(o => o.staff))].sort();
  const actionsAll = [...new Set(all.map(o => o.action))].sort();
  const rows = all.filter(o => (!opsF.staff || o.staff === opsF.staff) && (!opsF.action || o.action === opsF.action) && inRange(dayOf(o), opsF.from, opsF.to));
  const byPerson = {}, byAction = {}, byDay = {}, cell = {}, lastAt = {};
  rows.forEach(o => {
    byPerson[o.staff] = (byPerson[o.staff] || 0) + 1;
    byAction[o.action] = (byAction[o.action] || 0) + 1;
    const d = dayOf(o); byDay[d] = (byDay[d] || 0) + 1;
    const k = JSON.stringify([o.staff, o.action]); cell[k] = (cell[k] || 0) + 1;
  });
  all.forEach(o => { if (!lastAt[o.staff] || o.t > lastAt[o.staff]) lastAt[o.staff] = o.t; });
  const persons = Object.keys(byPerson).sort((a, b) => byPerson[b] - byPerson[a]);
  const acts = Object.keys(byAction).sort((a, b) => byAction[b] - byAction[a]);
  const days = Object.keys(byDay).sort().slice(-31);
  const maxDay = Math.max(1, ...days.map(d => byDay[d]));
  const sel = (name, list, cur, label) => `<select name="${name}"><option value="">${label}</option>${list.map(x => `<option value="${esc(x)}" ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  const pivotHead = acts.map(a => `<th class="num">${esc(a)}</th>`).join('');
  const pivot = persons.map(p => `<tr><td><b>${esc(p)}</b></td>${acts.map(a => `<td class="num">${cell[JSON.stringify([p, a])] || '—'}</td>`).join('')}<td class="num"><b>${byPerson[p]}</b></td><td class="muted" style="white-space:nowrap">${fmtTs(lastAt[p])}</td></tr>`).join('');
  const dailyRows = days.map(d => `<tr><td style="white-space:nowrap">${d}</td><td style="width:100%"><div style="height:10px;background:#7c3aed;border-radius:4px;width:${(byDay[d] / maxDay * 100).toFixed(1)}%"></div></td><td class="num">${byDay[d]}</td></tr>`).join('');
  const detail = rows.slice().sort((a, b) => b.t.localeCompare(a.t)).slice(0, 300).map(o => `<tr><td class="muted" style="white-space:nowrap">${fmtTs(o.t)}</td><td>${esc(o.staff)}</td><td>${esc(o.action)}</td><td style="font-size:13px">${esc(o.summary)}</td></tr>`).join('');
  const loginCount = rows.filter(o => o.action === '登入').length;
  return `<div class="card sec-report"><h2>操作分析</h2>
    <form onsubmit="setOpsFilter(event)" class="form-row">
      <div><label>人員</label>${sel('staff', people, opsF.staff, '全部人員')}</div>
      <div><label>動作</label>${sel('action', actionsAll, opsF.action, '全部動作')}</div>
      <div><label>起日</label><input type="date" name="from" value="${esc(opsF.from)}"></div>
      <div><label>迄日</label><input type="date" name="to" value="${esc(opsF.to)}"></div>
      <div><button class="primary" type="submit">套用篩選</button></div></form>
    <div class="stats">
      <div class="stat"><div class="muted">操作筆數</div><div class="n">${rows.length}</div></div>
      <div class="stat"><div class="muted">操作人數</div><div class="n">${persons.length}</div></div>
      <div class="stat"><div class="muted">登入次數</div><div class="n">${loginCount}</div></div>
      <div class="stat"><div class="muted">有操作的天數</div><div class="n">${Object.keys(byDay).length}</div></div>
    </div>
    <p class="note">上方篩選條件同時套用於以下所有統計。紀錄保存在本機瀏覽器中。</p></div>
    <div class="card sec-report"><h2>人員 × 動作次數</h2>
      ${persons.length ? `<div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>人員</th>${pivotHead}<th class="num">合計</th><th>最後操作</th></tr></thead><tbody>${pivot}</tbody></table></div>` : '<div class="empty">沒有符合條件的紀錄。</div>'}
    </div>
    <div class="card sec-report"><h2>每日操作量（最近 31 個有紀錄的日子）</h2>
      ${days.length ? `<table style="min-width:0"><tbody>${dailyRows}</tbody></table>` : '<div class="empty">沒有符合條件的紀錄。</div>'}
    </div>
    <div class="card sec-report"><h2>操作明細</h2>
      <div style="overflow-x:auto"><table style="min-width:620px"><thead><tr><th>時間</th><th>人員</th><th>動作</th><th>內容</th></tr></thead>
      <tbody>${detail || '<tr><td colspan="4" class="empty">沒有符合條件的紀錄。</td></tr>'}</tbody></table></div>
      <p class="note">僅顯示最新 300 筆（共 ${rows.length} 筆符合條件）。</p>
    </div>`;
}
function denyDelete() { toast('本版本不提供刪除資料'); return false; }
function denyIO() { return guardAdmin('匯入、匯出與備份僅限管理者使用'); }
function guardAdmin(msg) { if (isAdmin()) return true; toast(msg || '此功能僅限管理者使用'); return false; }
function catUsage(id) { return S.consumables.filter(c => c.catalogId === id).length; }
// 修改目錄規格時，同步更新所有已使用此項目的耗材（保留各設備自己的安裝資料與庫存）
function propagateCatalog(k) {
  S.consumables.filter(c => c.catalogId === k.id).forEach(c => {
    c.name = k.name; c.category = k.category; c.ratedLife = k.ratedLife;
    c.coverage = k.basis === 'days' ? 100 : k.coverage; c.unitCost = k.unitCost;
    c.sellPrice = k.sellPrice; c.leadDays = k.leadDays;
  });
}
function readCatalogForm(f, fixedBasis) {
  const name = (f.get('name') || '').toString().trim();
  const basis = fixedBasis || f.get('basis'), ratedLife = +f.get('ratedLife');
  const cov = basis === 'days' ? 100 : (+f.get('coverage') || 83);
  if (!name) return {err: '請填寫耗材名稱'};
  if (!(ratedLife > 0)) return {err: '原廠壽命需大於 0'};
  if (!(cov > 0 && cov <= 200)) return {err: '實際使用比率需介於 1 與 200 之間'};
  return {v: {name, category: f.get('category'), basis, ratedLife, coverage: cov,
    unitCost: Math.max(0, +f.get('unitCost') || 0), sellPrice: Math.max(0, +f.get('sellPrice') || 0),
    leadDays: Math.max(0, +f.get('leadDays') || 0)}};
}
function addCatalog(e) {
  e.preventDefault(); if (!guardAdmin('僅管理者可新增耗材目錄')) return;
  const r = readCatalogForm(new FormData(e.target)); if (r.err) return toast(r.err);
  logOp('新增耗材目錄', r.v.name);
  S.catalog.push({id: uid(), ...r.v}); save(); toast('已新增耗材目錄'); render();
}
function saveCatalog(e, id) {
  e.preventDefault(); if (!guardAdmin('僅管理者可修改設定')) return;
  const k = S.catalog.find(x => x.id === id); if (!k) return toast('找不到此耗材');
  const r = readCatalogForm(new FormData(e.target), k.basis); if (r.err) return toast(r.err);
  Object.assign(k, r.v, {basis: k.basis});   // 計量依據建立後不可改，避免歷史資料失真
  logOp('修改耗材目錄', k.name);
  propagateCatalog(k); save(); toast(`已更新「${k.name}」，${catUsage(id)} 筆設備耗材同步更新`); render();
}
function delCatalog(id) {
  if (!guardAdmin('僅管理者可刪除耗材目錄')) return;
  const k = S.catalog.find(x => x.id === id); if (!k) return toast('找不到此耗材');
  const cons = S.consumables.filter(c => c.catalogId === id);
  const ids = new Set(cons.map(c => c.id));
  const evN = S.events.filter(e => ids.has(e.consId)).length;
  const msg = cons.length
    ? `刪除耗材目錄「${k.name}」？將一併移除 ${cons.length} 台設備的此耗材與 ${evN} 筆更換事件（服務紀錄保留）。此動作無法復原。`
    : `刪除耗材目錄「${k.name}」？此動作無法復原。`;
  if (!confirmThrice(msg, id)) return;
  logOp('刪除耗材目錄', `${k.name}${cons.length ? `（連帶移除 ${cons.length} 台設備耗材）` : ''}`);
  S.consumables = S.consumables.filter(c => !ids.has(c.id));
  S.events = S.events.filter(e => !ids.has(e.consId));
  S.catalog = S.catalog.filter(x => x.id !== id);
  save(); toast('已刪除耗材目錄'); render();
}
function addCons(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const dev = S.devices.find(x => x.id === f.get('deviceId'));
  const k = S.catalog.find(x => x.id === f.get('catalogId'));
  if (!dev || !k) return toast('請選擇耗材項目（規格由管理者在「設定」維護）');
  const isDays = k.basis === 'days';
  if (!isPrint(dev) && !isDays) return toast('此耗材為張數依據，不適用商用空氣清淨機');
  if (isPrint(dev) && isDays) return toast('此耗材為天數依據，不適用事務設備');
  if (k.basis === 'color' && !dev.hasColor) return toast('此為黑白機，不能以彩色張數計算');
  if (CAT_COLOR.includes(k.category) && !dev.hasColor) return toast(`${k.category}只適用彩色機`);
  let ib = null, ic = null, it = null;
  if (!isDays) {
    const lr = lastReading(dev.id);
    const num = n => { const r = f.get(n); return r === null || r === '' ? null : +r; };
    ib = num('ib') ?? (lr ? lr.bw : null);
    ic = dev.hasColor ? (num('ic') ?? (lr ? lr.color : null)) : null;
    it = num('it') ?? (ib == null ? null : ib + (ic || 0));
    if (ib == null) return toast('請填寫更換當下的黑色張數');
    if (dev.hasColor && ic == null) return toast('彩色機請填寫更換當下的彩色張數');
  }
  S.consumables.push({id: uid(), deviceId: dev.id, catalogId: k.id, category: k.category, name: k.name, basis: k.basis,
    ratedLife: k.ratedLife, coverage: isDays ? 100 : (k.coverage ?? 100), unitCost: k.unitCost || 0, sellPrice: k.sellPrice || 0,
    installBw: ib, installColor: ic, installTotal: it, installDate: f.get('installDate'),
    stock: (f.get('stock') === null || f.get('stock') === '') ? null : Math.max(0, Math.floor(+f.get('stock')) || 0), minStock: Math.max(0, +f.get('minStock') || 0), leadDays: k.leadDays ?? 7});
  const nc = S.consumables[S.consumables.length - 1];
  { const sv = nc.stock != null ? nc.stock : sharedStock(nc); if (sv != null) setSharedStock(nc, sv); }   // 合併群組共用庫存
  logOp('新增耗材', `${custName(dev)}｜${dev.model}｜${k.name}`);
  save(); toast('已新增耗材'); render();
}
function editStock(id) {
  const c = S.consumables.find(x => x.id === id); if (!c) return;
  const m = prompt('安全庫存（件）', String(c.minStock ?? 0));
  if (m === null) return;
  if (!(+m >= 0)) return toast('數量格式不正確');
  c.minStock = Math.floor(+m);
  logOp('修改安全庫存', `${c.name}：安全庫存 ${c.minStock}`);
  save(); toast('已更新安全庫存'); render();
}
function markReplaced(id) {
  const c = S.consumables.find(x => x.id === id);
  const dev = S.devices.find(x => x.id === c.deviceId);
  const L = effLife(c);
  let newRead = null, consumed = null;

  if (effBasis(c) === 'days') {
    consumed = daysBetween(toDate(c.installDate), today());
  } else {
    const g = currentEstimate(dev.id);
    if (!g) return toast('尚無張數讀數，無法推估');
    const bw = prompt(`更換當下的黑白張數（估計 ${fmt(g.bw)}）`, String(Math.round(g.bw)));
    if (bw === null || !(+bw >= 0)) return;
    let color = null;
    if (dev.hasColor) {
      const co = prompt(`更換當下的彩色張數（估計 ${fmt(g.color)}）`, String(Math.round(g.color)));
      if (co === null || !(+co >= 0)) return;
      color = +co;
    }
    let total = +bw + (color || 0);
    if (effBasis(c) === 'total' && dev.hasColor) {
      const t = prompt(`更換當下的總計張數（黑色＋彩色，預設 ${fmt(+bw + color)}）`, String(+bw + color));
      if (t === null || !(+t >= 0)) return;
      total = +t;
    }
    newRead = {bw: +bw, color, total};
    const prev = basisOf({bw: c.installBw, color: c.installColor, total: c.installTotal}, effBasis(c));
    consumed = prev == null ? null : basisOf(newRead, effBasis(c)) - prev;
  }

  const flags = [];
  if (consumed != null && consumed < L * EARLY_RATIO)
    flags.push(`提早更換：實際用量約為有效壽命的 ${Math.round(consumed / L * 100)}%`);
  const lastEv = S.events.filter(e => e.consId === c.id).sort((a, b) => a.date.localeCompare(b.date)).pop();
  if (lastEv) {
    const gap = daysBetween(toDate(lastEv.date), today());
    if (gap < REPEAT_DAYS) flags.push(`距上次更換僅 ${gap} 天，異常頻繁`);
  }

  S.events.push({id:uid(), consId:c.id, date:iso(today()), consumed, rated:c.ratedLife, effLife:L, basis:effBasis(c), flags});
  if (newRead) { c.installBw = newRead.bw; c.installColor = newRead.color; c.installTotal = newRead.total; }
  c.installDate = iso(today());
  const shv = sharedStock(c);   // 合併碳粉共用庫存
  if (shv == null) { /* 尚未填寫庫存：不扣減 */ }
  else if (shv > 0) setSharedStock(c, shv - 1);
  else toast(`${c.name} 庫存已為 0，請確認是否已補貨`);

  logOp('記錄更換耗材', `${c.name}（${custName(dev)}）`);
  save();
  if (flags.length) toast(`已記錄更換。注意：${flags.join('；')}`);
  else toast('已記錄更換，重新推估');
  render();
}
function delCons(id) {
  if (!denyDelete()) return;
  if (!confirmThrice('刪除此耗材設定？相關更換紀錄會保留。', id)) return;
  S.consumables = S.consumables.filter(x => x.id !== id); save(); render();
}

/* ================= 啟動 ================= */
boot();
</script>
