<html lang="zh-Hant">

<title>普印通 設備保養系統 v36</title>
<style>
:root{--yellow:#ca8a04;--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e5e7eb;--brand:#1f5fbf;--warn:#b45309;--danger:#b91c1c;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 auto 0 0}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.active{background:#fff;color:var(--brand);font-weight:600}
main{padding:20px;max-width:1320px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}
h2{font-size:16px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
input,select,textarea{padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;width:100%;background:#fff}
input[type=number].sm{width:110px}
input[type=checkbox]{width:auto}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:700}
details.fold{margin:0 0 16px}
details.fold>summary{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:600;color:var(--ink);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--muted)}
details.fold[open]>summary::before{content:"▾ "}
details.fold>.card:first-of-type{margin-top:12px}
button.primary{background:var(--brand);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.ghost{background:#fff;border:1px solid #cbd5e1;padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
button.ghost:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
button.ghost:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-danger{background:#fee2e2;color:var(--danger)}
.t-warn{background:#fef3c7;color:var(--warn)}
.t-ok{background:#dcfce7;color:var(--ok)}
.t-info{background:#e0e7ff;color:#3730a3}
.t-gray{background:#f3f4f6;color:#374151}
.muted{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.empty{color:var(--muted);padding:12px 0}
.alert-box{border-left:4px solid var(--yellow);background:#fefce8;padding:10px 14px;border-radius:6px;margin:0 0 12px;font-size:14px}
.neg{color:var(--danger)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.switch input{width:18px;height:18px}
.taBox{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;max-width:90vw;z-index:9}

.plan-table{min-width:0;width:100%;font-size:13px;border-collapse:collapse}
.plan-table th,.plan-table td{padding:6px;border:1px solid #cbd5e1;vertical-align:top}
.plan-table .ck{text-align:center;font-size:16px;width:44px}
.plan-table .blank{width:90px}
.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none !important}
  .print-only{display:block}
  .plan-table th,.plan-table td{font-size:11px;padding:4px}
  .plan-table .blank{height:26px}
  .plan-table tr{page-break-inside:avoid}
}
/* v26 色彩分層：客戶（白）／設備（藍）／服務（綠）／耗材（琥珀）／提醒（紅）／分析（紫）／設定（灰） */
.card.sec-cust{background:#ffffff;border-left:6px solid #1f5fbf}
.card.sec-dev{background:#f3f8ff;border-left:6px solid #3b82f6}
.card.sec-svc{background:#f2fbf5;border-left:6px solid #16a34a}
.card.sec-cons{background:#fffbeb;border-left:6px solid #d97706}
.card.sec-remind{background:#fff5f5;border-left:6px solid #dc2626}
.card.sec-report{background:#f7f5ff;border-left:6px solid #7c3aed}
.card.sec-set{background:#f4f4f5;border-left:6px solid #6b7280}
.dev-zone{background:#eaf2ff;border:1px solid #c9dcf7;border-radius:8px;padding:8px;margin-top:10px}
.dev-zone table{background:transparent}
.add-dev{width:100%;margin-top:8px;border-style:dashed;color:#1f5fbf}
.login-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.ptag{display:inline-block;color:#fff;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.tgck{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;cursor:pointer}
.tagck-row{display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:4px}
.ptag-btn{color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.ptag-btn.off{opacity:.45}
.ghost.danger{color:#b91c1c;border-color:#fca5a5}
.tag-bar{border:1.5px dashed #94a3b8;border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card,#fff)}
.tag-bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag-bar-title{font-weight:700}
.tag-edit-btn{border:1px solid #1e5fbf;color:#1e5fbf;background:#fff;border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer;font-size:14px}
.tag-edit-btn:hover{background:#eff6ff}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.tag-editor{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:8px}
details.tag-editor>summary{cursor:pointer;font-weight:600}
.tagset-row{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #e2e8f0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;display:inline-block;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw span{display:block;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1px #94a3b8;border:2px solid #fff}
.sw input:checked + span{box-shadow:0 0 0 3px #1e293b}
.sw input:focus-visible + span{outline:2px solid #2563eb;outline-offset:2px}
@media (max-width:640px){.tagset-row{grid-template-columns:1fr}}
</style>

<body>
<header>
  <h1>普印通 設備保養系統 <span style="font-weight:400;font-size:13px;opacity:.85">v36</span></h1>
  <nav id="nav" style="display:none">
    <button data-v="dash" class="active" onclick="go('dash')">儀表板</button>
    <button data-v="plan" onclick="go('plan')">保養客戶一覽</button>
    <button data-v="manage" onclick="go('manage')">設備資料總覽</button>
    <button data-v="me" onclick="go('me')">我的帳號</button>
    <button id="navOps" data-v="ops" onclick="go('ops')" style="display:none">操作分析</button>
    <button id="navSettings" data-v="settings" onclick="go('settings')" style="display:none">設定</button>
  </nav>
  <div id="roleBox" style="display:none;gap:6px;align-items:center;margin-left:8px"><span id="cloudSt" style="font-size:12px;opacity:.85;margin-right:4px"></span><span id="roleLabel" style="font-size:13px;opacity:.95"></span><button onclick="logout()" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer">登出</button></div>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
/* ================= 常數 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const DAY = 864e5, MONTH = 30.4;
const WIN = 183, M = WIN / MONTH;          // 近六個月視窗
const WARN_CONS = 60;                       // 耗材提醒：60 天內需上機或需備貨
const WARN_SVC = 14, WARN_ABN_DAYS = 180;
const EARLY_RATIO = 0.6, REPEAT_DAYS = 60;
const KIND = {copier:'複合機', printer:'印表機', purifier:'空氣清淨機'};
const CYCLE_OPTS = [{m:1,label:'一個月',days:30},{m:2,label:'雙月',days:60},{m:3,label:'每季',days:90},{m:6,label:'半年',days:180}];
const cycleOf = c => CYCLE_OPTS.find(o => o.m === (c && c.cycleMonths)) || CYCLE_OPTS[2];
const devCycle = d => CYCLE_OPTS.find(o => o.days === (d && d.cycleDays)) || CYCLE_OPTS[2];   // 保養週期以設備為準
const VAR_WARN = 0.3;      // 用量變化達 ±30% 才提示
const REPAIR_WARN = 1.5;   // 近30日維修 ≥ 前六個月月均 × 1.5 才提示
const TYPES = ['定期保養','維修','換耗材','巡檢'];
const CONTRACTS = ['計張','賣斷','零元機'];
const CONTRACT_CLS = {計張:'t-info', 賣斷:'t-gray', 零元機:'t-warn'};
const CATS = ['黑色碳粉','藍色碳粉','紅色碳粉','黃色碳粉','感光滾筒','回收盒','濾網','其他'];
const CAT_COLOR = ['藍色碳粉','紅色碳粉','黃色碳粉'];
const BASIS_LABEL = {bw:'黑色張數', color:'彩色張數', total:'總計張數', days:'天數'};
const isPrint = d => d.kind !== 'purifier';
const money = n => (n < 0 ? '-' : '') + 'NT$ ' + Math.round(Math.abs(n)).toLocaleString('zh-TW');

/* ================= 日期工具 ================= */
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const addDays = (dt, n) => new Date(dt.getTime() + n * DAY);
const fmt = n => Math.round(n).toLocaleString('zh-TW');

/* ================= 資料與儲存 ================= */
const KEY = 'printtown-service-v7', OLD_KEY = 'printtown-service-v5';
function readKey(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
// v27：每位人員以「姓名＋密碼」登入；管理者權限由人員設定。不提供刪除、匯入、匯出與備份。
// 注意：本系統資料在瀏覽器內，密碼與權限為操作防護，非資安等級的保護。
const CUR_KEY = 'printtown-cur';
let CUR = null;
try { CUR = sessionStorage.getItem(CUR_KEY); } catch (e) {}
const curStaff = () => ((S && S.staff) || []).find(s => s.id === CUR && s.active) || null;
const isAdmin = () => !!(curStaff() && curStaff().admin);
let S = readKey(KEY);
if (!S || !Array.isArray(S.devices)) {
  const old = readKey(OLD_KEY);
  S = {customers: [], devices: [], logs: [], consumables: [], events: [], ui: {showRates: false}};
}
S.customers = S.customers || [];
S.events = S.events || [];
S.ui = S.ui || {showRates:false};
S.staff = S.staff || []; S.staffFields = S.staffFields || [];
S.customers.forEach(c => {
  if (!CYCLE_OPTS.some(o => o.m === c.cycleMonths)) c.cycleMonths = 3;
  if (c.phone == null) c.phone = '';
  if (c.phone2 == null) c.phone2 = '';
  if (c.contact == null) c.contact = '';
  if (c.address == null) c.address = '';
  if (c.note == null) c.note = '';
});
S.devices.forEach(d => { if (d.cycleDays == null) { const c = S.customers.find(x => x.id === d.customerId); d.cycleDays = c ? cycleOf(c).days : 90; } });
// v23：客戶與設備資料一次性清空，之後重新匯入（僅執行一次）
try {
  if (!localStorage.getItem('printtown-reset-v23')) {
    S.customers = []; S.devices = []; S.logs = []; S.consumables = []; S.events = [];
    localStorage.setItem('printtown-reset-v23', '1');
  }
} catch (e) {}
S.auth = S.auth || {adminPin: null};
S.oplog = S.oplog || [];
S.staff.forEach(s => { if (s.admin == null) s.admin = false; if (s.pw === undefined) s.pw = null; });
if (!curStaff()) CUR = null;
S.catalog = S.catalog || [];
if (!S.ui.cov83) {
  S.catalog.forEach(k => { if (k.basis !== 'days') k.coverage = 83; });
  S.consumables.forEach(c => { if (c.basis !== 'days') c.coverage = 83; });
  S.ui.cov83 = true;
}
S.consumables.forEach(c => { if (c.installTotal === undefined) c.installTotal = c.installBw == null ? null : c.installBw + (c.installColor || 0); });
S.consumables.forEach(c => {
  if (c.catalogId && S.catalog.some(x => x.id === c.catalogId)) return;
  let k = S.catalog.find(x => x.name === c.name && x.basis === c.basis && x.category === c.category &&
    x.ratedLife === c.ratedLife && (x.coverage ?? 100) === (c.coverage ?? 100));
  if (!k) {
    k = {id: uid(), name: c.name, category: c.category, basis: c.basis, ratedLife: c.ratedLife,
         coverage: c.basis === 'days' ? 100 : (c.coverage ?? 100), unitCost: c.unitCost || 0,
         sellPrice: c.sellPrice || 0, leadDays: c.leadDays ?? 7};
    S.catalog.push(k);
  }
  c.catalogId = k.id;
});

/* ================= v32：雲端同步（只暫存未送出的變更、增量同步）、Google 登入與管理者核准 ================= */
// 雲端設定放在 config.js（更新程式時不需要改動）。未設定時為「本機模式」。
const CLOUD = window.PT_CLOUD || {url: '', key: ''};
const CLOUD_ON = /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CLOUD.url || '') && (CLOUD.key || '').length > 20 && !/貼上|你的專案/.test(CLOUD.url + CLOUD.key);
const HOSTED = location.protocol === 'https:';   // 放在網路上的版本：一定要使用雲端，不提供本機登入
const ARR_COLLS = ['customers','devices','logs','consumables','events','staff','staffFields','catalog','oplog'];
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;           // 編號格式檢查：防止來路不明的資料注入畫面
const OPLOG_LOAD = 3000;                          // 載入時只取最近的操作紀錄（完整紀錄保存在雲端）
const FULL_CHECK_EVERY = 10;                     // 每 10 次增量同步，做一次完整的刪除對照
const okRow = (coll, id) => ((coll === 'meta' && id === 'ui') || ARR_COLLS.includes(coll)) && ID_RE.test(String(id));
// 必須有日期欄位的集合：日期必須是可解析的字串，否則排序與篩選會出錯
const DATE_FIELD = {logs: 'date', events: 'date', oplog: 't'};
function okData(coll, d) {
  if (!d || typeof d !== 'object') return false;
  const f = DATE_FIELD[coll];
  if (!f) return true;
  return typeof d[f] === 'string' && d[f].length > 0 && !isNaN(Date.parse(d[f]));
}
let sb = null, synced = new Map(), cloudReady = false, cloudPhase = 'init', cloudErr = '', AUTH_EMAIL = '', AUTH_NAME = '';
let syncing = false, pendingPush = false, renderTimer = null, accessReqs = [];
let cursor = null, pollCount = 0;               // 增量同步的時間點（以伺服器的 updated_at 為準）
const photoUrl = {};
const openCusts = new Set();   // 設備頁：記住哪些客戶展開中
const pendingKey = () => 'printtown-pending-v32|' + AUTH_EMAIL;   // 每位使用者各自保存未送出的變更

// 雲端模式：瀏覽器只暫存「尚未送出的變更」（很小，不受容量限制）；本機模式：暫存完整資料
function cacheLocal() {
  if (CLOUD_ON) { savePending(); return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('瀏覽器無法儲存資料，本次變更只保留在此頁面'); }
}
function save() { LOGIDX = null; cacheLocal(); if (cloudReady) cloudPush(); }
function setCloudSt(t) { const el = document.getElementById('cloudSt'); if (el) el.textContent = t; }
function wipeLocal() {   // 未核准或已登出：清除畫面上的資料（未送出的變更仍保留，下次登入可找回）
  ARR_COLLS.forEach(c => { S[c] = []; });
  S.ui = {showRates: false};
  try { localStorage.removeItem(KEY); } catch (e) {}
}
function savePending() {
  if (!sb || !AUTH_EMAIL || !cloudReady) return;
  try {
    const ups = {}, dels = [];
    snapshotMap().forEach((v, k) => { const js = JSON.stringify(v.data); if (synced.get(k) !== js) ups[k] = js; });
    synced.forEach((js, k) => { if (!k.startsWith('oplog|') && !snapshotMap().has(k)) dels.push(k); });
    if (Object.keys(ups).length || dels.length) localStorage.setItem(pendingKey(), JSON.stringify({ups, dels}));
    else localStorage.removeItem(pendingKey());
  } catch (e) { toast('無法暫存未送出的變更，請確認網路後再試'); }
}
function restorePending() {   // 找回上次尚未送出的變更（只限同一位使用者）
  let p = null;
  try { p = JSON.parse(localStorage.getItem(pendingKey()) || 'null'); } catch (e) { p = null; }
  if (!p) return 0;
  let n = 0;
  Object.keys(p.ups || {}).forEach(k => {
    const i = k.indexOf('|'), coll = k.slice(0, i), id = k.slice(i + 1);
    if (!okRow(coll, id)) return;
    try { const d = JSON.parse(p.ups[k]); if (!okData(coll, d)) return; setLocal(coll, id, d); n++; } catch (e) {}
  });
  (p.dels || []).forEach(k => { const i = k.indexOf('|'); removeLocal(k.slice(0, i), k.slice(i + 1)); n++; });
  return n;
}
const idOf = it => String(it.id ?? it.key);

// 目前畫面的資料快照：key = 集合|編號
function snapshotMap() {
  const m = new Map();
  ARR_COLLS.forEach(c => (S[c] || []).forEach(it => m.set(c + '|' + idOf(it), {coll: c, id: idOf(it), data: it})));
  m.set('meta|ui', {coll: 'meta', id: 'ui', data: S.ui});
  return m;
}
// 只上傳「與上次同步不同」的紀錄；刪除的紀錄也會同步刪除（操作紀錄除外，保留歷史）
async function cloudPush() {
  if (syncing) { pendingPush = true; return; }
  syncing = true; setCloudSt('☁ 同步中…');
  let rejected = 0;
  try {
    do {
      pendingPush = false;
      const cur = snapshotMap();
      const ups = [], dels = [];
      cur.forEach((v, k) => { const js = JSON.stringify(v.data); if (synced.get(k) !== js) ups.push({k, v, js}); });
      synced.forEach((js, k) => { if (!cur.has(k) && !k.startsWith('oplog|')) dels.push(k); });
      ups.sort((a, b) => (a.v.coll === 'staff' ? 0 : 1) - (b.v.coll === 'staff' ? 0 : 1));   // 人員先送出
      for (let i = 0; i < ups.length; i += 500) {
        const part = ups.slice(i, i + 500);
        const {error} = await sb.from('app_records').upsert(part.map(u => ({coll: u.v.coll, id: u.v.id, data: u.v.data})), {onConflict: 'coll,id'});
        if (!error) { part.forEach(u => synced.set(u.k, u.js)); continue; }
        if (!isRejection(error)) throw error;          // 網路等暫時性錯誤：稍後自動重送
        // 資料庫拒絕其中某些資料：逐筆送出，被拒絕的放棄重送（避免一筆壞資料卡住所有同步）
        for (const u of part) {
          const r = await sb.from('app_records').upsert([{coll: u.v.coll, id: u.v.id, data: u.v.data}], {onConflict: 'coll,id'});
          if (r.error && !isRejection(r.error)) throw r.error;
          synced.set(u.k, u.js);
          if (r.error) { rejected++; console.warn('資料庫拒絕：', u.k, r.error.message); }
        }
      }
      const byColl = {};
      dels.forEach(k => { const i = k.indexOf('|'); (byColl[k.slice(0, i)] = byColl[k.slice(0, i)] || []).push(k.slice(i + 1)); });
      for (const c of Object.keys(byColl)) {
        const ids = byColl[c];
        for (let i = 0; i < ids.length; i += 200) {
          const part = ids.slice(i, i + 200);
          const {error} = await sb.from('app_records').delete().eq('coll', c).in('id', part);
          if (error) throw error;
          part.forEach(id => synced.delete(c + '|' + id));
        }
      }
    } while (pendingPush);
    if (rejected) { setCloudSt(`☁ 已同步（${rejected} 筆被拒絕）`); toast(`有 ${rejected} 筆變更被資料庫拒絕（權限或格式不符），已停止重送，請通知管理者`); }
    else setCloudSt('☁ 已同步');
    savePending();
  } catch (e) {
    console.error(e);
    setCloudSt('☁ 同步失敗，稍後自動重試');
    savePending();
    setTimeout(() => { if (!syncing && cloudReady) cloudPush(); }, 8000);
  } finally { syncing = false; }
}
// 資料庫的拒絕（權限、格式、檢查條件）與網路暫時性錯誤不同：前者不會因重送而成功
const isRejection = e => /^(42501|23514|22[0-9A-Z]{3}|P0001)$/.test(String(e && e.code || '')) || /row-level|violates|check constraint|格式不正確|不正確|最多/.test(String(e && e.message || ''));
async function flushCloud() { for (let i = 0; i < 100 && syncing; i++) await new Promise(r => setTimeout(r, 100)); }

// 分頁讀取（每次最多 1000 筆，Supabase 的單次上限）
async function fetchPaged(build, maxRows = Infinity) {
  const out = [];
  for (let from = 0; out.length < maxRows; from += 1000) {
    const want = Math.min(1000, maxRows - out.length);
    const {data, error} = await build().range(from, from + want - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < want) break;
  }
  return out;
}
const rowsSel = 'coll,id,data,updated_at';
// 一般資料（不含操作紀錄）
const fetchMain = () => fetchPaged(() => sb.from('app_records').select(rowsSel).neq('coll', 'oplog').order('coll').order('id'));
// 最近的操作紀錄
const fetchRecentOplog = () => fetchPaged(() => sb.from('app_records').select(rowsSel).eq('coll', 'oplog').order('updated_at', {ascending: false}).order('id'), OPLOG_LOAD);
// 只取編號（用於完整的刪除對照）
const fetchKeys = () => fetchPaged(() => sb.from('app_records').select('coll,id').neq('coll', 'oplog').order('coll').order('id'));

// 以雲端為準（權限內的全部資料）；無權限者讀不到任何資料
function applyRows(rows) {
  LOGIDX = null;
  ARR_COLLS.forEach(c => { S[c] = []; });
  S.ui = {showRates: false};
  synced = new Map();
  rows.forEach(r => {
    if (!okRow(r.coll, r.id) || !okData(r.coll, r.data)) return;
    synced.set(r.coll + '|' + r.id, JSON.stringify(r.data));
    if (r.coll === 'meta') S.ui = r.data;
    else S[r.coll].push(r.data);
  });
}
function maxCursor(rows, prev) {   // 以時間值比較（避免字串格式不同造成錯誤排序）
  let m = prev || '1970-01-01T00:00:00Z';
  rows.forEach(r => { if (r.updated_at && Date.parse(r.updated_at) > Date.parse(m)) m = r.updated_at; });
  return m;
}
function normalizeState() {
  ARR_COLLS.forEach(c => { S[c] = S[c] || []; });
  S.ui = S.ui || {showRates: false};
  S.staff.forEach(s => { if (s.admin == null) s.admin = false; if (s.pw === undefined) s.pw = null; });
}
function setLocal(coll, id, data) {
  LOGIDX = null;
  if (coll === 'meta') { S.ui = data; return; }
  if (!S[coll]) return;
  const i = S[coll].findIndex(x => idOf(x) === id);
  if (i >= 0) S[coll][i] = data; else S[coll].push(data);
}
function removeLocal(coll, id) { LOGIDX = null; if (S[coll]) S[coll] = S[coll].filter(x => idOf(x) !== id); }

// 其他人的修改即時套用；正在輸入時暫緩重新整理，避免打到一半的內容被清掉
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest('#main') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return scheduleRender();
    render();
  }, 600);
}
// 本機目前的版本（JSON）；不存在時回傳 null
function localJsOf(coll, id) {
  if (coll === 'meta') return JSON.stringify(S.ui);
  const it = (S[coll] || []).find(x => idOf(x) === id);
  return it ? JSON.stringify(it) : null;
}
// 本機是否有尚未送出的修改（含尚未送出的刪除）
function hasPending(coll, id) {
  const k = coll + '|' + id, lj = localJsOf(coll, id);
  return lj === null ? synced.has(k) : lj !== synced.get(k);
}
// 套用一批遠端資料：本機有未送出的修改者，一律保留本機版本
function applyRemoteRows(rows) {
  LOGIDX = null;
  let changed = false;
  rows.forEach(r => {
    if (!okRow(r.coll, r.id) || !okData(r.coll, r.data)) return;
    const k = r.coll + '|' + r.id, js = JSON.stringify(r.data);
    if (synced.get(k) === js) return;
    if (hasPending(r.coll, String(r.id))) return;
    synced.set(k, js); setLocal(r.coll, String(r.id), r.data); changed = true;
  });
  return changed;
}
// 定時同步：先只抓「有更新的資料」（增量）；每 10 次再做一次完整的刪除對照
async function refreshFromCloud() {
  if (!cloudReady || !sb || syncing) return;
  let changed = false;
  try {
    pollCount++;
    const since = cursor ? new Date(Date.parse(cursor) - 5000).toISOString() : '1970-01-01T00:00:00Z';
    const changedRows = await fetchPaged(() => sb.from('app_records').select(rowsSel).neq('coll', 'oplog').gte('updated_at', since).order('updated_at').order('coll').order('id'));
    if (applyRemoteRows(changedRows)) changed = true;
    cursor = maxCursor(changedRows, cursor);
    if (pollCount % FULL_CHECK_EVERY === 0) {
      // 先記下查詢前的同步狀態；查詢期間若有新的送出，該筆不會被誤判為「已刪除」
      const before = new Map(synced);
      const keys = new Set((await fetchKeys()).map(r => r.coll + '|' + r.id));
      before.forEach((js, k) => {
        if (k.startsWith('oplog|') || keys.has(k)) return;
        if (synced.get(k) !== js) return;          // 查詢期間已有變動：略過，下次再對照
        const i = k.indexOf('|'), coll = k.slice(0, i), id = k.slice(i + 1);
        if (hasPending(coll, id)) return;
        synced.delete(k); removeLocal(coll, id); changed = true;
      });
    }
  } catch (e) { return; }
  if (changed) { cacheLocal(); scheduleRender(); }
  if (isAdmin()) loadAccessReqs();
}
function startRealtime() {
  sb.channel('app-records-sync').on('postgres_changes', {event: '*', schema: 'public', table: 'app_records'}, p => {
    // 規則：本機若有尚未送出的修改，一律以本機為準，遠端的舊回音不會覆蓋它
    if (p.eventType === 'DELETE') {
      const coll = p.old.coll, id = String(p.old.id), k = coll + '|' + id;
      if (!okRow(coll, id) || coll === 'oplog' || hasPending(coll, id)) return;
      if (!synced.has(k)) return;
      synced.delete(k); removeLocal(coll, id);
    } else {
      const r = p.new, id = String(r.id), k = r.coll + '|' + id, js = JSON.stringify(r.data);
      if (!okRow(r.coll, id)) return;
      if (synced.get(k) === js) return;
      if (hasPending(r.coll, id)) return;
      synced.set(k, js); setLocal(r.coll, id, r.data);
    }
    cacheLocal(); scheduleRender();
  }).subscribe();
}

/* ---- 登入、核准與待核准申請 ---- */
async function requestAccess() {
  const {error} = await sb.from('access_requests').insert({email: AUTH_EMAIL, name: AUTH_NAME || AUTH_EMAIL.split('@')[0]});
  // 23505 = 已經申請過，視為正常
  if (error && !/23505|duplicate/i.test(String(error.code || '') + ' ' + String(error.message || ''))) throw error;
}
async function loadAccessReqs() {
  if (!sb || !isAdmin()) return;
  const {data, error} = await sb.from('access_requests').select('email,name,requested_at').order('requested_at');
  if (error) return;
  const next = data || [], changed = JSON.stringify(next) !== JSON.stringify(accessReqs);
  accessReqs = next;
  // 只有清單真的改變才重新繪製，避免打到一半的設定表單被清掉
  if (changed && view === 'settings') scheduleRender();
}
async function loadCloudData() {
  cloudPhase = 'loading'; render();
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (!session) { cloudPhase = 'auth'; cloudReady = false; CUR = null; wipeLocal(); return render(); }
    const user = session.user || {};
    AUTH_EMAIL = (user.email || '').toLowerCase();
    AUTH_NAME = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || '';
    if (((user.app_metadata || {}).provider || '') !== 'google') {   // 只接受 Google 登入
      cloudErr = '本系統僅接受 Google 帳號登入';
      await sb.auth.signOut(); cloudPhase = 'error'; cloudReady = false; CUR = null; wipeLocal(); return render();
    }
    const main = await fetchMain();           // 未核准者在資料庫層級讀不到任何資料
    const oplog = main.length ? await fetchRecentOplog() : [];
    const rows = main.concat(oplog);
    applyRows(rows);
    cursor = maxCursor(main, null);
    normalizeState();
    const st = S.staff.find(s => s.active && (s.email || '').toLowerCase() === AUTH_EMAIL) || null;
    if (!st) {
      // 尚未核准：不保留任何資料，送出申請後等待管理者核准
      cloudReady = false; CUR = null; wipeLocal();
      await requestAccess();
      cloudPhase = 'pending';
      if (!window.__ptPending) window.__ptPending = setInterval(() => { if (cloudPhase === 'pending') loadCloudData(); }, 60000);
      return render();
    }
    if (window.__ptPending) { clearInterval(window.__ptPending); window.__ptPending = null; }
    cloudReady = true; CUR = st.id; cloudPhase = 'ready';
    const restored = restorePending();        // 找回上次網路中斷時尚未送出的變更
    logOp('登入', '登入系統', st);
    cacheLocal(); cloudPush(); startRealtime();
    if (restored) toast(`已找回上次尚未送出的 ${restored} 筆變更，將自動送出`);
    if (!window.__ptPoll) window.__ptPoll = setInterval(refreshFromCloud, 60000);
    if (isAdmin()) loadAccessReqs();
  } catch (e) {
    console.error(e);
    cloudErr = e.message || String(e); cloudPhase = 'error'; cloudReady = false;
  }
  render();
}
async function cloudSignIn() {
  toast('前往 Google 登入…');
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  if (error) toast('無法開始 Google 登入：' + error.message);
}
function approveAccess(email) {
  if (!guardAdmin('僅管理者可核准申請')) return;
  const r = accessReqs.find(x => x.email === email); if (!r) return;
  if (S.staff.some(s => (s.email || '').toLowerCase() === email)) { toast('此信箱已有人員資料'); return; }
  let name = (r.name || email.split('@')[0]).trim();
  if (S.staff.some(s => s.name === name)) name = email;
  S.staff.push({id: uid(), name, title: '', phone: '', email, active: true, admin: false, pw: null, extra: {}});
  logOp('核准登入', `${name}｜${email}`);
  save();
  flushCloud().then(() => dropAccess(email));
  toast('已核准，請到人員資料確認職稱與權限');
}
function denyAccess(email) {
  if (!guardAdmin('僅管理者可拒絕申請')) return;
  if (!confirmTwice(`拒絕 ${email} 的登入申請？`)) return;
  logOp('拒絕登入申請', email);
  dropAccess(email);
}
async function dropAccess(email) {
  const {error} = await sb.from('access_requests').delete().eq('email', email);

  accessReqs = accessReqs.filter(x => x.email !== email);

async function boot() {
  if (!CLOUD_ON) {
    if (HOSTED) { setCloudSt('未設定雲端'); render(); return; }   // 放在網路上時，沒有雲端設定就不開放本機資料
    setCloudSt('本機模式'); importEngineers(); save(); render(); return;
  }
  // v32：雲端模式不再把整份資料存在瀏覽器（容量有限）；舊版的快取直接移除，資料以雲端為準
  try { localStorage.removeItem(KEY); } catch (e) {}
  wipeLocal();
  CUR = null; cloudPhase = 'init'; render();
  if (!window.supabase || !window.supabase.createClient) {
    cloudPhase = 'error'; cloudErr = '雲端元件無法載入，請確認網路後重新整理'; return render();
  }
  sb = window.supabase.createClient(CLOUD.url, CLOUD.key);
  loadCloudData();
}

// 依檔頭位元組判斷是否為 JPEG／PNG／WEBP／HEIC（不信任檔名與瀏覽器回報的類型）
async function isImageBytes(file) {
  let h;
  try { h = new Uint8Array(await file.slice(0, 16).arrayBuffer()); } catch (e) { return false; }
  const ascii = (from, to) => String.fromCharCode(...h.slice(from, to));
  if (h[0] === 0xFF && h[1] === 0xD8 && h[2] === 0xFF) return true;                                   // JPEG
  if (h[0] === 0x89 && ascii(1, 4) === 'PNG' && h[4] === 0x0D && h[5] === 0x0A && h[6] === 0x1A && h[7] === 0x0A) return true;  // PNG
  if (ascii(0, 4) === 'RIFF' && ascii(8, 12) === 'WEBP') return true;                                // WEBP
  if (ascii(4, 8) === 'ftyp' && /^(heic|heix|hevc|hevx|heim|heis|mif1|msf1)$/.test(ascii(8, 12))) return true;  // HEIC／HEIF
  return false;
}
async function uploadPhoto(e, devId) {
  e.preventDefault();
  const inp = e.target.querySelector('input[type=file]'), file = inp && inp.files && inp.files[0];
  if (!file) return toast('請先選擇照片');
  if (!cloudReady) return toast('雲端尚未連線，無法上傳照片');
  if (!PHOTO_TYPES.includes(file.type)) return toast('僅支援 JPG、PNG、WEBP、HEIC 照片');
  if (!(await isImageBytes(file))) return toast('檔案內容不是有效的照片，已取消上傳');
  if (file.size > 15 * 1024 * 1024) return toast('照片檔案過大（上限 15MB）');
  const d = S.devices.find(x => x.id === devId); if (!d) return toast('找不到此設備');
  const path = `devices/${devId}/${uid()}-${file.name.replace(/[^\w.\-]/g, '_').slice(0, 80)}`;
  toast('照片上傳中…');
  const {error} = await sb.storage.from('photos').upload(path, file, {contentType: file.type});
  if (error) return toast('照片上傳失敗：' + error.message);
  d.photos = d.photos || [];
  d.photos.push({path, name: file.name, at: iso(today()), by: curStaff() ? curStaff().name : ''});
  logOp('上傳照片', `${custName(d)}｜${d.model}｜${file.name}`);
  save(); toast('已上傳照片'); render();
}

/* ================= 張數計算 ================= */
function readingsOf(devId) {
  return visitsOf(devId).filter(l => l.bw != null)
    .map(l => ({dt: toDate(l.date), date: l.date, bw: l.bw, color: l.color}))
    .sort((a, b) => a.dt - b.dt);
}
function basisOf(r, key) {
  if (!r) return null;
  if (key === 'bw') return r.bw ?? null;
  if (key === 'color') return r.color ?? null;
  if (key === 'total') return r.total != null ? r.total : (r.bw == null ? null : r.bw + (r.color || 0));
  return null;
}
function lastReading(devId) {
  const rs = readingsOf(devId);
  return rs.length ? rs[rs.length - 1] : null;
}
// 近六個月月均張數：首尾讀數差 ÷ 月數；視窗前最後一筆作為起點
function avgOf(devId, key) {
  const t = today(), start = new Date(t.getTime() - WIN * DAY);
  const pts = readingsOf(devId).map(r => ({dt: r.dt, v: basisOf(r, key)})).filter(p => p.v != null);
  const inWin = pts.filter(p => p.dt >= start);
  const before = pts.filter(p => p.dt < start).pop();
  const seq = before ? [before, ...inWin] : inWin;
  if (seq.length < 2) return {avg:null, msg:'張數讀數不足（近六個月內需至少兩筆）'};
  const first = seq[0], last = seq[seq.length - 1];
  const pages = last.v - first.v;
  if (pages < 0) return {avg:null, msg:'張數倒退，請確認是否換機或歸零'};
  const months = (last.dt - first.dt) / DAY / MONTH;
  if (months <= 0) return {avg:null, msg:'讀數日期相同，無法計算'};
  return {avg: pages / months, msg: `${iso(first.dt)} ～ ${iso(last.dt)}，${seq.length} 筆`};
}
function currentEstimate(devId) {
  const lr = lastReading(devId);
  if (!lr) return null;
  const ms = Math.max(0, (today() - lr.dt) / DAY / MONTH);
  const aBw = avgOf(devId, 'bw').avg ?? 0, aCo = avgOf(devId, 'color').avg ?? 0;
  return {bw: lr.bw + aBw * ms, color: (lr.color ?? 0) + aCo * ms};
}

/* ================= 耗材推估 ================= */
// 有效壽命：列印機為原廠張數 × 實際使用比率；清淨機為原廠天數
const effLife = c => c.basis === 'days' ? c.ratedLife : c.ratedLife * (c.coverage ?? 100) / 100;
const unitOf = c => c.basis === 'days' ? '天' : '張';
// 每月用量（張或天）
function monthlyUsage(c) {
  const dev = S.devices.find(x => x.id === c.deviceId);
  if (!dev) return null;
  if (c.basis === 'days') return MONTH;
  return avgOf(dev.id, c.basis).avg;
}
// 依過去更換紀錄算出實際使用比率（實際用量 ÷ 原廠壽命）
function observedRatio(c) {
  if (c.basis === 'days') return null;
  const evs = S.events.filter(e => e.consId === c.id && e.rated && e.consumed != null);
  if (!evs.length) return null;
  return {n: evs.length, r: evs.reduce((a, e) => a + e.consumed / e.rated, 0) / evs.length};
}

/*
 推估流程（列印機）
 1. 目前估計張數 = 最後一次抄表張數 + 近六個月月均張數 × 距今月數
 2. 本支已用 = 目前估計張數 − 更換時張數
 3. 本支剩餘 = 有效壽命 − 本支已用
 4. 預估剩餘天數 = 本支剩餘 ÷ 日均張數
 5. 庫存可用至 = 今天 + (本支剩餘 + 庫存件數 × 有效壽命) ÷ 日均張數
 6. 建議補貨日 = 庫存可用至 − 交期
 清淨機以天數計，日均為 1 天，其餘相同。
*/
function consStatus(c) {
  const dev = S.devices.find(x => x.id === c.deviceId);
  if (!dev) return null;
  const t = today();
  const L = effLife(c), u = unitOf(c), stock = c.stock || 0, lead = c.leadDays ?? 7;
  const base = {c, dev, cat: c.category, L, u, stock, lead, basisLabel: BASIS_LABEL[c.basis], ok: false, reason: ''};
  let used, remaining, daily, est = null, avg = null;

  if (c.basis === 'days') {
    used = daysBetween(toDate(c.installDate), t);
    remaining = L - used;
    daily = 1;
  } else {
    const v = avgOf(dev.id, c.basis), lr = lastReading(dev.id);
    const instVal = basisOf({bw: c.installBw, color: c.installColor, total: c.installTotal}, c.basis);
    if (!lr) return {...base, reason: '缺少張數讀數'};
    if (instVal == null) return {...base, reason: '未填更換時張數'};
    if (v.avg == null) return {...base, reason: v.msg};
    if (v.avg <= 0) return {...base, reason: '近六個月月均張數為零，無法推估'};
    const ms = Math.max(0, (t - lr.dt) / DAY / MONTH);
    est = basisOf(lr, c.basis) + v.avg * ms;
    avg = v.avg;
    used = est - instVal;
    remaining = L - used;
    daily = v.avg / MONTH;
  }

  const monthly = daily * MONTH;
  const daysLeft = remaining / daily;
  const cycle = L / daily;                                  // 每支可用天數
  const dueDate = addDays(t, daysLeft);                     // 本支預估更換日
  const coverDays = (remaining + stock * L) / daily;        // 含庫存可撐天數
  const exhaust = addDays(t, coverDays);                    // 庫存可用至
  const orderDate = addDays(exhaust, -lead);                // 建議補貨日
  const orderIn = Math.round(coverDays - lead);
  const unitsIn = daysLeft > WARN_CONS ? 0 : 1 + Math.floor((WARN_CONS - daysLeft) / cycle);
  const buy = Math.max(0, unitsIn - stock);
  const overdue = daysLeft < 0;
  const remind = daysLeft <= WARN_CONS || orderIn <= WARN_CONS;
  return {...base, ok: true, est, avg, used, remaining, daily, monthly, daysLeft, cycle,
          dueDate, coverDays, exhaust, orderDate, orderIn, unitsIn, buy, overdue, remind};
}
function svcStatus(dev) {
  const logs = S.logs.filter(l => l.deviceId === dev.id).sort((a, b) => b.date.localeCompare(a.date));
  if (!logs.length) return {last:null, due:null, left:null};
  const due = addDays(toDate(logs[0].date), dev.cycleDays);
  return {last: logs[0].date, due, left: daysBetween(today(), due)};
}
function statusOf(left, warnAt) {
  if (left == null) return '<span class="tag t-info">資料不足</span>';
  if (left < 0) return '<span class="tag t-danger">已超過</span>';
  if (left <= warnAt) return `<span class="tag t-warn">${left} 天內</span>`;
  return '<span class="tag t-ok">正常</span>';
}
const leftTxt = s => s.daysLeft < 0
  ? `已超過 ${Math.abs(Math.round(s.daysLeft))} 天`
  : `約 ${Math.round(s.daysLeft)} 天（${(s.daysLeft / 7).toFixed(1)} 週）`;
const reminderTag = s => !s.ok ? '<span class="tag t-info">資料不足</span>'
  : s.orderIn < 0 ? '<span class="tag t-danger">已逾期備貨</span>'
  : s.overdue ? '<span class="tag t-warn">已超過更換點</span>'
  : s.daysLeft <= WARN_CONS ? `<span class="tag t-warn">${Math.round(s.daysLeft)} 天內上機</span>`
  : `<span class="tag t-warn">${s.orderIn} 天內備貨</span>`;

/* ================= 損益（計張、零元機） ================= */
// 計張收入：黑白張數 × 黑白單價 ＋ 彩色張數 × 彩色單價 ＋ 月租 × 月數
// 零元機收入：耗材用量 × 耗材售價
// 成本一律以用量計提：月用量 ÷ 有效壽命 × 單位成本；賣斷不計損益
function pnlDev(dev) {
  const ct = contractOf(dev);
  if (ct !== '計張' && ct !== '零元機') return null;
  let rev = 0, cost = 0;
  const bwPages = isPrint(dev) ? (avgOf(dev.id, 'bw').avg ?? 0) * M : 0;
  const coPages = isPrint(dev) && dev.hasColor ? (avgOf(dev.id, 'color').avg ?? 0) * M : 0;
  let bwRev = 0, coRev = 0, feeRev = 0;
  if (ct === '計張') {
    bwRev = bwPages * (dev.bwRate || 0);
    coRev = coPages * (dev.colorRate || 0);
    feeRev = (dev.monthlyFee || 0) * M;
    rev += bwRev + coRev + feeRev;
  }
  const items = S.consumables.filter(k => k.deviceId === dev.id).map(k => {
    const mu = monthlyUsage(k);
    const units = mu == null ? 0 : (mu / effLife(k)) * M;
    const cc = units * (k.unitCost || 0);
    const sale = ct === '零元機' ? units * (k.sellPrice || 0) : 0;
    cost += cc; rev += sale;
    return {k, units, cc, sale};
  });
  const unpriced = ct === '計張' && (bwPages + coPages) > 0 && !(dev.bwRate || dev.colorRate);
  return {ct, rev, cost, gp: rev - cost, gm: rev > 0 ? (rev - cost) / rev : null, items,
          bwPages, coPages, bwRev, coRev, feeRev, unpriced};
}
function pnlCustomer(cust) {
  const devs = S.devices.filter(d => d.customerId === cust.id);
  let rev = 0, cost = 0, any = false, unpriced = false;
  devs.forEach(d => {
    const p = pnlDev(d);
    if (!p) return;
    any = true; rev += p.rev; cost += p.cost;
    if (p.unpriced) unpriced = true;
  });
  return {any, rev, cost, gp: rev - cost, gm: rev > 0 ? (rev - cost) / rev : null, unpriced};
}

let rosterMonth = null;
function curRosterMonth() { const t = today(); return rosterMonth || new Date(t.getFullYear(), t.getMonth(), 1); }
// 每台設備：依客戶週期推算下次到期月；本月應保養、逾期未保養、本月已保養者皆列出
function rosterRows(ms) {
  const y = ms.getFullYear(), m = ms.getMonth(), cur = y * 12 + m;
  const end = new Date(y, m + 1, 0);
  const rows = [];
  S.devices.forEach(d => {
    const c = S.customers.find(x => x.id === d.customerId);
    const cm = devCycle(d).m, label = devCycle(d).label;
    const logs = visitsOf(d.id);
    const done = logs.some(l => { const dt = toDate(l.date); return dt.getFullYear() === y && dt.getMonth() === m; });
    const last = logs.filter(l => toDate(l.date) <= end).pop() || null;
    let status, include = false, overdue = 0;
    if (!last) { include = true; status = 'new'; }
    else {
      const lt = toDate(last.date), dueIdx = lt.getFullYear() * 12 + lt.getMonth() + cm;
      if (done) { include = true; status = 'done'; }
      else if (dueIdx <= cur) { include = true; status = dueIdx < cur ? 'overdue' : 'due'; overdue = cur - dueIdx; }
    }
    if (include) rows.push({d, c, label, last: last ? last.date : null, status, overdue});
  });
  const order = {overdue: 0, due: 1, new: 2, done: 3};
  return rows.sort((a, b) => order[a.status] - order[b.status] || (a.c?.name || '').localeCompare(b.c?.name || ''));
}
function statusTag(r) {
  if (r.status === 'done') return '<span class="tag t-ok">本月已保養</span>';

  if (r.status === 'new') return '<span class="tag t-info">尚無紀錄・首次保養</span>';

}

// 指定期間的印量：期末讀數 − 期初讀數；期初缺少時以期間內第一筆為起點並標註資料不完整
function periodUsage(devId, fromEx, toIn) {
  const rs = readingsOf(devId);
  const endR = rs.filter(r => r.dt <= toIn).pop();
  if (!endR) return null;
  let startR = rs.filter(r => r.dt <= fromEx).pop(), partial = false;
  if (!startR) { startR = rs.find(r => r.dt > fromEx && r.dt <= toIn); partial = true; if (!startR) return null; }
  if (startR === endR) return {bw: 0, co: 0, partial};
  const bw = endR.bw - startR.bw;
  if (bw < 0) return null;                      // 計數器歸零或換機，略過
  const co = endR.color != null && startR.color != null ? Math.max(0, endR.color - startR.color) : 0;
  return {bw, co, partial};
}
function custAnalysis(c) {
  const t = today(), d = n => addDays(t, -n);
  const W = {cur: [d(30), t], prev: [d(60), d(30)], half: [d(210), d(30)]};
  const devs = devsOf(c.id);
  const printDevs = devs.filter(isPrint);
  const use = w => {
    let total = 0, any = false, partial = false;
    printDevs.forEach(dv => { const u = periodUsage(dv.id, w[0], w[1]); if (u) { any = true; total += u.bw + u.co; partial = partial || u.partial; } });
    return any ? {total, partial} : null;
  };
  const cur = use(W.cur), prev = use(W.prev), half = use(W.half);
  const halfM = half ? half.total / 6 : null;
  const repairs = w => S.logs.filter(l => devs.some(x => x.id === l.deviceId) && l.type === '維修' &&
    toDate(l.date) > w[0] && toDate(l.date) <= w[1]).length;
  const rc = repairs(W.cur), rp = repairs(W.prev), rh = repairs(W.half) / 6;
  return {cur, prev, half, halfM, rc, rp, rh, hasPrint: printDevs.length > 0};
}
const chgPct = (a, b) => (a == null || b == null || b <= 0) ? null : (a - b) / b;
function chgTag(p) {
  if (p == null) return '<span class="muted">—</span>';
  const txt = (p > 0 ? '▲ +' : '▼ ') + Math.round(p * 100) + '%';
  return Math.abs(p) >= VAR_WARN ? `<span class="tag t-warn">${txt}</span>` : `<span class="muted">${txt}</span>`;
}
function analysisCardHtml() {

  const body = rows.length ? `<table style="min-width:1100px"><thead><tr>
      <th>客戶</th><th class="num">近30日印量</th><th class="num">前30日印量</th><th class="num">較前30日</th>
      <th class="num">前六個月月均</th><th class="num">較月均</th>
      <th class="num">近30日維修</th><th class="num">前30日維修</th><th class="num">前六月月均維修</th><th>提示</th></tr></thead><tbody>${
    rows.map(({c, a}) => {
      const pCur = chgPct(a.cur && a.cur.total, a.prev && a.prev.total);
      const pHalf = chgPct(a.cur && a.cur.total, a.halfM);
      const notes = [];

      else {

        if (a.rc >= 2 && a.rc >= a.rh * REPAIR_WARN) notes.push('近30日維修偏多，請檢查機器狀況');
        if ((a.cur && a.cur.partial) || (a.prev && a.prev.partial) || (a.half && a.half.partial)) notes.push('資料不完整（期初讀數缺漏）');
      }

        <td class="num">${a.hasPrint ? f(a.cur && a.cur.total) : '—'}</td>

        <td class="num">${a.hasPrint ? chgTag(pCur) : '—'}</td>

        <td style="font-size:13px">${notes.length ? notes.map(n => `<div><span class="tag t-warn">提示</span> ${esc(n)}</div>`).join('') : '<span class="muted">—</span>'}</td></tr>`;
    }).join('')}</tbody></table>` : '<div class="empty">尚無客戶。</div>';
  return `<div class="card sec-report"><h2>客戶分析（近30日 ／ 前30日 ／ 前六個月）</h2>
    <div style="overflow-x:auto">${body}</div>
    <p class="note">印量 = 黑白 ＋ 彩色，由保養紀錄的計數器讀數推算。近30日＝過去30天；前30日＝再往前30天；前六個月月均＝再往前180天的總量 ÷ 6。維修次數取「服務類型＝維修」的紀錄。印量變化達 ±30%，或近30日維修次數明顯高於前六個月月均時標示提示。</p></div>`;
}

let planYear = null;
function setPlanYear(y) { planYear = y; render(); }
const MON = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
// 每台設備：依最近一次保養推算應保養月（每 cm 個月一次）
function devPlanState(d, c, idx, curIdx) {
  const logs = visitsOf(d.id);
  if (!logs.length) return null;
  const idxOf = l => { const t = toDate(l.date); return t.getFullYear() * 12 + t.getMonth(); };
  const cm = devCycle(d).m;
  const anchor = Math.max(...logs.map(idxOf));
  const first = Math.min(...logs.map(idxOf));
  const served = logs.some(l => idxOf(l) === idx);
  const scheduled = (((idx - anchor) % cm) + cm) % cm === 0;
  if (scheduled && served) return 'ok';
  if (scheduled && !served && idx < curIdx && idx >= first) return 'miss';
  if (scheduled && !served && idx >= curIdx) return 'plan';
  if (!scheduled && served) return 'ok';
  return null;
}
function viewPlan() {
  const t = today(), Y = planYear || t.getFullYear(), curIdx = t.getFullYear() * 12 + t.getMonth();
  const head = `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <button class="ghost" onclick="setPlanYear(${Y - 1})">← ${Y - 1} 年</button>
      <h2 style="margin:0">保養客戶一覽表（${Y} 年）</h2>
      <button class="ghost" onclick="setPlanYear(${Y + 1})">${Y + 1} 年 →</button></div>
    <p class="note" style="margin-top:10px">每列是一位客戶，每欄是一個月。依各設備的保養週期與上次保養月推算應保養月份。
      <span class="tag t-ok">✓ 已保養</span> <span class="tag t-warn">⚠ 應保養未完成</span> <span class="tag t-info">○ 應保養（未到期）</span> 空白 ＝ 非保養月。本月欄位已標示。</p></div>`;
  const body = S.customers.length ? `<div class="card" style="overflow-x:auto"><table style="min-width:1100px"><thead><tr>
      <th style="min-width:170px">客戶</th><th>週期</th><th class="num">設備</th>
      ${MON.map((m, i) => `<th style="text-align:center;${Y * 12 + i === curIdx ? 'background:#eff6ff;color:var(--brand,#1e5fbf)' : ''}">${m}</th>`).join('')}
    </tr></thead><tbody>${S.customers.map(c => {
      const devs = devsOf(c.id);
      const hasLog = devs.some(d => visitsOf(d.id).length);
      const cells = MON.map((m, i) => {
        const idx = Y * 12 + i;
        let ok = 0, miss = 0, plan = 0;
        devs.forEach(d => { const st = devPlanState(d, c, idx, curIdx); if (st === 'ok') ok++; else if (st === 'miss') miss++; else if (st === 'plan') plan++; });
        const parts = [];
        if (miss) parts.push(`<span class="tag t-warn">⚠ ${miss}</span>`);
        if (ok) parts.push(`<span class="tag t-ok">✓ ${ok}</span>`);
        if (plan) parts.push(`<span class="tag t-info">○ ${plan}</span>`);
        return `<td style="text-align:center;${idx === curIdx ? 'background:#f5f9ff' : ''}">${parts.join(' ')}</td>`;
      }).join('');
      return `<tr><td><b>${esc(c.name)}</b> ${contractTagOf(c)}${!devs.length ? '<div class="muted">尚無設備</div>' : !hasLog ? '<div class="muted">尚無保養紀錄，請先登錄首次保養</div>' : ''}</td>
        <td>${cycleOf(c).label}</td><td class="num">${devs.length}</td>${cells}</tr>`;
    }).join('')}</tbody></table>
    <p class="note">數字為台數。⚠ 表示該月應保養但未到府（僅計算該設備第一次保養之後的月份）。</p></div>`
    : '<div class="card"><div class="empty">尚無客戶。請到「設備資料總覽」最上方新增客戶。</div></div>';
  return head + body + planMonthHtml();
}

  </div>

function reminderItems(dev) {

    .forEach(a => items.push({tag: '<span class="tag t-warn">拜訪提示</span>', text: a}));

// 最近 30 日保養紀錄（含主管簽核）
function recentRowsHtml() {
  const start = addDays(today(), -30), now = today();
  const logs = S.logs
    .filter(l => { const d = toDate(l.date); return d >= start && d <= now; })
    .filter(l => { const d = devOfLog(l); return d && devMatch(d, devQuery); })
    .sort((a, b) => b.date.localeCompare(a.date));
  if (!logs.length) return '<div class="empty">最近 30 日沒有保養紀錄。</div>';
  return `<table style="min-width:1000px"><thead><tr><th>日期</th><th>資訊</th><th>服務紀錄</th><th>主管簽核</th></tr></thead><tbody>${
    logs.map(l => {
      const d = devOfLog(l);
      const signed = l.supSigned ? '<span class="tag t-ok">已簽核</span>' : '<span class="tag t-info">未簽核</span>';
      const eng = l.engConfirmed ? '<span class="tag t-ok">客戶已親簽</span>' : '<span class="tag t-info">未親簽</span>';
      const opinion = l.supOpinion ? `<div style="margin-top:6px;padding:6px 8px;background:#eff6ff;border-radius:6px"><b>主管意見：</b>${esc(l.supOpinion)}</div>` : '';
      return `<tr>
        <td>${l.date}<div class="muted">${esc(l.type)}</div></td>
        <td style="font-size:13px"><b>${esc(custName(d))}</b>　${esc(d.location || '—')}
          <div class="muted">${esc(KIND[d.kind])} ${esc(d.model)}　擔當工程師：${esc(l.engineer || '—')}</div>
          ${l.bw != null ? `<div class="muted">黑白 ${fmt(l.bw)}${l.color != null ? ` ／ 彩色 ${fmt(l.color)}` : ''}</div>` : ''}
          ${opinion}
          <div style="margin-top:6px"><button class="ghost" onclick="pickDev('${d.id}')">查看設備</button></div></td>
        <td style="font-size:13px;white-space:pre-wrap">${esc(l.serviceRecord || '—')}${l.customerInstruction ? `\n<span class="muted">客戶交代：${esc(l.customerInstruction)}</span>` : ''}</td>
        <td style="min-width:200px"><form onsubmit="saveSupervisor(event,'${l.id}')">
          <div>${eng}</div><div style="margin-top:4px">${signed}</div>

}

function saveSupervisor(e, id) {
  e.preventDefault();
  const f = new FormData(e.target);
  const l = S.logs.find(x => x.id === id);

  l.supSigned = f.get('signed') === 'on';
  l.supOpinion = (f.get('opinion') || '').toString().trim();
  l.supDate = l.supSigned ? iso(today()) : null;
  logOp('主管簽核', `${l.date}：${l.supSigned ? '已簽核' : '僅儲存意見'}`);
  save(); toast(l.supSigned ? '已簽核' : '已儲存主管意見'); render();

/* 清除示範資料（僅管理者）：只刪除「範例客戶」及其設備、服務紀錄、耗材、事件，以及示範擔當工程師；耗材目錄與其他資料保留 */
/* 確認方式：頁面內「按兩次」，不使用瀏覽器確認視窗（部分預覽環境會直接阻擋，造成按鈕沒有反應） */
let armedMsg = null, armedAt = 0;
function confirmTwice(msg) {
  const now = Date.now();
  if (armedMsg === msg && now - armedAt < 8000) { armedMsg = null; return true; }
  armedMsg = msg; armedAt = now;
  toast(`${msg}　請再按一次確認（8 秒內）`);
  return false;
}
const isDemoCust = c => /^範例客戶/.test(c.name || '');
/* 示範人員名稱：含舊版名稱「示範工程師」，確保舊資料也能被清除 */
const DEMO_STAFF_NAMES = ['示範擔當工程師', '示範工程師'];
const isDemoStaff = s => DEMO_STAFF_NAMES.includes(s.name);
function clearDemo() {
  if (!denyDelete()) return;
  const demo = S.customers.filter(isDemoCust).map(c => c.id);
  const hasStaff = S.staff.some(isDemoStaff);
  if (!demo.length && !hasStaff) return toast('目前沒有示範資料');
  if (!confirmTwice(`清除 ${demo.length} 位範例客戶及其所有設備、服務紀錄、耗材與事件？此動作無法復原。`)) return;
  const devIds = S.devices.filter(d => demo.includes(d.customerId)).map(d => d.id);
  const consIds = S.consumables.filter(c => devIds.includes(c.deviceId)).map(c => c.id);
  S.devices = S.devices.filter(d => !devIds.includes(d.id));
  S.logs = S.logs.filter(l => !devIds.includes(l.deviceId));
  S.consumables = S.consumables.filter(c => !devIds.includes(c.deviceId));
  S.events = S.events.filter(e => !consIds.includes(e.consId));
  S.customers = S.customers.filter(c => !demo.includes(c.id));
  S.staff = S.staff.filter(s => !isDemoStaff(s));
  if (DEMO_STAFF_NAMES.includes(S.ui.lastEngineer)) S.ui.lastEngineer = null;
  selCust = null; selDev = null; chartIdx = null; quickDev = null; preDevCust = null;
  ensureSel(); save(); toast('已清除示範資料'); render();
}

// 逐次拜訪：增量、距上次天數、截至該次的近六個月平均、系統提示
function visitMetrics(dev, visits, i) {
  const v = visits[i], prev = i > 0 ? visits[i - 1] : null;
  const dt = toDate(v.date);
  const out = {gap: null, bwDelta: null, coDelta: null, avgBw: null, avgCo: null, rate: null, alerts: [], events: []};
  if (prev) out.gap = daysBetween(toDate(prev.date), dt);

  S.events.filter(e => e.date === v.date).forEach(e => {
    const c = S.consumables.find(x => x.id === e.consId && x.deviceId === dev.id);
    if (!c) return;
    out.events.push(c.name);
    (e.flags || []).forEach(f => out.alerts.push(`耗材更換異常（${c.name}）：${f}`));
  });

  if (prev) {
    if (out.gap < 14) out.alerts.push(`距上次拜訪僅 ${out.gap} 天，請確認是否重複登錄`);
    if (out.gap > dev.cycleDays) out.alerts.push(`距上次拜訪 ${out.gap} 天，已超過保養週期 ${dev.cycleDays} 天`);
  }

  if (isPrint(dev)) {
    if (v.bw == null) out.alerts.push('本次未記錄張數');
    const prevR = visits.slice(0, i).reverse().find(x => x.bw != null);
    if (v.bw != null && prevR) {
      out.bwDelta = v.bw - prevR.bw;
      if (out.bwDelta < 0) out.alerts.push('黑白張數低於上次，請確認是否換機或歸零');
      if (dev.hasColor && v.color != null && prevR.color != null) {
        out.coDelta = v.color - prevR.color;
        if (out.coDelta < 0) out.alerts.push('彩色張數低於上次，請確認是否換機或歸零');
      }
      const start = new Date(dt.getTime() - WIN * DAY);
      const pts = visits.slice(0, i + 1).filter(x => x.bw != null).map(x => ({dt: toDate(x.date), bw: x.bw, co: x.color}));
      const inWin = pts.filter(p => p.dt >= start);
      const before = pts.filter(p => p.dt < start).pop();
      const seq = before ? [before, ...inWin] : inWin;
      if (seq.length >= 2) {
        const f = seq[0], l = seq[seq.length - 1];
        const months = (l.dt - f.dt) / DAY / MONTH;
        if (months > 0) {
          out.avgBw = (l.bw - f.bw) / months;
          if (dev.hasColor && l.co != null && f.co != null) out.avgCo = (l.co - f.co) / months;
        }
      }
      const mon = (dt - toDate(prevR.date)) / DAY / MONTH;
      if (mon > 0 && out.bwDelta >= 0) out.rate = out.bwDelta / mon;
      if (out.rate != null && out.avgBw > 0 && out.gap >= 14) {
        const dv = out.rate / out.avgBw - 1;
        if (Math.abs(dv) >= 0.5)
          out.alerts.push(`本次月用量 ${fmt(out.rate)} 張，較近六個月平均${dv > 0 ? '偏高' : '偏低'} ${Math.round(Math.abs(dv) * 100)}%`);
      }
    }
  }
  return out;
}

function addLog(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const txt = n => (f.get(n) || '').toString().trim();
  const dev = S.devices.find(x => x.id === f.get('deviceId'));
  if (!dev) return toast('找不到設備');
  const isP = isPrint(dev);
  const bwRaw = f.get('bw'), coRaw = f.get('color');
  const bw = isP && bwRaw !== null && bwRaw !== '' ? +bwRaw : null;
  const color = isP && dev.hasColor && coRaw !== null && coRaw !== '' ? +coRaw : null;
  if (isP && bw == null && !confirmTwice('此為複合機或印表機，尚未填黑白張數。確定要儲存嗎？')) return;
  if (isP && dev.hasColor && bw != null && color == null && !confirmTwice('彩色機未填彩色張數，確定要儲存嗎？')) return;
  const lr = lastReading(dev.id);
  if (lr && bw != null && bw < lr.bw && !confirmTwice(`黑白張數 ${fmt(bw)} 低於上次 ${fmt(lr.bw)}。若為換機或歸零請按確定。`)) return;

  S.logs.push({id:uid(), deviceId:dev.id, date:f.get('date'), type:f.get('type'), bw, color,

  render();

function exportLogsCsv(from, to) {

  const rows = logsInRange(from, to).map(l => {

    return [l.date, c.name, c.contract, d.location, d.kind ? KIND[d.kind] : '', d.brand, d.model, d.cycleDays, l.type, l.engineer,

  });

  toast(`已匯出服務紀錄 CSV（${rows.length} 筆）`);
}
function monthlyRows(from, to) {
  const out = [];
  S.devices.forEach(d => {
    if (!isPrint(d)) return;
    const c = S.customers.find(x => x.id === d.customerId) || {};
    const ls = S.logs.filter(l => l.deviceId === d.id && l.bw != null).sort((a, b) => a.date.localeCompare(b.date));
    const months = [...new Set(S.logs.filter(l => l.deviceId === d.id).map(l => l.date.slice(0, 7)))].sort();
    months.forEach(m => {
      if (from && m < from.slice(0, 7)) return;
      if (to && m > to.slice(0, 7)) return;
      const inM = ls.filter(l => l.date.slice(0, 7) === m);
      const before = ls.filter(l => l.date.slice(0, 7) < m);
      const end = inM[inM.length - 1], start = before[before.length - 1];
      const coEnd = inM.filter(l => l.color != null).pop(), coStart = before.filter(l => l.color != null).pop();
      const bwUse = end && start ? end.bw - start.bw : null;
      const coUse = d.hasColor && coEnd && coStart ? coEnd.color - coStart.color : null;
      const logsM = S.logs.filter(l => l.deviceId === d.id && l.date.slice(0, 7) === m);
      out.push([m, c.name || '', d.location, KIND[d.kind], d.model, end ? end.bw : '', d.hasColor && coEnd ? coEnd.color : '',
        bwUse != null && bwUse >= 0 ? bwUse : '', coUse != null && coUse >= 0 ? coUse : '',
        logsM.length, logsM.filter(l => l.type === '維修').length]);
    });
  });
  return out;
}

  const head = ['月份','客戶','安裝地點','設備種類','機型','月末黑白累計','月末彩色累計','當月黑白增量','當月彩色增量','當月服務次數','當月維修次數'];
  const rows = monthlyRows(from, to);
  download(`printtown_monthly_${rangeTag(from, to)}.csv`, toCsv([head, ...rows]), 'text/csv', true);
  toast(`已匯出圖表用月彙總（${rows.length} 列）`);
}

function parseCsv(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === '')).map(r => r.map(c => /^'[=+\-@\t\r]/.test(c) ? c.slice(1) : c));   // 還原匯出時加的防注入符號
}

const hashPw = (pw, salt) => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const str = salt + '|' + pw;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const setPw = (s, pw) => { const salt = uid(); s.pw = {salt, h: hashPw(pw, salt)}; };
const checkPw = (s, pw) => !!(s.pw && hashPw(pw, s.pw.salt) === s.pw.h);

  rows.forEach(o => {
    byPerson[o.staff] = (byPerson[o.staff] || 0) + 1;
    byAction[o.action] = (byAction[o.action] || 0) + 1;
    const d = dayOf(o); byDay[d] = (byDay[d] || 0) + 1;
    const k = JSON.stringify([o.staff, o.action]); cell[k] = (cell[k] || 0) + 1;
  });
  all.forEach(o => { if (!lastAt[o.staff] || o.t > lastAt[o.staff]) lastAt[o.staff] = o.t; });
  const persons = Object.keys(byPerson).sort((a, b) => byPerson[b] - byPerson[a]);
  const acts = Object.keys(byAction).sort((a, b) => byAction[b] - byAction[a]);
  const days = Object.keys(byDay).sort().slice(-31);
  const maxDay = Math.max(1, ...days.map(d => byDay[d]));
  const sel = (name, list, cur, label) => `<select name="${name}"><option value="">${label}</option>${list.map(x => `<option value="${esc(x)}" ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  const pivotHead = acts.map(a => `<th class="num">${esc(a)}</th>`).join('');
  const pivot = persons.map(p => `<tr><td><b>${esc(p)}</b></td>${acts.map(a => `<td class="num">${cell[JSON.stringify([p, a])] || '—'}</td>`).join('')}<td class="num"><b>${byPerson[p]}</b></td><td class="muted" style="white-space:nowrap">${fmtTs(lastAt[p])}</td></tr>`).join('');
  const dailyRows = days.map(d => `<tr><td style="white-space:nowrap">${d}</td><td style="width:100%"><div style="height:10px;background:#7c3aed;border-radius:4px;width:${(byDay[d] / maxDay * 100).toFixed(1)}%"></div></td><td class="num">${byDay[d]}</td></tr>`).join('');
  const detail = rows.slice().sort((a, b) => b.t.localeCompare(a.t)).slice(0, 300).map(o => `<tr><td class="muted" style="white-space:nowrap">${fmtTs(o.t)}</td><td>${esc(o.staff)}</td><td>${esc(o.action)}</td><td style="font-size:13px">${esc(o.summary)}</td></tr>`).join('');
  const loginCount = rows.filter(o => o.action === '登入').length;
  return `<div class="card sec-report"><h2>操作分析</h2>
    <form onsubmit="setOpsFilter(event)" class="form-row">
      <div><label>人員</label>${sel('staff', people, opsF.staff, '全部人員')}</div>
      <div><label>動作</label>${sel('action', actionsAll, opsF.action, '全部動作')}</div>
      <div><label>起日</label><input type="date" name="from" value="${esc(opsF.from)}"></div>
      <div><label>迄日</label><input type="date" name="to" value="${esc(opsF.to)}"></div>
      <div><button class="primary" type="submit">套用篩選</button></div></form>
    <div class="stats">
      <div class="stat"><div class="muted">操作筆數</div><div class="n">${rows.length}</div></div>
      <div class="stat"><div class="muted">操作人數</div><div class="n">${persons.length}</div></div>
      <div class="stat"><div class="muted">登入次數</div><div class="n">${loginCount}</div></div>
      <div class="stat"><div class="muted">有操作的天數</div><div class="n">${Object.keys(byDay).length}</div></div>
    </div>
    <p class="note">上方篩選條件同時套用於以下所有統計。紀錄保存在本機瀏覽器中。</p></div>
    <div class="card sec-report"><h2>人員 × 動作次數</h2>
      ${persons.length ? `<div style="overflow-x:auto"><table style="min-width:0"><thead><tr><th>人員</th>${pivotHead}<th class="num">合計</th><th>最後操作</th></tr></thead><tbody>${pivot}</tbody></table></div>` : '<div class="empty">沒有符合條件的紀錄。</div>'}
    </div>
    <div class="card sec-report"><h2>每日操作量（最近 31 個有紀錄的日子）</h2>
      ${days.length ? `<table style="min-width:0"><tbody>${dailyRows}</tbody></table>` : '<div class="empty">沒有符合條件的紀錄。</div>'}
    </div>
    <div class="card sec-report"><h2>操作明細</h2>
      <div style="overflow-x:auto"><table style="min-width:620px"><thead><tr><th>時間</th><th>人員</th><th>動作</th><th>內容</th></tr></thead>
      <tbody>${detail || '<tr><td colspan="4" class="empty">沒有符合條件的紀錄。</td></tr>'}</tbody></table></div>
      <p class="note">僅顯示最新 300 筆（共 ${rows.length} 筆符合條件）。</p>
    </div>`;
}
function denyDelete() { toast('本版本不提供刪除資料'); return false; }
function denyIO() { return guardAdmin('匯入、匯出與備份僅限管理者使用'); }
function guardAdmin(msg) { if (isAdmin()) return true; toast(msg || '此功能僅限管理者使用'); return false; }
function catUsage(id) { return S.consumables.filter(c => c.catalogId === id).length; }
// 修改目錄規格時，同步更新所有已使用此項目的耗材（保留各設備自己的安裝資料與庫存）
function propagateCatalog(k) {
  S.consumables.filter(c => c.catalogId === k.id).forEach(c => {
    c.name = k.name; c.category = k.category; c.ratedLife = k.ratedLife;
    c.coverage = k.basis === 'days' ? 100 : k.coverage; c.unitCost = k.unitCost;
    c.sellPrice = k.sellPrice; c.leadDays = k.leadDays;
  });
}
function readCatalogForm(f, fixedBasis) {
  const name = (f.get('name') || '').toString().trim();
  const basis = fixedBasis || f.get('basis'), ratedLife = +f.get('ratedLife');
  const cov = basis === 'days' ? 100 : (+f.get('coverage') || 83);
  if (!name) return {err: '請填寫耗材名稱'};
  if (!(ratedLife > 0)) return {err: '原廠壽命需大於 0'};
  if (!(cov > 0 && cov <= 200)) return {err: '實際使用比率需介於 1 與 200 之間'};
  return {v: {name, category: f.get('category'), basis, ratedLife, coverage: cov,
    unitCost: Math.max(0, +f.get('unitCost') || 0), sellPrice: Math.max(0, +f.get('sellPrice') || 0),
    leadDays: Math.max(0, +f.get('leadDays') || 0)}};
}
function addCatalog(e) {
  e.preventDefault(); if (!guardAdmin('僅管理者可新增耗材目錄')) return;
  const r = readCatalogForm(new FormData(e.target)); if (r.err) return toast(r.err);
  logOp('新增耗材目錄', r.v.name);
  S.catalog.push({id: uid(), ...r.v}); save(); toast('已新增耗材目錄'); render();
}
function saveCatalog(e, id) {
  e.preventDefault(); if (!guardAdmin('僅管理者可修改設定')) return;
  const k = S.catalog.find(x => x.id === id); if (!k) return toast('找不到此耗材');
  const r = readCatalogForm(new FormData(e.target), k.basis); if (r.err) return toast(r.err);
  Object.assign(k, r.v, {basis: k.basis});   // 計量依據建立後不可改，避免歷史資料失真
  logOp('修改耗材目錄', k.name);
  propagateCatalog(k); save(); toast(`已更新「${k.name}」，${catUsage(id)} 筆設備耗材同步更新`); render();
}
function delCatalog(id) {
  if (!guardAdmin('僅管理者可刪除耗材目錄')) return;
  const k = S.catalog.find(x => x.id === id); if (!k) return toast('找不到此耗材');
  const cons = S.consumables.filter(c => c.catalogId === id);
  const ids = new Set(cons.map(c => c.id));
  const evN = S.events.filter(e => ids.has(e.consId)).length;
  const msg = cons.length
    ? `刪除耗材目錄「${k.name}」？將一併移除 ${cons.length} 台設備的此耗材與 ${evN} 筆更換事件（服務紀錄保留）。此動作無法復原。`
    : `刪除耗材目錄「${k.name}」？此動作無法復原。`;
  if (!confirmTwice(msg)) return;
  logOp('刪除耗材目錄', `${k.name}${cons.length ? `（連帶移除 ${cons.length} 台設備耗材）` : ''}`);
  S.consumables = S.consumables.filter(c => !ids.has(c.id));
  S.events = S.events.filter(e => !ids.has(e.consId));
  S.catalog = S.catalog.filter(x => x.id !== id);
  save(); toast('已刪除耗材目錄'); render();
}
function addCons(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  const dev = S.devices.find(x => x.id === f.get('deviceId'));
  const k = S.catalog.find(x => x.id === f.get('catalogId'));
  if (!dev || !k) return toast('請選擇耗材項目（規格由管理者在「設定」維護）');
  const isDays = k.basis === 'days';
  if (!isPrint(dev) && !isDays) return toast('此耗材為張數依據，不適用空氣清淨機');
  if (isPrint(dev) && isDays) return toast('此耗材為天數依據，不適用複合機或印表機');
  if (k.basis === 'color' && !dev.hasColor) return toast('此為黑白機，不能以彩色張數計算');
  if (CAT_COLOR.includes(k.category) && !dev.hasColor) return toast(`${k.category}只適用彩色機`);
  let ib = null, ic = null, it = null;
  if (!isDays) {
    const lr = lastReading(dev.id);
    const num = n => { const r = f.get(n); return r === null || r === '' ? null : +r; };
    ib = num('ib') ?? (lr ? lr.bw : null);
    ic = dev.hasColor ? (num('ic') ?? (lr ? lr.color : null)) : null;
    it = num('it') ?? (ib == null ? null : ib + (ic || 0));
    if (ib == null) return toast('請填寫更換當下的黑色張數');
    if (dev.hasColor && ic == null) return toast('彩色機請填寫更換當下的彩色張數');
  }
  S.consumables.push({id: uid(), deviceId: dev.id, catalogId: k.id, category: k.category, name: k.name, basis: k.basis,
    ratedLife: k.ratedLife, coverage: isDays ? 100 : (k.coverage ?? 100), unitCost: k.unitCost || 0, sellPrice: k.sellPrice || 0,
    installBw: ib, installColor: ic, installTotal: it, installDate: f.get('installDate'),
    stock: Math.max(0, +f.get('stock') || 0), minStock: Math.max(0, +f.get('minStock') || 0), leadDays: k.leadDays ?? 7});
  logOp('新增耗材', `${custName(dev)}｜${dev.model}｜${k.name}`);
  save(); toast('已新增耗材'); render();
}
function editStock(id) {
  const c = S.consumables.find(x => x.id === id);
  const s = prompt('目前庫存（件）', String(c.stock ?? 0));
  if (s === null) return;
  const m = prompt('安全庫存（件）', String(c.minStock ?? 0));
  if (m === null) return;
  if (!(+s >= 0) || !(+m >= 0)) return toast('數量格式不正確');
  c.stock = Math.floor(+s); c.minStock = Math.floor(+m);
  logOp('修改庫存', `${c.name}：庫存 ${c.stock}，安全庫存 ${c.minStock}`);
  save(); toast('已更新庫存'); render();
}
function markReplaced(id) {
  const c = S.consumables.find(x => x.id === id);
  const dev = S.devices.find(x => x.id === c.deviceId);
  const L = effLife(c);
  let newRead = null, consumed = null;

  if (c.basis === 'days') {
    consumed = daysBetween(toDate(c.installDate), today());
  } else {
    const g = currentEstimate(dev.id);
    if (!g) return toast('尚無張數讀數，無法推估');
    const bw = prompt(`更換當下的黑白張數（估計 ${fmt(g.bw)}）`, String(Math.round(g.bw)));
    if (bw === null || !(+bw >= 0)) return;
    let color = null;
    if (dev.hasColor) {
      const co = prompt(`更換當下的彩色張數（估計 ${fmt(g.color)}）`, String(Math.round(g.color)));
      if (co === null || !(+co >= 0)) return;
      color = +co;
    }
    let total = +bw + (color || 0);
    if (c.basis === 'total' && dev.hasColor) {
      const t = prompt(`更換當下的總計張數（黑色＋彩色，預設 ${fmt(+bw + color)}）`, String(+bw + color));
      if (t === null || !(+t >= 0)) return;
      total = +t;
    }
    newRead = {bw: +bw, color, total};
    const prev = basisOf({bw: c.installBw, color: c.installColor, total: c.installTotal}, c.basis);
    consumed = prev == null ? null : basisOf(newRead, c.basis) - prev;
  }

  const flags = [];
  if (consumed != null && consumed < L * EARLY_RATIO)
    flags.push(`提早更換：實際用量約為有效壽命的 ${Math.round(consumed / L * 100)}%`);
  const lastEv = S.events.filter(e => e.consId === c.id).sort((a, b) => a.date.localeCompare(b.date)).pop();
  if (lastEv) {
    const gap = daysBetween(toDate(lastEv.date), today());
    if (gap < REPEAT_DAYS) flags.push(`距上次更換僅 ${gap} 天，異常頻繁`);
  }

  S.events.push({id:uid(), consId:c.id, date:iso(today()), consumed, rated:c.ratedLife, effLife:L, basis:c.basis, flags});
  if (newRead) { c.installBw = newRead.bw; c.installColor = newRead.color; c.installTotal = newRead.total; }
  c.installDate = iso(today());
  if ((c.stock || 0) > 0) c.stock -= 1;
  else toast(`${c.name} 庫存已為 0，請確認是否已補貨`);

  logOp('記錄更換耗材', `${c.name}（${custName(dev)}）`);
  save();
  if (flags.length) toast(`已記錄更換。注意：${flags.join('；')}`);
  else toast('已記錄更換，重新推估');
  render();
}
function delCons(id) {
  if (!denyDelete()) return;
  if (!confirmTwice('刪除此耗材設定？相關更換紀錄會保留。')) return;
  S.consumables = S.consumables.filter(x => x.id !== id); save(); render();
}

/* ================= 啟動 ================= */
boot();
</script>
