<script>
/* ===================== CALC-START：計價計算（純函式，可單獨測試） ===================== */
// 所有金額以「元」為單位四捨五入；單價可到小數 4 位，用整數運算避免小數誤差
const PRICE_SCALE = 10000;
const scaled = (x, s) => Math.round((Number(x) || 0) * s);
// (units ÷ unitScale) × price，四捨五入到元
function mulRound(units, unitScale, price) {
  const num = BigInt(Math.round(units)) * BigInt(scaled(price, PRICE_SCALE));
  const den = BigInt(unitScale) * BigInt(PRICE_SCALE);
  const neg = num < 0n, a = neg ? -num : num;
  const r = (a * 2n + den) / (den * 2n);
  return Number(neg ? -r : r);
}
const feeOf = (pages, price) => mulRound(pages, 1, price);
// rows：群組內每台設備本期張數 {bw, color, large}（color／large 為 null 表示該機沒有此計數器）
function calcGroup(g, rows, months) {
  const sum = k => rows.reduce((a, r) => a + (r[k] == null ? 0 : r[k]), 0);
  const pages = {bw: sum('bw'), color: sum('color'), large: sum('large')};
  const has = {color: rows.some(r => r.color != null), large: rows.some(r => r.large != null)};
  const free = {bw: Math.round((Number(g.baseBw) || 0) * months), color: Math.round((Number(g.baseColor) || 0) * months)};
  const used = {bw: Math.min(pages.bw, free.bw), color: Math.min(pages.color, free.color)};
  const bill = {bw: pages.bw - used.bw, color: pages.color - used.color, large: pages.large, largeAsColor: 0};
  const mode = ['own', 'as_color', 'none'].includes(g.largeMode) ? g.largeMode : 'own';
  const fees = {bw: feeOf(bill.bw, g.bwPrice), color: 0, large: 0};
  if (mode === 'as_color') {
    const fi = scaled(g.largeFactor, 100);                    // 折算倍數（到小數 2 位）
    bill.largeAsColor = pages.large * fi / 100;
    fees.color = mulRound(bill.color * 100 + pages.large * fi, 100, g.colorPrice);
  } else {
    fees.color = feeOf(bill.color, g.colorPrice);
    if (mode === 'own') fees.large = feeOf(pages.large, g.largePrice);
  }
  const pagesFee = fees.bw + fees.color + fees.large;
  const rent = mulRound(months, 1, g.rent);
  const minTotal = mulRound(months, 1, g.minMonthly);
  const compare = g.minScope === 'pages_rent' ? pagesFee + rent : pagesFee;
  const topUp = minTotal > compare ? minTotal - compare : 0;
  return {mode, pages, has, free, used, bill, fees, pagesFee, rent, minTotal, compare, topUp, subtotal: pagesFee + rent + topUp};
}
// groups：[{g, rows}]；adjustments：[{amount}]（整數元，可負）；taxRate：百分比（例 5）
function calcInvoice(groups, months, adjustments, taxRate) {
  const gs = groups.map(x => ({id: x.g.id, calc: calcGroup(x.g, x.rows, months)}));
  const adjTotal = (adjustments || []).reduce((a, x) => a + Math.round(Number(x.amount) || 0), 0);
  const subtotal = gs.reduce((a, x) => a + x.calc.subtotal, 0) + adjTotal;
  const tax = mulRound(subtotal, 100, taxRate);
  return {groups: gs, adjTotal, subtotal, tax, total: subtotal + tax};
}
/* ===================== CALC-END ===================== */
</script>

<script>
/* ===================== 共用工具 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const uid = () => { const a = crypto.getRandomValues(new Uint8Array(8)); return Array.from(a, b => (b % 36).toString(36)).join('') + Date.now().toString(36).slice(-4); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const iso = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function addMonths(s, n) {
  const [y, m, d] = s.split('-').map(Number);
  const last = new Date(y, m - 1 + n + 1, 0).getDate();
  return iso(new Date(y, m - 1 + n, Math.min(d, last)));
}
const fmt = n => n == null || n === '' ? '—' : Number(n).toLocaleString('zh-TW', {maximumFractionDigits: 4});
const money = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('zh-TW');
const clone = x => JSON.parse(JSON.stringify(x));
const KIND = {copier: '複合機', printer: '印表機', purifier: '商用空氣清淨機', ozone: '商用臭氧機', phi: 'PHI商用除味機', nex: 'NEX除味系統'};
const kindIsPrint = k => !['purifier', 'phi', 'ozone', 'nex'].includes(k);
const isPrint = d => !!d && kindIsPrint(d.kind);
const isLarge = d => isPrint(d) && !!d.hasColor && !!(d.feat && d.feat.large);
const CYCLES = {1: '每月', 2: '雙月', 3: '每季'};
const LARGE_MODES = {own: '獨立單價', as_color: '折算一般彩色', none: '不另計費'};
const STATUS = {draft: '草稿', issued: '已開立', void: '已作廢'};
const STATUS_CLS = {draft: 't-info', issued: 't-ok', void: 't-gray'};
const ROLES = ['管理者', '會計', '業務助理'];
const RATE_KEYS = ['bwRate', 'colorRate', 'monthlyFee'];

function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = 'none'; }, 5200);
}
// 頁面內「按兩次確認」（8 秒內）
let armedMsg = null, armedAt = 0;
function confirmTwice(msg) {
  const now = Date.now();
  if (armedMsg === msg && now - armedAt < 8000) { armedMsg = null; return true; }
  armedMsg = msg; armedAt = now; toast(`${msg}\n請再按一次確認（8 秒內）`); return false;
}
// 防止重複送出：執行期間鎖住所有按鈕
let busy = false;
async function run(fn) {
  if (busy) return;
  busy = true; document.body.classList.add('busy');
  try { await fn(); }
  catch (e) {
    console.error(e);
    const m = String(e && e.message || e);
    toast(/fetch|network|Failed/i.test(m) ? '無法連線雲端，請確認網路後再試（這次的動作沒有存進雲端）' : m);
    if (e && e.code === '40001') {
      try { await reloadBilling(); } catch (e2) {}
      if (view === 'build' && B) { const cid = B.cid; afterRun = () => startBuild(cid); }
      else if (view === 'plans' && PE) { const cid = PE.cid; PE = null; afterRun = () => openPlan(cid); }
      else afterRun = render;
    }
  } finally { busy = false; document.body.classList.remove('busy'); }
  if (afterRun) { const f = afterRun; afterRun = null; f(); }
}
let afterRun = null;

/* ===================== 雲端連線 ===================== */
const CLOUD = window.PT_CLOUD || {url: '', key: ''};
const CLOUD_ON = /^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CLOUD.url || '') && (CLOUD.key || '').length > 20 && !/貼上|你的專案/.test(CLOUD.url + CLOUD.key);
let sb = null, ME = null, MYSTAFF = null, phase = 'init', phaseMsg = '';
const D = {customers: [], devices: [], logs: [], staff: []};
let PLANS = new Map(), SETTINGS = {}, MEMBERS = [], INVOICES = [], LINES = [];

async function call(fn, args) {
  const {data, error} = await sb.rpc(fn, args || {});
  if (error) { const e = new Error(error.message || '雲端錯誤'); e.code = error.code; throw e; }
  return data;
}
async function fetchPaged(build) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const {data, error} = await build().range(from, from + 999);
    if (error) { const e = new Error(error.message); e.code = error.code; throw e; }
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
const okLog = l => l && ID_RE.test(String(l.id)) && ID_RE.test(String(l.deviceId || '')) && typeof l.date === 'string' && DATE_RE.test(l.date);
async function loadApp() {
  const rows = await fetchPaged(() => sb.from('app_records').select('coll,id,data').in('coll', ['customers', 'devices', 'logs', 'staff']).order('coll').order('id'));
  D.customers = []; D.devices = []; D.logs = []; D.staff = [];
  rows.forEach(r => {
    const x = r.data;
    if (!x || typeof x !== 'object' || !ID_RE.test(String(r.id)) || String(x.id) !== String(r.id)) return;
    if (r.coll === 'logs' && !okLog(x)) return;
    if (r.coll === 'devices' && !ID_RE.test(String(x.customerId || ''))) return;
    D[r.coll].push(x);
  });
}
async function reloadBilling() {
  const [st, pl, mb, inv, ln] = await Promise.all([
    sb.from('billing_settings').select('key,data').eq('key', 'company'),
    fetchPaged(() => sb.from('billing_plans').select('customer_id,data,updated_at').order('customer_id')),
    fetchPaged(() => sb.from('billing_members').select('email,name,role,active,updated_at').order('email')),
    fetchPaged(() => sb.from('billing_invoices').select('id,no,customer_id,status,period_from,period_to,months,subtotal,tax,total,note,created_at,created_by,updated_at,issued_at,issued_by,void_at,void_by,void_reason').order('created_at').order('id')),
    fetchPaged(() => sb.from('billing_invoice_lines').select('invoice_id,device_id,group_id,start_date,end_date,start_bw,end_bw,start_color,end_color,start_large,end_large,start_log_id,end_log_id').order('invoice_id').order('device_id'))]);
  if (st.error) throw new Error(st.error.message);
  SETTINGS = (st.data[0] && st.data[0].data) || {};
  PLANS = new Map(pl.map(p => [p.customer_id, {data: p.data, ts: p.updated_at}]));
  MEMBERS = mb; INVOICES = inv; LINES = ln;
}
async function boot() {
  if (location.protocol === 'file:') {
    phase = 'stop';
    phaseMsg = '這是直接在電腦上打開的檔案，無法連線雲端。請把 billing.html 上傳到 GitHub 的 printtown-service（和 index.html 放在一起），再用網址開啟：設備保養系統的網址最後加上 billing.html，或在設備保養系統按「計張計價」。';
    return render();
  }
  if (!CLOUD_ON) { phase = 'stop'; phaseMsg = '找不到雲端設定（config.js）。請確認 billing.html 和 index.html、config.js 放在 GitHub 的同一個資料夾，並從網址開啟。'; return render(); }
  if (!window.supabase || !window.supabase.createClient) { phase = 'stop'; phaseMsg = '雲端元件無法載入，請確認網路後重新整理。'; return render(); }
  sb = window.supabase.createClient(CLOUD.url, CLOUD.key);
  try {
    const {data: {session}} = await sb.auth.getSession();
    if (!session) { phase = 'login'; return render(); }
    if (((session.user.app_metadata || {}).provider || '') !== 'google') { phase = 'stop'; phaseMsg = '本系統僅接受 Google 帳號登入。'; return render(); }
    let who;
    try { who = await call('billing_whoami'); }
    catch (e) { phase = 'stop'; phaseMsg = '計價系統尚未安裝或無法連線。請管理者先在 Supabase 執行 billing-setup-v1.sql。'; return render(); }
    if (!who || !who.member) { phase = 'deny'; return render(); }
    ME = who;
    await loadApp();
    MYSTAFF = D.staff.find(s => s.active && String(s.email || '').toLowerCase() === ME.email) || null;
    if (!MYSTAFF) { phase = 'stop'; phaseMsg = '你在計價人員名單內，但尚未在設備保養系統核准。請管理者先在保養系統核准你的 Google 帳號。'; return render(); }
    await reloadBilling();
    phase = 'ready';
  } catch (e) { console.error(e); phase = 'stop'; phaseMsg = '載入失敗：' + (e.message || e); }
  render();
}

/* ===================== 資料查詢 ===================== */
const custById = id => D.customers.find(c => c.id === id) || null;
const devById = id => D.devices.find(d => d.id === id) || null;
const invById = id => INVOICES.find(i => i.id === id) || null;
const memberName = email => { const m = MEMBERS.find(x => x.email === email); return m && m.name ? m.name : (email || ''); };
const printDevsOf = cid => D.devices.filter(d => d.customerId === cid && isPrint(d))
  .sort((a, b) => String(a.location || '').localeCompare(String(b.location || ''), 'zh-TW') || String(a.model || '').localeCompare(String(b.model || '')));
const devLabel = d => d ? `${KIND[d.kind] || ''} ${d.brand || ''} ${d.model || ''}`.replace(/\s+/g, ' ').trim() : '（已刪除的設備）';
const billableCustomers = () => D.customers.filter(c => c.contract === '計張' || PLANS.has(c.id))
  .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'zh-TW'));
// 有讀數的紀錄（依日期、同日依讀數排序；與保養系統相同）
function readingsOf(devId) {
  return D.logs.filter(l => l.deviceId === devId && Number.isFinite(l.bw))
    .sort((a, b) => a.date.localeCompare(b.date) || a.bw - b.bw || (a.color || 0) - (b.color || 0));
}
const fromLog = l => ({date: l.date, bw: l.bw, color: l.color ?? null, large: l.colorLarge ?? null, logId: l.id, type: l.type || ''});
const readTxt = (d, r) => `黑白 ${fmt(r.bw)}${d.hasColor ? `／彩色 ${r.color == null ? '—' : fmt(r.color)}` : ''}${isLarge(d) ? `／大尺寸 ${r.large == null ? '—' : fmt(r.large)}` : ''}`;
// 該設備最近一張「已開立」收費單的明細
function lastIssuedLine(devId) {
  return LINES.filter(l => l.device_id === devId && (invById(l.invoice_id) || {}).status === 'issued')
    .sort((a, b) => a.end_date.localeCompare(b.end_date) || a.end_bw - b.end_bw).pop() || null;
}
const lastIssuedInvoice = cid => INVOICES.filter(i => i.customer_id === cid && i.status === 'issued')
  .sort((a, b) => String(a.period_to).localeCompare(String(b.period_to)) || String(a.issued_at).localeCompare(String(b.issued_at))).pop() || null;
const draftOf = cid => INVOICES.filter(i => i.customer_id === cid && i.status === 'draft')
  .sort((a, b) => String(a.updated_at).localeCompare(String(b.updated_at))).pop() || null;

/* ===================== 畫面切換 ===================== */
let view = 'due';
function go(v) { view = v; render(); window.scrollTo(0, 0); }
function render() {
  const nav = $('#nav');
  if (phase !== 'ready') {

      : phase === 'login' ? box('<h2>請先登入</h2><p class="note">計張計價系統與設備保養系統使用同一個 Google 登入。請先到設備保養系統登入，再回到這裡。</p><a href="./"><button class="primary">前往設備保養系統登入</button></a>')
      : phase === 'deny' ? box('<h2>沒有權限</h2><p class="note">計張計價系統只開放給管理者、會計與業務助理。如需使用，請洽計價人員把你加入名單。</p><a href="./"><button class="ghost">回設備保養系統</button></a>')
      : box(`<h2>無法使用</h2><p class="note">${esc(phaseMsg)}</p><button class="ghost" onclick="location.reload()">重新整理</button>`);

  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === view));
  $('#who').textContent = `${ME.name || ME.email}（${ME.role}）`;
  const fn = {due: viewDue, build: viewBuild, plans: viewPlans, list: viewList, admin: viewAdmin}[view] || viewDue;
  $('#main').innerHTML = fn();
}

/* ===================== 本期待開單 ===================== */
let dueAll = false;
function custStatus(c) {
  const pe = PLANS.get(c.id), plan = pe && pe.data;
  const devs = printDevsOf(c.id);
  if (!plan) return {c, code: 'noplan', rank: 1};
  const inGroup = new Set((plan.groups || []).flatMap(g => g.devices || [])), ex = new Set(plan.excluded || []);
  const unassigned = devs.filter(d => !inGroup.has(d.id) && !ex.has(d.id));
  const billed = devs.filter(d => inGroup.has(d.id));
  const last = lastIssuedInvoice(c.id);
  const next = last ? addMonths(String(last.period_to), plan.cycle || 1) : null;
  const missing = billed.filter(d => {
    const prev = lastIssuedLine(d.id), rs = readingsOf(d.id);
    return prev ? !rs.some(r => r.date > prev.end_date) : rs.length < 2;
  });
  const due = !last || next <= iso(today());
  return {c, plan, unassigned, billed, last, next, missing, draft: draftOf(c.id), due,
    code: unassigned.length ? 'unassigned' : due ? 'due' : 'later', rank: unassigned.length ? 2 : due ? 0 : 3};
}
function viewDue() {
  const list = billableCustomers().map(custStatus).sort((a, b) => a.rank - b.rank || String(a.c.name).localeCompare(String(b.c.name), 'zh-TW'));
  const shown = dueAll ? list : list.filter(x => x.code !== 'later');
  const cnt = k => list.filter(x => x.code === k).length;
  const rows = shown.map(x => {
    const c = x.c;
    const st = x.code === 'noplan' ? '<span class="tag t-warn">尚未設定計價</span>'
      : x.code === 'unassigned' ? `<span class="tag t-warn">${x.unassigned.length} 台設備未設定群組</span>`
      : x.code === 'due' ? (x.last ? '<span class="tag t-danger">已到期</span>' : '<span class="tag t-info">尚未開過單</span>')
      : `<span class="tag t-ok">尚未到期</span>`;
    const miss = x.missing && x.missing.length ? ` <span class="tag t-warn">缺抄表 ${x.missing.length} 台</span>` : '';
    const dr = x.draft ? ' <span class="tag t-info">有草稿</span>' : '';
    return `<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.contract || '')}${x.plan ? '・' + esc(CYCLES[x.plan.cycle] || '') + '計費' : ''}</div></td>
      <td>${st}${miss}${dr}</td>
      <td>${x.last ? `${esc(x.last.no)}<div class="muted">${esc(x.last.period_from)} ～ ${esc(x.last.period_to)}</div>` : '<span class="muted">—</span>'}</td>
      <td>${x.next ? esc(x.next) : '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${x.plan ? `<button class="primary" onclick="startBuild('${c.id}')">${x.draft ? '繼續草稿' : '開單'}</button> ` : ''}<button class="ghost" onclick="openPlan('${c.id}')">設定計價</button></td></tr>`;
  }).join('');
  return `<div class="card"><div class="split"><h2 style="margin:0">本期待開單</h2>
      <label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" ${dueAll ? 'checked' : ''} onchange="dueAll=this.checked;render()"> 也顯示尚未到期的客戶</label></div>
    <div class="row-actions" style="margin:10px 0">
      <span class="tag t-danger">已到期 ${list.filter(x => x.code === 'due' && x.last).length}</span>
      <span class="tag t-info">尚未開過單 ${list.filter(x => x.code === 'due' && !x.last).length}</span>
      <span class="tag t-warn">尚未設定計價 ${cnt('noplan')}</span>
      <span class="tag t-warn">設備未設定群組 ${cnt('unassigned')}</span>
      <span class="tag t-ok">尚未到期 ${cnt('later')}</span></div>
    ${rows ? `<table style="min-width:760px"><thead><tr><th>客戶</th><th>狀態</th><th>上一張收費單</th><th>下次應開單</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">目前沒有需要處理的客戶。</div>'}
    <p class="note">列出合約為「計張」或已設定計價的客戶。下次應開單 ＝ 上一張收費單的迄抄日 ＋ 計費週期。缺抄表 ＝ 該設備在上一張收費單之後還沒有新的讀數。</p></div>`;
}

/* ===================== 開單 ===================== */
let B = null;            // 開單中的狀態
let readFor = null;      // 正在登打抄表的設備
function blankBuild(cid) {
  const pe = PLANS.get(cid);
  return {cid, draftId: null, draftTs: null, months: (pe && pe.data.cycle) || 1, monthsReason: '', adj: [], note: '', sel: {}};
}
async function startBuild(cid) {
  if (!custById(cid)) return toast('找不到此客戶');
  await run(async () => {
    const dr = draftOf(cid);
    B = blankBuild(cid);
    if (dr) {
      const {data, error} = await sb.from('billing_invoices').select('snapshot,updated_at').eq('id', dr.id);
      if (error) throw new Error(error.message);
      const snap = (data[0] && data[0].snapshot) || {};
      const inp = snap.input || {};
      Object.assign(B, {draftId: dr.id, draftTs: data[0].updated_at, months: dr.months, monthsReason: snap.monthsReason || '',
        adj: Array.isArray(snap.adjustments) ? snap.adjustments.map(a => ({id: uid(), desc: String(a.desc || ''), amount: Math.round(Number(a.amount) || 0)})) : [],
        note: dr.note || '', sel: inp.sel && typeof inp.sel === 'object' ? inp.sel : {}});
    }
    readFor = null; view = 'build';
  });
  render(); window.scrollTo(0, 0);
}
function pickBuildCust(cid) { if (!cid) { B = null; return render(); } startBuild(cid); }
function setSel(devId, which, val) {
  if (!B) return;
  const cur = {...(B.sel[devId] || {}), [which]: val || null};
  if (which === 'start') delete cur.end;          // 起點改變：結束讀數重新預設為最新一筆
  B.sel[devId] = cur; render();
}
function setMonths(v) { const n = Number(v); if (!(Number.isInteger(n) && n >= 1 && n <= 12)) { toast('計費月數請填 1～12 的整數'); return render(); } B.months = n; render(); }
function setB(k, v) { if (!B) return; B[k] = String(v).slice(0, k === 'note' ? 500 : 200); render(); }
function addAdj() { B.adj.push({id: uid(), desc: '', amount: 0}); render(); }
function setAdj(id, k, v) {
  const a = B.adj.find(x => x.id === id); if (!a) return;
  if (k === 'amount') { const n = Number(v); if (!Number.isInteger(n) || Math.abs(n) > 99999999) { toast('金額請填整數（折讓填負數）'); return render(); } a.amount = n; }
  else a.desc = String(v).slice(0, 60);
  render();
}
function delAdj(id) { B.adj = B.adj.filter(x => x.id !== id); render(); }

// 依目前選擇計算每台設備的起迄讀數、張數與錯誤
function buildModel() {
  const c = custById(B.cid), pe = PLANS.get(B.cid), plan = pe && pe.data;
  const m = {c, plan, groups: [], errors: [], warnings: [], lines: []};
  if (!plan) { m.errors.push('這位客戶尚未設定計價'); return m; }
  const inGroup = new Set((plan.groups || []).flatMap(g => g.devices || [])), ex = new Set(plan.excluded || []);
  const un = printDevsOf(B.cid).filter(d => !inGroup.has(d.id) && !ex.has(d.id));
  if (un.length) m.errors.push(`${un.length} 台列印設備尚未加入計費群組或標示不計費：${un.map(d => devLabel(d) + (d.location ? '（' + d.location + '）' : '')).join('、')}`);
  (plan.groups || []).forEach(g => {
    const gm = {g, devs: []};
    (g.devices || []).forEach(id => {
      const d = devById(id);
      if (!d) { m.warnings.push(`群組「${g.name || ''}」有一台設備已從保養系統刪除，本次略過（編號 ${id}）`); return; }
      const x = {d, start: null, end: null, errors: [], warnings: [], startOpts: [], endOpts: [], prev: null};
      const rs = readingsOf(d.id);
      const prev = lastIssuedLine(d.id);
      if (prev) {
        x.prev = prev;
        x.start = {date: prev.end_date, bw: prev.end_bw, color: prev.end_color, large: prev.end_large, logId: prev.end_log_id, locked: true, no: (invById(prev.invoice_id) || {}).no};
        const lg = prev.end_log_id && D.logs.find(l => l.id === prev.end_log_id);
        if (!lg) x.warnings.push('起始讀數的服務紀錄已被刪除，以收費單上的數值為準');
        else if (lg.date !== prev.end_date || lg.bw !== prev.end_bw || (d.hasColor && (lg.color ?? null) !== prev.end_color) || (isLarge(d) && (lg.colorLarge ?? null) !== prev.end_large))
          x.warnings.push('起始讀數的服務紀錄已被修改，以收費單上的數值為準');
      } else {
        x.startOpts = rs.slice().reverse();
        const sid = (B.sel[d.id] || {}).start;
        const lg = sid && rs.find(r => r.id === sid);
        if (lg) x.start = fromLog(lg); else x.errors.push(rs.length ? '請選擇起始讀數（第一次開單）' : '這台設備還沒有任何讀數，請先登打抄表');
      }
      if (x.start) {
        x.endOpts = rs.filter(r => r.id !== x.start.logId && (r.date > x.start.date || (r.date === x.start.date && r.bw >= x.start.bw))).reverse();
        let eid = (B.sel[d.id] || {}).end;
        if (eid === undefined && x.endOpts.length) { eid = x.endOpts[0].id; B.sel[d.id] = {...(B.sel[d.id] || {}), end: eid}; }
        const lg = (eid && x.endOpts.find(r => r.id === eid)) || null;
        if (lg) x.end = fromLog(lg);
        else if (eid) x.errors.push('原本選的結束讀數已不存在，請重新選擇');
        else x.errors.push(x.endOpts.length ? '請選擇結束讀數' : '沒有比起始讀數更新的讀數，請登打抄表');
      }
      if (x.start && x.end) {
        const need = [['bw', '黑白', true], ['color', '彩色', !!d.hasColor], ['large', '大尺寸彩色', isLarge(d)]];
        need.forEach(([k, label, req]) => {
          if (!req) return;
          if (x.start[k] == null) x.errors.push(`起始讀數缺少${label}`);
          if (x.end[k] == null) x.errors.push(`結束讀數缺少${label}`);
          if (x.start[k] != null && x.end[k] != null && x.end[k] < x.start[k]) x.errors.push(`${label}讀數倒退（${fmt(x.start[k])} → ${fmt(x.end[k])}），請確認是否換機或歸零`);
        });
        if (x.end.date > iso(today())) x.errors.push('結束讀數日期晚於今天');
      }
      if (!x.errors.length && x.start && x.end) {
        x.pages = {bw: x.end.bw - x.start.bw, color: d.hasColor ? x.end.color - x.start.color : null, large: isLarge(d) ? x.end.large - x.start.large : null};
        m.lines.push({device_id: d.id, group_id: g.id, start_date: x.start.date, end_date: x.end.date,
          start_bw: x.start.bw, end_bw: x.end.bw,
          start_color: d.hasColor ? x.start.color : null, end_color: d.hasColor ? x.end.color : null,
          start_large: isLarge(d) ? x.start.large : null, end_large: isLarge(d) ? x.end.large : null,
          start_log_id: x.start.logId || null, end_log_id: x.end.logId});
      }
      x.errors.forEach(e => m.errors.push(`${devLabel(d)}${d.location ? '（' + d.location + '）' : ''}：${e}`));
      x.warnings.forEach(w => m.warnings.push(`${devLabel(d)}${d.location ? '（' + d.location + '）' : ''}：${w}`));
      gm.devs.push(x);
    });
    if (gm.devs.length) m.groups.push(gm);
  });
  if (!m.groups.length) m.errors.push('計價設定中沒有任何設備');
  if (B.months !== plan.cycle && !String(B.monthsReason || '').trim()) m.errors.push(`計費月數（${B.months}）與計費週期（${CYCLES[plan.cycle]}）不同，請填寫原因`);
  B.adj.forEach((a, i) => { if (!String(a.desc).trim() && a.amount) m.errors.push(`第 ${i + 1} 筆其他調整項請填寫說明`); });
  const taxRate = Number(SETTINGS.taxRate ?? 5);
  m.calc = calcInvoice(m.groups.map(gm => ({g: gm.g, rows: gm.devs.filter(x => x.pages).map(x => x.pages)})), B.months, B.adj, taxRate);
  m.taxRate = taxRate;
  return m;
}
// 收費單快照：開單當下的客戶資料、單價、讀數與計算結果（開立後不再改變）
function buildSnapshot(m) {
  const c = m.c, p = m.plan;
  return {v: 1, company: clone(SETTINGS), months: B.months, monthsReason: B.months !== p.cycle ? String(B.monthsReason || '').trim() : '',
    cycle: p.cycle, note: B.note,
    customer: {id: c.id, name: c.name || '', title: p.title || c.name || '', taxId: p.taxId || '', contact: p.contact || '', phone: p.phone || '', email: p.email || '', address: p.address || ''},
    adjustments: B.adj.filter(a => String(a.desc).trim() || a.amount).map(a => ({desc: String(a.desc).trim(), amount: a.amount})),
    groups: m.groups.map((gm, i) => ({id: gm.g.id, name: gm.g.name || `群組 ${i + 1}`,
      price: {bwPrice: gm.g.bwPrice, colorPrice: gm.g.colorPrice, largeMode: gm.g.largeMode, largePrice: gm.g.largePrice, largeFactor: gm.g.largeFactor,
        rent: gm.g.rent, baseBw: gm.g.baseBw, baseColor: gm.g.baseColor, minMonthly: gm.g.minMonthly, minScope: gm.g.minScope},
      devices: gm.devs.filter(x => x.pages).map(x => ({id: x.d.id, label: devLabel(x.d), location: x.d.location || '', hasColor: !!x.d.hasColor, hasLarge: isLarge(x.d),
        start: {date: x.start.date, bw: x.start.bw, color: x.d.hasColor ? x.start.color : null, large: isLarge(x.d) ? x.start.large : null},
        end: {date: x.end.date, bw: x.end.bw, color: x.d.hasColor ? x.end.color : null, large: isLarge(x.d) ? x.end.large : null},
        pages: x.pages})),
      calc: m.calc.groups[i].calc})),
    totals: {adjTotal: m.calc.adjTotal, subtotal: m.calc.subtotal, taxRate: m.taxRate, tax: m.calc.tax, total: m.calc.total},
    input: {sel: B.sel}};
}
function viewBuild() {
  const opts = billableCustomers().map(c => `<option value="${esc(c.id)}" ${B && B.cid === c.id ? 'selected' : ''}>${esc(c.name)}${PLANS.has(c.id) ? '' : '（尚未設定計價）'}</option>`).join('');
  const head = `<div class="card"><h2>開單</h2><div class="form-row" style="margin:0">
      <div><label>選擇客戶</label><select id="buildCust" onchange="pickBuildCust(this.value)"><option value="">請選擇客戶</option>${opts}</select></div></div></div>`;
  if (!B) return head;
  const m = buildModel();
  if (!m.plan) return head + `<div class="card"><div class="alert">這位客戶尚未設定計價。</div><button class="primary" onclick="openPlan('${B.cid}')">前往設定計價</button></div>`;
  const dr = B.draftId ? '<span class="tag t-info">草稿</span>' : '<span class="tag t-gray">新收費單</span>';
  const groupsHtml = m.groups.map(gm => {
    const g = gm.g;
    const devHtml = gm.devs.map(x => deviceBuildHtml(x)).join('');
    return `<div class="grp"><div class="grp-head"><b>${esc(g.name || '群組')}</b><span class="muted">${priceSummary(g)}</span></div>${devHtml}</div>`;
  }).join('');
  const adjHtml = B.adj.map(a => `<div class="form-row" style="margin:6px 0">
      <div style="grid-column:span 2"><label>說明</label><input maxlength="60" value="${esc(a.desc)}" onchange="setAdj('${a.id}','desc',this.value)" placeholder="例如：其他費用、折讓"></div>
      <div><label>金額（未稅，折讓填負數）</label><input type="number" step="1" value="${esc(a.amount)}" onchange="setAdj('${a.id}','amount',this.value)"></div>
      <div><button class="ghost danger" onclick="delAdj('${a.id}')">移除</button></div></div>`).join('');
  const errs = m.errors.length ? `<div class="alert err"><b>尚不能開立：</b>${m.errors.map(e => `<div>• ${esc(e)}</div>`).join('')}</div>` : '';
  const warns = m.warnings.length ? `<div class="alert"><b>提醒：</b>${m.warnings.map(e => `<div>• ${esc(e)}</div>`).join('')}</div>` : '';
  const snap = buildSnapshot(m);
  return head + `<div class="card"><div class="split"><h2 style="margin:0">${esc(m.c.name)} ${dr}</h2>
      <span class="muted">計費週期：${esc(CYCLES[m.plan.cycle])}・稅率 ${esc(m.taxRate)}%</span></div>
    <p class="note">起始讀數自動接上一張已開立收費單的結束讀數，不能修改；結束讀數預設為最新的一筆，可改選。客戶傳來讀數時，按「登打抄表」直接輸入。</p>
    ${groupsHtml}
    <div class="form-row" style="margin-top:14px">
      <div><label>計費月數（月租、基本張數、保底依此計算）</label><input type="number" min="1" max="12" step="1" value="${esc(B.months)}" onchange="setMonths(this.value)"></div>
      ${B.months !== m.plan.cycle ? `<div style="grid-column:span 2"><label>計費月數與週期不同的原因（會印在收費單）</label><input maxlength="200" value="${esc(B.monthsReason)}" onchange="setB('monthsReason',this.value)" placeholder="例如：首期自 9/15 起算"></div>` : ''}
    </div>
    <h3>其他調整項</h3>${adjHtml || '<div class="muted">沒有</div>'}
    <div style="margin:6px 0 12px"><button class="ghost" onclick="addAdj()">＋ 新增調整項</button></div>
    <div class="form-row"><div class="wide"><label>收費單備註（會印在收費單）</label><textarea rows="2" maxlength="500" onchange="setB('note',this.value)">${esc(B.note)}</textarea></div></div>
    ${errs}${warns}
    <div class="row-actions">
      <button class="ghost" ${m.errors.length ? 'disabled' : ''} onclick="saveDraft()">存草稿</button>
      <button class="primary big" ${m.errors.length ? 'disabled' : ''} onclick="issueNow()">開立收費單</button>
      <button class="ghost" onclick="printPreview()">列印預覽</button>

function priceSummary(g) {

    g.largeMode === 'as_color' ? `大尺寸折算 ${fmt(g.largeFactor)} 張彩色` : g.largeMode === 'none' ? '大尺寸不另計' : `大尺寸 ${fmt(g.largePrice)}`];
  if (g.rent) p.push(`月租 ${money(g.rent)}`);
  if (g.baseBw || g.baseColor) p.push(`每月基本 黑白 ${fmt(g.baseBw)}／彩色 ${fmt(g.baseColor)}`);
  if (g.minMonthly) p.push(`每月保底 ${money(g.minMonthly)}`);

}
function deviceBuildHtml(x) {

    ? `<div class="lock">🔒 接續 ${esc(x.start.no || '上一張')}<br>${esc(x.start.date)}　${esc(readTxt(d, x.start))}</div>`
    : `<select onchange="setSel('${d.id}','start',this.value)"><option value="">請選擇起始讀數</option>${x.startOpts.map(r => { const v = fromLog(r); return `<option value="${esc(r.id)}" ${x.start && x.start.logId === r.id ? 'selected' : ''}>${esc(v.date)}　${esc(readTxt(d, v))}（${esc(r.type || '')}）</option>`; }).join('')}</select>`;
  const endHtml = x.start ? `<select onchange="setSel('${d.id}','end',this.value)"><option value="">請選擇結束讀數</option>${x.endOpts.map(r => { const v = fromLog(r); return `<option value="${esc(r.id)}" ${x.end && x.end.logId === r.id ? 'selected' : ''}>${esc(v.date)}　${esc(readTxt(d, v))}（${esc(r.type || '')}）</option>`; }).join('')}</select>` : '<span class="muted">先選起始讀數</span>';

  const er = x.errors.map(e => `<div style="color:var(--danger);font-size:13px">• ${esc(e)}</div>`).join('') + x.warnings.map(e => `<div style="color:var(--warn);font-size:13px">• ${esc(e)}</div>`).join('');

/* ---- 登打抄表：寫入保養系統的服務紀錄（類型「抄表」），兩個系統共用讀數 ---- */
function toggleRead(devId) { readFor = readFor === devId ? null : devId; render(); }
function readFormHtml(d) {
  return `<form class="read-box" onsubmit="saveReading(event,'${d.id}')"><div class="form-row" style="margin:0">
    <div><label>抄表日期</label><input type="date" name="date" min="2000-01-01" max="${iso(today())}" value="${iso(today())}" required></div>
    <div><label>黑白讀數</label><input type="number" name="bw" min="0" step="1" required></div>
    ${d.hasColor ? '<div><label>彩色讀數</label><input type="number" name="color" min="0" step="1" required></div>' : ''}
    ${isLarge(d) ? '<div><label>大尺寸彩色讀數</label><input type="number" name="large" min="0" step="1" required></div>' : ''}
    <div class="wide"><label>備註（例如：客戶 LINE 回報）</label><input name="note" maxlength="200"></div>
    <div><button class="primary" type="submit">儲存抄表</button></div></div>
    <div class="muted" style="margin-top:6px">儲存後會出現在設備保養系統的服務紀錄（類型「抄表」，不算到府保養），並自動選為結束讀數。</div></form>`;
}
function readingIssues(devId, date, bw, color, large) {
  const vs = readingsOf(devId), out = [];
  const chk = (label, val, f) => {
    if (val == null) return;
    const p = vs.filter(x => x.date <= date && f(x) != null).pop(), n = vs.find(x => x.date > date && f(x) != null);
    if (p && val < f(p)) out.push(`${label} ${fmt(val)} 低於 ${p.date} 的 ${fmt(f(p))}`);
    if (n && val > f(n)) out.push(`${label} ${fmt(val)} 高於之後 ${n.date} 的 ${fmt(f(n))}`);
  };
  chk('黑白', bw, x => x.bw); chk('彩色', color, x => x.color ?? null); chk('大尺寸', large, x => x.colorLarge ?? null);
  return out;
}
async function saveReading(e, devId) {
  e.preventDefault();
  const d = devById(devId); if (!d) return toast('找不到此設備');
  const f = new FormData(e.target), num = k => { const s = String(f.get(k) ?? '').trim(); return s === '' ? null : Number(s); };
  const date = String(f.get('date') || '');
  if (!DATE_RE.test(date) || iso(toDate(date)) !== date) return toast('抄表日期不正確');
  if (date < '2000-01-01' || date > iso(today())) return toast(`抄表日期需介於 2000-01-01 與今天（${iso(today())}）`);
  const bw = num('bw'), color = d.hasColor ? num('color') : null, large = isLarge(d) ? num('large') : null;
  const bad = v => v != null && !(Number.isInteger(v) && v >= 0 && v <= 999999999999);
  if (bw == null || bad(bw)) return toast('黑白讀數請填 0 以上的整數');
  if (d.hasColor && (color == null || bad(color))) return toast('彩色讀數請填 0 以上的整數');
  if (isLarge(d) && (large == null || bad(large))) return toast('大尺寸讀數請填 0 以上的整數');
  const iss = readingIssues(devId, date, bw, color, large);
  if (iss.length && !confirmTwice(`${iss.join('；')}。讀數應依日期遞增；若為換機或歸零請再按一次。`)) return;
  const id = uid();
  const log = {id, deviceId: devId, date, type: '抄表', bw, color, colorLarge: large, engineer: MYSTAFF.name || '',
    serviceRecord: '抄表（計價系統登打）', customerInstruction: '', consumableStock: '', consOther: '', purchaseSignal: '',
    note: String(f.get('note') || '').trim().slice(0, 200), engConfirmed: false};
  const c = custById(d.customerId);
  const op = {id: uid(), t: new Date().toISOString(), staffId: MYSTAFF.id, staff: MYSTAFF.name || '', action: '抄表',
    summary: `${c ? c.name : ''}｜${d.model || ''}｜${date}（計價系統）`};
  await run(async () => {
    const {error} = await sb.from('app_records').upsert([{coll: 'logs', id, data: log}, {coll: 'oplog', id: op.id, data: op}], {onConflict: 'coll,id'});
    if (error) throw new Error('抄表沒有存進雲端：' + error.message);
    D.logs.push(log);
    if (B) B.sel[devId] = {...(B.sel[devId] || {}), end: id};
    readFor = null;
    toast('已儲存抄表，並選為結束讀數');
  });
  render();
}

/* ---- 草稿、開立、捨棄 ---- */
function payloadOf(m) {
  const snap = buildSnapshot(m);
  return {months: B.months, note: B.note, subtotal: m.calc.subtotal, tax: m.calc.tax, total: m.calc.total, snapshot: snap, lines: m.lines};
}
async function saveDraftInner() {
  const m = buildModel();
  if (m.errors.length) throw new Error('尚有未完成的項目，請先處理紅色提示');
  const r = await call('billing_draft_save', {p_id: B.draftId, p_customer_id: B.cid, p_payload: payloadOf(m), p_expected: B.draftTs});
  B.draftId = r.id; B.draftTs = r.updated_at;
  return r;
}
function saveDraft() {
  run(async () => { await saveDraftInner(); await reloadBilling(); toast('已存草稿'); }).then(render);
}
function issueNow() {
  const m = buildModel();
  if (m.errors.length) return toast('尚有未完成的項目，請先處理紅色提示');
  if (!confirmTwice(`開立「${m.c.name}」收費單，含稅總計 NT$ ${money(m.calc.total)}？開立後內容與讀數會鎖定，只能作廢。`)) return;
  let issued = null;
  run(async () => {
    await saveDraftInner();
    issued = await call('billing_issue', {p_id: B.draftId, p_expected: B.draftTs});
    await reloadBilling();
  }).then(async () => {
    if (issued) { toast(`已開立收費單 ${issued.no}`); B = null; await openInvoice(issued.id); view = 'list'; }
    render(); window.scrollTo(0, 0);
  });
}
function discardDraft() {
  if (!B || !B.draftId) return;
  if (!confirmTwice('捨棄這張草稿？捨棄後會以「作廢」保留紀錄。')) return;
  run(async () => {
    await call('billing_void', {p_id: B.draftId, p_reason: '草稿捨棄', p_expected: B.draftTs});
    await reloadBilling(); B = blankBuild(B.cid); toast('已捨棄草稿');
  }).then(render);
}
function printPreview() {
  if (!B) return;
  const m = buildModel();
  printHtml(invoiceHtml(buildSnapshot(m), {status: 'draft', by: ME.name || ME.email}));
}

    const rows = g.devices.map(x => {
      const cs = [['黑白', 'bw'], ...(x.hasColor ? [['彩色', 'color']] : []), ...(x.hasLarge ? [['大尺寸彩色', 'large']] : [])];

      r.push(line('彩色', fmt(c.pages.color), c.free.color ? '−' + fmt(c.used.color) : '—', fmt(c.bill.color) + (extra ? `<div style="font-size:11px">${extra}</div>` : ''), fmt(p.colorPrice), c.fees.color));
    }
    if (c.has.large && c.mode === 'own') r.push(line('大尺寸彩色', fmt(c.pages.large), '—', fmt(c.bill.large), fmt(p.largePrice), c.fees.large));
    if (c.has.large && c.mode === 'none') r.push(line('大尺寸彩色（不另計費）', fmt(c.pages.large), '—', '—', '—', 0));
    if (c.rent) r.push(`<tr><td>月租</td><td colspan="4">${money(p.rent)} × ${s.months} 個月</td><td class="num">${money(c.rent)}</td></tr>`);
    if (c.topUp) r.push(`<tr><td>保底補足</td><td colspan="4">每月保底 ${money(p.minMonthly)} × ${s.months} 個月 ＝ ${money(c.minTotal)}（${p.minScope === 'pages_rent' ? '張數費用＋月租' : '張數費用'} ${money(c.compare)}）</td><td class="num">${money(c.topUp)}</td></tr>`);

      <div class="inv-meta"><div class="t">收費單</div><div>單號：${esc(meta.no || '（開立後產生）')}</div><div>開單日：${esc(meta.issuedAt ? String(meta.issuedAt).slice(0, 10) : iso(today()))}</div>${st === 'void' ? `<div style="color:#b91c1c">已作廢：${esc(meta.voidReason || '')}</div>` : ''}</div></div>

      <div><b>聯絡人：</b>${esc(cu.contact || '—')}</div><div><b>電話：</b>${esc(cu.phone || '—')}</div>
      <div style="grid-column:1/-1"><b>地址：</b>${esc(cu.address || '—')}${cu.email ? `　<b>Email：</b>${esc(cu.email)}` : ''}</div>
      <div style="grid-column:1/-1"><b>計張區間：</b>${esc(periodFrom)} ～ ${esc(periodTo)}　<b>計費週期：</b>${esc(CYCLES[s.cycle] || '')}　<b>計費月數：</b>${esc(s.months)} 個月${s.monthsReason ? `（${esc(s.monthsReason)}）` : ''}</div>
    </div>
    <div class="inv-sec">一、抄表明細</div>
    <table><thead><tr><th>機型／地點</th><th>計數器</th><th>起抄日</th><th class="num">起始讀數</th><th>迄抄日</th><th class="num">結束讀數</th><th class="num">張數</th></tr></thead><tbody>${readRows}</tbody></table>

    ${base}
    <table class="inv-total"><tbody>
      <tr><td>未稅合計</td><td class="num">${money(t.subtotal)}</td></tr>

  const withKeys = D.devices.filter(hasRateKeys), withVal = withKeys.filter(hasRateValue);
  const byCust = new Map(); withVal.forEach(d => { if (!byCust.has(d.customerId)) byCust.set(d.customerId, []); byCust.get(d.customerId).push(d); });
  const rows = withVal.map(d => `<tr><td>${esc((custById(d.customerId) || {}).name || '（未指定客戶）')}</td><td>${esc(devLabel(d))}<div class="muted">${esc(d.location || '')}</div></td>
      <td class="num">${fmt(d.bwRate || 0)}</td><td class="num">${fmt(d.colorRate || 0)}</td><td class="num">${money(d.monthlyFee || 0)}</td>
      <td>${PLANS.has(d.customerId) ? '<span class="tag t-gray">已有計價設定，略過</span>' : '<span class="tag t-info">待搬移</span>'}</td></tr>`).join('');
  const pending = [...byCust.keys()].filter(cid => !PLANS.has(cid)).length;
  return `<div class="card"><h2>舊費率搬移（一次性）</h2>
    <p class="note">舊版保養系統把黑色單張價、彩色單張價、月租存在設備資料上，工程師的瀏覽器也讀得到。請先「搬移」到計價設定（每台設備各建一個群組），核對後再「清除」設備上的舊費率。</p>
    ${withKeys.length ? `<div class="row-actions" style="margin:8px 0"><span class="tag t-warn">設備上仍有費率欄位：${withKeys.length} 台</span><span class="tag t-info">有填數值：${withVal.length} 台</span></div>` : '<div class="alert ok">設備資料中已沒有舊費率欄位，不需要搬移。</div>'}
    ${rows ? `<table style="min-width:720px"><thead><tr><th>客戶</th><th>設備</th><th class="num">黑色單張價</th><th class="num">彩色單張價</th><th class="num">月租</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
    ${withKeys.length ? `<div class="row-actions">
      <button class="primary" ${pending ? '' : 'disabled'} onclick="migrateRates()">1. 搬移到計價設定（${pending} 位客戶）</button>
      <button class="ghost danger" onclick="stripRates()">2. 清除設備上的舊費率（${withKeys.length} 台）</button></div>` : ''}
    ${migrateLog ? `<div class="alert ok" style="margin-top:10px;white-space:pre-wrap">${esc(migrateLog)}</div>` : ''}
    <p class="note">搬移只建立「尚未設定計價」的客戶；已設定的客戶不會被覆蓋。搬移後的計費週期預設為每月、大尺寸預設獨立單價 0，請到「客戶計價設定」逐一確認。</p></div>`;
}
function migrateRates() {
  const withVal = D.devices.filter(d => hasRateKeys(d) && hasRateValue(d));
  const cids = [...new Set(withVal.map(d => d.customerId))].filter(cid => !PLANS.has(cid) && custById(cid));
  if (!cids.length) return toast('沒有需要搬移的客戶');
  if (!confirmTwice(`為 ${cids.length} 位客戶建立計價設定（每台設備各一組）？`)) return;
  run(async () => {
    const done = [];
    for (const cid of cids) {
      const c = custById(cid), p = defaultPlan(c);
      p.groups = withVal.filter(d => d.customerId === cid).map(d => ({...newGroup(`${devLabel(d)}${d.location ? '（' + d.location + '）' : ''}`.slice(0, 40)),
        devices: [d.id], bwPrice: Number(d.bwRate) || 0, colorPrice: Number(d.colorRate) || 0, rent: Number(d.monthlyFee) || 0}));
      p.note = '由舊費率搬移建立，請確認計費週期與大尺寸計價';
      await call('billing_plan_save', {p_customer_id: cid, p_data: p, p_expected: null});
      done.push(`${c.name}：${p.groups.length} 台`);
    }
    await reloadBilling();
    migrateLog = `已建立 ${done.length} 位客戶的計價設定：\n${done.join('\n')}`;
    toast('搬移完成，請核對後再清除舊費率');
  }).then(render);
}
function stripRates() {
  const withKeys = D.devices.filter(hasRateKeys);
  if (!withKeys.length) return;
  const notMoved = withKeys.filter(d => hasRateValue(d) && !PLANS.has(d.customerId));
  if (notMoved.length && !confirmTwice(`還有 ${notMoved.length} 台有填費率的設備尚未搬移，清除後這些數值會消失。仍要清除？`)) return;
  if (!confirmTwice(`從 ${withKeys.length} 台設備刪除舊費率欄位？刪除後保養系統不再存任何價格。`)) return;
  run(async () => {
    const rows = withKeys.map(d => { const x = {...d}; RATE_KEYS.forEach(k => delete x[k]); return {coll: 'devices', id: d.id, data: x}; });
    const op = {id: uid(), t: new Date().toISOString(), staffId: MYSTAFF.id, staff: MYSTAFF.name || '', action: '清除舊費率欄位', summary: `${withKeys.length} 台設備（計價系統）`};
    for (let i = 0; i < rows.length; i += 200) {
      const {error} = await sb.from('app_records').upsert(rows.slice(i, i + 200), {onConflict: 'coll,id'});
      if (error) throw new Error('清除失敗：' + error.message);
    }
    await sb.from('app_records').upsert([{coll: 'oplog', id: op.id, data: op}], {onConflict: 'coll,id'});
    await loadApp();
    migrateLog = `已從 ${withKeys.length} 台設備刪除舊費率欄位。`;
    toast('已清除設備上的舊費率');
  }).then(render);
}

boot();
</script>
</body>
