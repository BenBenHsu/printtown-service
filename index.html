<title>普印通 設備保養系統 v75</title>
<style>
:root{--yellow:#ca8a04;--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e5e7eb;--brand:#1f5fbf;--warn:#b45309;--danger:#b91c1c;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0 auto 0 0}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.active{background:#fff;color:var(--brand);font-weight:600}
main{padding:20px;max-width:1320px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}
h2{font-size:16px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
input,select,textarea{padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;width:100%;background:#fff}
input[type=number].sm{width:110px}
input[type=checkbox]{width:auto}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.sqrow{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.sqbtn{width:96px;height:96px;aspect-ratio:1/1;padding:8px;white-space:normal;line-height:1.35;display:inline-flex;align-items:center;justify-content:center;text-align:center;flex:0 0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:700}
details.fold{margin:0 0 16px}
details.fold>summary{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:600;color:var(--ink);list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--muted)}
details.fold[open]>summary::before{content:"▾ "}
details.fold>.card:first-of-type{margin-top:12px}
button.primary{background:var(--brand);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.ghost{background:#fff;border:1px solid #cbd5e1;padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
button.ghost:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
button.ghost:disabled{opacity:.45;cursor:default}
button.primary:disabled{opacity:.45;cursor:default}   /* V69：停用的藍色主按鈕也要看得出來是灰的（之前停用時仍是亮藍色，容易誤以為可以按） */
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-danger{background:#fee2e2;color:var(--danger)}
.t-warn{background:#fef3c7;color:var(--warn)}
.t-ok{background:#dcfce7;color:var(--ok)}
.t-info{background:#e0e7ff;color:#3730a3}
.k-print{background:#fef9c3;color:#854d0e}
.k-other{background:#ffedd5;color:#9a3412}
.t-gray{background:#f3f4f6;color:#374151}
.muted{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.empty{color:var(--muted);padding:12px 0}
.alert-box{border-left:4px solid var(--yellow);background:#fefce8;padding:10px 14px;border-radius:6px;margin:0 0 12px;font-size:14px}
.neg{color:var(--danger)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:0;cursor:pointer}
.switch input{width:18px;height:18px}
.taBox{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;max-width:90vw;z-index:9}

.plan-table{min-width:0;width:100%;font-size:13px;border-collapse:collapse}
.plan-table th,.plan-table td{padding:6px;border:1px solid #cbd5e1;vertical-align:top}
.plan-table .ck{text-align:center;font-size:16px;width:44px}
.ck-btn{background:none;border:1px solid #cbd5e1;border-radius:6px;font-size:18px;line-height:1.2;padding:2px 6px;cursor:pointer;color:inherit}
.ck-btn:disabled{cursor:default;opacity:.6}
.plan-table .blank{width:90px}
.print-only{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  .noprint{display:none !important}
  .print-only{display:block}
  .plan-table th,.plan-table td{font-size:11px;padding:4px}
  .plan-table .blank{height:26px}
  .plan-table tr{page-break-inside:avoid}
  .ck-btn{border:none;padding:0;opacity:1}
}
/* v26 色彩分層：客戶（白）／設備（藍）／服務（綠）／耗材（琥珀）／提醒（紅）／分析（紫）／設定（灰） */
.card.sec-cust{background:#ffffff;border-left:6px solid #1f5fbf}
.card.sec-dev{background:#f3f8ff;border-left:6px solid #3b82f6}
.card.sec-svc{background:#f2fbf5;border-left:6px solid #16a34a}
.card.sec-cons{background:#fffbeb;border-left:6px solid #d97706}
.card.sec-remind{background:#fff5f5;border-left:6px solid #dc2626}
.card.sec-report{background:#f7f5ff;border-left:6px solid #7c3aed}
.card.sec-set{background:#f4f4f5;border-left:6px solid #6b7280}
.dev-zone{background:#eaf2ff;border:1px solid #c9dcf7;border-radius:8px;padding:8px;margin-top:10px}
.dev-zone table{background:transparent}
.add-dev{width:100%;margin-top:8px;border-style:dashed;color:#1f5fbf}
.login-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.ptag{display:inline-block;color:#fff;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:999px;margin:2px 3px 2px 0;font-weight:600;white-space:nowrap}
.tgck{display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;cursor:pointer}
.tagck-row{display:flex;flex-wrap:wrap;gap:2px 4px;margin-top:4px}
.ptag-btn{color:#fff;border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.ptag-btn.off{opacity:.45}
.ghost.danger{color:#b91c1c;border-color:#fca5a5}
/* V75：表單下方的按鈕列（儲存、取消、刪除）；刪除鈕離「取消」約 4 公分，避免誤按；按鈕文字一律橫排 */
.form-acts{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;row-gap:14px}
.form-acts button,button.del-far{white-space:nowrap;writing-mode:horizontal-tb;flex:0 0 auto}
button.del-far{margin-left:4cm}
@media (max-width:560px){button.del-far{margin-left:16px}}
.next-note{margin-top:4px;padding:3px 8px;background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;font-size:13px;white-space:pre-wrap}
.tag-bar{border:1.5px dashed #94a3b8;border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card,#fff)}
.tag-bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag-bar-title{font-weight:700}
.tag-edit-btn{border:1px solid #1e5fbf;color:#1e5fbf;background:#fff;border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer;font-size:14px}
.tag-edit-btn:hover{background:#eff6ff}
.tag-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.tag-editor{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:8px}
details.tag-editor>summary{cursor:pointer;font-weight:600}
.tagset-row{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #e2e8f0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;display:inline-block;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw span{display:block;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1px #94a3b8;border:2px solid #fff}
.sw input:checked + span{box-shadow:0 0 0 3px #1e293b}
.sw input:focus-visible + span{outline:2px solid #2563eb;outline-offset:2px}
@media (max-width:640px){.tagset-row{grid-template-columns:1fr}}
.kind-sel{width:auto;max-width:180px;padding:4px 6px;font-size:13px;border-radius:6px}
.kind-sel.ks-print{background:#fef9c3}.kind-sel.ks-other{background:#ffedd5}
@media (max-width:640px){
  .dev-tbl{min-width:0 !important}
  .dev-tbl thead{display:none}
  .dev-tbl,.dev-tbl tbody,.dev-tbl tr,.dev-tbl td{display:block;width:100%;box-sizing:border-box}
  .dev-tbl tr{border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;padding:6px 10px;background:#fff}
  .dev-tbl td{border:none !important;padding:4px 0;white-space:normal !important;text-align:left}
  .dev-tbl td.num::before{content:'提醒 ';color:#64748b}
  .dev-tbl .kind-sel{max-width:100%}
}
.stock-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.stock-chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px;color:#334155}
.stock-chip.on{background:var(--brand,#1e5fbf);border-color:var(--brand,#1e5fbf);color:#fff}
.cust-link{color:inherit;text-decoration:none;cursor:pointer}
.cust-link:hover b{text-decoration:underline}
.act-bar{margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.act-l,.act-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seq-btn{font-weight:600}
.cons-act{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rem-btn{border:none;cursor:pointer;font:inherit;font-size:13px}
.rem-row>td{background:#fffbeb;padding:8px 12px !important;border-bottom:1px solid #fde68a}
.rem-item{margin:8px 0;padding-bottom:8px;border-bottom:1px dashed #e5e7eb}
.rem-item:last-of-type{border-bottom:none}
.rem-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.rem-form{margin-top:10px;padding:10px;border:2px solid var(--brand,#1e5fbf);border-radius:10px;background:#fff}
.mg-dev{display:grid;grid-template-columns:minmax(0,1fr) 160px 160px;gap:8px;align-items:end;padding:6px 0;border-top:1px dashed #e2e8f0}
@media (max-width:640px){.mg-dev{grid-template-columns:1fr}}
.due-tbl{width:100%;border-collapse:collapse;min-width:0 !important}
.due-tbl th{text-align:left;font-size:13px;color:#475569;padding:8px 10px;border-bottom:2px solid #cbd5e1;white-space:nowrap}
.due-tbl th.c-num,.due-tbl td.c-num{text-align:center;white-space:nowrap}
.due-tbl tr.due-sum{cursor:pointer;border-bottom:1px solid #e2e8f0}
.due-tbl tr.due-sum:hover{background:#f8fafc}
.due-tbl tr.due-sum td{padding:9px 10px;vertical-align:top}
.due-tbl tr.due-sum.due-alldone{opacity:.62}
.due-btn{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;font-weight:700}
.due-btn:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.dn{font-weight:700}.dn-rem{color:#6d28d9}.dn-od{color:#b91c1c}.dn-un{color:#c2410c}.dn-ok{color:#15803d}.dn-zero{color:#94a3b8;font-weight:400}
.due-det>td{background:#f8fafc;padding:8px 12px;border-bottom:1px solid #e2e8f0}
.due-unit{margin:0 0 14px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
.due-unit-h{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;margin:0 0 6px;font-size:14px}
.due-rem{font-size:12px;color:#475569;margin-top:3px;max-width:260px}
.due-sumline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:6px 0 8px;font-size:14px}
@media (max-width:640px){
  .due-tbl thead{display:none}
  .due-tbl,.due-tbl tbody{display:block}
  .due-tbl tr.due-sum{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:14px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0 0;padding:8px 10px;background:#fff}
  .due-tbl tr.due-sum td{padding:0;border:none;text-align:left}
  .due-tbl td.c-name{flex:1 0 100%}
  .due-tbl td.c-num::before{content:attr(data-label) ' ';color:#64748b;font-weight:400}
  .due-tbl td.c-asg{flex:1 0 100%}
  .due-tbl td.c-asg::before{content:'擔當：';color:#64748b}
  .due-tbl tr.due-det{display:block;margin:0 0 8px}
  .due-tbl tr.due-det[hidden]{display:none}
  .due-tbl tr.due-det>td{display:block}
}
.cons-act button{padding:3px 8px;font-size:12px}
/* V66：設備 QR（落地頁、標籤列印） */
.qr-land{border:2px solid #1f5fbf;background:#f3f8ff;padding:14px 14px 12px}
.qr-land h2{margin:4px 0 4px;font-size:22px;line-height:1.3}
.qr-land .qr-sub{font-size:16px;margin:2px 0}
.qr-chip{display:inline-block;background:#dbeafe;color:#1e3a8a;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
.qr-big{display:block;width:100%;font-size:20px;font-weight:700;padding:16px 18px;margin-top:12px;border-radius:12px}
.qr-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qr-row button{flex:1 1 150px}
.qr-ok{border-left-color:#16a34a;background:#ecfdf5}

.qr-item{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-bottom:1px solid #eef2f7;cursor:pointer;margin:0}
.qr-item:last-child{border-bottom:0}
.qr-item span{min-width:0}
.qr-prev{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;overflow-x:auto}
.qr-label{position:relative;box-sizing:border-box;flex:none;background:#fff;color:#000;border:1px solid #94a3b8;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.qr-label .qr-tx{position:absolute;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.qr-label.h .qr-tx{text-align:left}
.qr-label.v .qr-tx{text-align:center}
.qr-label svg{display:block}
.qr-label.qr-tape img{display:block;image-rendering:crisp-edges;image-rendering:pixelated}
.qr-prevtape{align-items:flex-start}
.qr-prevtape .qr-label{max-width:100%}
.qr-prevtape .qr-label img{max-width:100%;height:auto}
.qr-help{border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;padding:6px 12px;margin:8px 0}

#qrPrintArea{display:none}

  body.qr-printing header,body.qr-printing main,body.qr-printing #toast{display:none !important}

  body.qr-printing #qrPrintArea{display:block !important;position:static}
  body.qr-printing #qrPrintArea,body.qr-printing #qrPrintArea *{visibility:visible}
  body.qr-printing .qr-label{border:0;margin:0;break-after:page;page-break-after:always;break-inside:avoid}
  body.qr-printing .qr-label:last-child{break-after:auto;page-break-after:auto}
  body.qr-printing.qr-sheet #qrPrintArea{display:flex !important;flex-wrap:wrap;gap:2mm;align-content:flex-start}
  body.qr-printing.qr-sheet .qr-label{break-after:auto;page-break-after:auto;outline:.2mm dashed #94a3b8}
}

<body>
<header>
  <h1>普印通 設備保養系統 <span style="font-weight:400;font-size:13px;opacity:.85">v75</span></h1>
  <nav id="nav" style="display:none">
    <button data-v="dash" class="active" onclick="go('dash')">儀表板</button>
    <button data-v="plan" onclick="go('plan')">保養客戶一覽</button>
    <button data-v="manage" onclick="go('manage')">設備資料總覽</button>
    <button data-v="me" onclick="go('me')">我的帳號</button>
    <button id="navOps" data-v="ops" onclick="go('ops')" style="display:none">操作分析</button>
    <button id="navSettings" data-v="settings" onclick="go('settings')" style="display:none">設定</button>
    <span id="ptSys"></span><!-- V66 起：系統按鈕（計張計價、庫存）由共用的 menu.js 產生 -->
  </nav>
  <div id="roleBox" style="display:none;gap:6px;align-items:center;margin-left:8px"><span id="cloudSt" style="font-size:12px;opacity:.85;margin-right:4px"></span><span id="roleLabel" style="font-size:13px;opacity:.95"></span><button onclick="logout()" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer">登出</button></div>
</header>

<script>
/* ================= 常數 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const DAY = 864e5, MONTH = 30.4;
const WIN = 183, M = WIN / MONTH;          // 近六個月視窗
const WARN_CONS = 60, URGENT_DAYS = 21;   // 備料提醒：60 天內需備料；立即提醒：21 天內可能用完
const WARN_SVC = 14, WARN_ABN_DAYS = 180;
const EARLY_RATIO = 0.6, REPEAT_DAYS = 60;
const KIND = {copier:'事務設備', printer:'事務設備', purifier:'商用空氣清淨機', ozone:'商用臭氧機', phi:'PHI商用除味機', nex:'NEX除味系統', body:'全身除味機'};
const kindIsPrint = k => !['purifier','phi','ozone','nex','body'].includes(k);   // V47：非列印機型不計張數、無色彩與選用功能
// V62：週期名稱統一為「每月、雙月、一季、4個月、半年、一年」
const CYCLE_OPTS = [{m:1,label:'每月',days:30},{m:2,label:'雙月',days:60},{m:3,label:'一季',days:90},{m:4,label:'4個月',days:120},{m:6,label:'半年',days:180},{m:12,label:'一年',days:365}];
const cycOpt = m => CYCLE_OPTS.find(o => o.m === m) || null;

function logDateError(d) {

// V49：補登過去日期時，與「日期前後相鄰」的紀錄比對；只要張數依日期不倒退即可直接存檔
function readingIssues(dev, date, exceptId, bw, co, lg) {
  const vs = visitsOf(dev.id).filter(x => x.id !== exceptId);
  const prev = f => vs.filter(x => x.date <= date && f(x) != null).pop() || null;
  const next = f => vs.find(x => x.date > date && f(x) != null) || null;
  const out = [];
  const chk = (label, val, f) => {
    if (val == null) return;
    const p = prev(f), n = next(f);
    if (p && val < f(p)) out.push(`${label} ${fmt(val)} 低於 ${p.date} 的 ${fmt(f(p))}`);
    if (n && val > f(n)) out.push(`${label} ${fmt(val)} 高於之後 ${n.date} 的 ${fmt(f(n))}`);
  };
  chk('黑白張數', bw, x => x.bw);
  chk(isLarge(dev) ? '彩色張數（含大尺寸）' : '彩色張數', co, x => colorOf(dev, x));
  if (isLarge(dev)) chk('彩色大尺寸張數', lg, x => x.colorLarge);
  return out;
}

      const ups = [], dels = [];
      cur.forEach((v, k) => { const js = JSON.stringify(v.data); if (synced.get(k) !== js) ups.push({k, v, js}); });
      synced.forEach((js, k) => { if (!cur.has(k) && !k.startsWith('oplog|')) dels.push(k); });
      ups.sort((a, b) => (a.v.coll === 'staff' ? 0 : 1) - (b.v.coll === 'staff' ? 0 : 1));   // 人員先送出
      for (let i = 0; i < ups.length; i += 500) {
        const part = ups.slice(i, i + 500);
        const {error} = await sb.from('app_records').upsert(part.map(u => ({coll: u.v.coll, id: u.v.id, data: u.v.data})), {onConflict: 'coll,id'});
        if (!error) { part.forEach(u => synced.set(u.k, u.js)); continue; }
        if (!isRejection(error)) throw error;          // 網路等暫時性錯誤：稍後自動重送
        // 資料庫拒絕其中某些資料：逐筆送出，被拒絕的放棄重送（避免一筆壞資料卡住所有同步）
        for (const u of part) {

          if (r.error && !isRejection(r.error)) throw r.error;

      dels.forEach(k => { const i = k.indexOf('|'); (byColl[k.slice(0, i)] = byColl[k.slice(0, i)] || []).push(k.slice(i + 1)); });
      const DEL_ORDER = ['customers', 'devices', 'consumables', 'events', 'logs'];
      const delRank = c => { const i = DEL_ORDER.indexOf(c); return i < 0 ? 99 : i; };
      for (const c of Object.keys(byColl).sort((a, b) => delRank(a) - delRank(b))) {

          if (error) throw error;

          const goneIds = new Set((gone || []).map(r => String(r.id)));

            const {data: still, error: e2} = await sb.from('app_records').select(rowsSel).eq('coll', c).in('id', miss);
            if (!e2 && still) still.forEach(r => {
              if (!okRow(r.coll, r.id) || !okData(r.coll, r.data)) return;

            });

      }
    } while (pendingPush);
    if (delRefused) { LOGIDX = null; cacheLocal(); scheduleRender(); toast(`有 ${delRefused} 筆資料的刪除未被雲端資料庫接受，已還原。可能是你的身份沒有刪除這些資料的權限，或資料庫的刪除權限尚未更新（工程部要刪除客戶與設備，需管理者先到 Supabase 執行「V75 更新 SQL」）。`); }
    if (rejected) { setCloudSt(`☁ 已同步（${rejected} 筆被拒絕）`); toast(`有 ${rejected} 筆變更被資料庫拒絕（權限或格式不符），已停止重送，請通知管理者`); }
    else setCloudSt('☁ 已同步');
    savePending();
  } catch (e) {
    console.error(e);
    setCloudSt('☁ 同步失敗，稍後自動重試');
    savePending();
    setTimeout(() => { if (!syncing && cloudReady) cloudPush(); }, 8000);
  } finally { syncing = false; }
}
// 資料庫的拒絕（權限、格式、檢查條件）與網路暫時性錯誤不同：前者不會因重送而成功
const isRejection = e => /^(42501|23514|22[0-9A-Z]{3}|P0001)$/.test(String(e && e.code || '')) || /row-level|violates|check constraint|格式不正確|不正確|最多/.test(String(e && e.message || ''));
async function flushCloud() { for (let i = 0; i < 100 && syncing; i++) await new Promise(r => setTimeout(r, 100)); }

// 分頁讀取（每次最多 1000 筆，Supabase 的單次上限）
async function fetchPaged(build, maxRows = Infinity) {
  const out = [];
  for (let from = 0; out.length < maxRows; from += 1000) {
    const want = Math.min(1000, maxRows - out.length);
    const {data, error} = await build().range(from, from + want - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < want) break;
  }
  return out;
}
const rowsSel = 'coll,id,data,updated_at';
// 一般資料（不含操作紀錄）
const fetchMain = () => fetchPaged(() => sb.from('app_records').select(rowsSel).neq('coll', 'oplog').order('coll').order('id'));
// 最近的操作紀錄
const fetchRecentOplog = () => fetchPaged(() => sb.from('app_records').select(rowsSel).eq('coll', 'oplog').order('updated_at', {ascending: false}).order('id'), OPLOG_LOAD);
// 只取編號（用於完整的刪除對照）
const fetchKeys = () => fetchPaged(() => sb.from('app_records').select('coll,id').neq('coll', 'oplog').order('coll').order('id'));

// 以雲端為準（權限內的全部資料）；無權限者讀不到任何資料
function applyRows(rows) {
  LOGIDX = null;
  ARR_COLLS.forEach(c => { S[c] = []; });
  S.ui = {showRates: false};
  synced = new Map();
  rows.forEach(r => {
    if (!okRow(r.coll, r.id) || !okData(r.coll, r.data)) return;
    synced.set(r.coll + '|' + r.id, JSON.stringify(r.data));
    if (r.coll === 'meta') S.ui = r.data;
    else S[r.coll].push(r.data);
  });
}
function maxCursor(rows, prev) {   // 以時間值比較（避免字串格式不同造成錯誤排序）
  let m = prev || '1970-01-01T00:00:00Z';
  rows.forEach(r => { if (r.updated_at && Date.parse(r.updated_at) > Date.parse(m)) m = r.updated_at; });
  return m;
}
function normalizeState() {
  ARR_COLLS.forEach(c => { S[c] = S[c] || []; });
  S.ui = S.ui || {showRates: false};
  S.staff.forEach(s => { if (s.admin == null) s.admin = false; if (s.pw === undefined) s.pw = null; });
}
function setLocal(coll, id, data) {
  LOGIDX = null;
  if (coll === 'meta') { S.ui = data; return; }
  if (!S[coll]) return;
  const i = S[coll].findIndex(x => idOf(x) === id);
  if (i >= 0) S[coll][i] = data; else S[coll].push(data);
}
function removeLocal(coll, id) { LOGIDX = null; if (S[coll]) S[coll] = S[coll].filter(x => idOf(x) !== id); }

// 其他人的修改即時套用；正在輸入時暫緩重新整理，避免打到一半的內容被清掉
// V51：使用者在表單中輸入但尚未儲存時標記為「填寫中」，背景同步不會重繪而清掉輸入內容
let formDirty = false;
['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  const t = e.target; if (t && t.closest && t.closest('#main form')) formDirty = true;
}, true));
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    if (formDirty) return scheduleRender();
    if (a && a.closest && a.closest('#main') && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return scheduleRender();
    render();
  }, 600);
}
// 本機目前的版本（JSON）；不存在時回傳 null
function localJsOf(coll, id) {
  if (coll === 'meta') return JSON.stringify(S.ui);
  const it = (S[coll] || []).find(x => idOf(x) === id);
  return it ? JSON.stringify(it) : null;
}
// 本機是否有尚未送出的修改（含尚未送出的刪除）
function hasPending(coll, id) {
  const k = coll + '|' + id, lj = localJsOf(coll, id);
  return lj === null ? synced.has(k) : lj !== synced.get(k);
}
// 套用一批遠端資料：本機有未送出的修改者，一律保留本機版本
function applyRemoteRows(rows) {
  LOGIDX = null;
  let changed = false;
  rows.forEach(r => {
    if (!okRow(r.coll, r.id) || !okData(r.coll, r.data)) return;
    const k = r.coll + '|' + r.id, js = JSON.stringify(r.data);
    if (synced.get(k) === js) return;
    if (hasPending(r.coll, String(r.id))) return;
    synced.set(k, js); setLocal(r.coll, String(r.id), r.data); changed = true;
  });
  return changed;
}
// 定時同步：先只抓「有更新的資料」（增量）；每 10 次再做一次完整的刪除對照
async function refreshFromCloud() {
  if (!cloudReady || !sb || syncing) return;
  let changed = false;
  try {
    pollCount++;
    const since = cursor ? new Date(Date.parse(cursor) - 5000).toISOString() : '1970-01-01T00:00:00Z';
    const changedRows = await fetchPaged(() => sb.from('app_records').select(rowsSel).neq('coll', 'oplog').gte('updated_at', since).order('updated_at').order('coll').order('id'));
    if (applyRemoteRows(changedRows)) changed = true;
    cursor = maxCursor(changedRows, cursor);
    if (pollCount % FULL_CHECK_EVERY === 0) {
      // 先記下查詢前的同步狀態；查詢期間若有新的送出，該筆不會被誤判為「已刪除」
      const before = new Map(synced);
      const keys = new Set((await fetchKeys()).map(r => r.coll + '|' + r.id));
      before.forEach((js, k) => {
        if (k.startsWith('oplog|') || keys.has(k)) return;
        if (synced.get(k) !== js) return;          // 查詢期間已有變動：略過，下次再對照
        const i = k.indexOf('|'), coll = k.slice(0, i), id = k.slice(i + 1);
        if (hasPending(coll, id)) return;
        synced.delete(k); removeLocal(coll, id); changed = true;
      });
    }
  } catch (e) { return; }
  if (changed) { cacheLocal(); scheduleRender(); }
  if (isAdmin()) loadAccessReqs();
}
function startRealtime() {
  sb.channel('app-records-sync').on('postgres_changes', {event: '*', schema: 'public', table: 'app_records'}, p => {
    // 規則：本機若有尚未送出的修改，一律以本機為準，遠端的舊回音不會覆蓋它
    if (p.eventType === 'DELETE') {
      const coll = p.old.coll, id = String(p.old.id), k = coll + '|' + id;
      if (!okRow(coll, id) || coll === 'oplog' || hasPending(coll, id)) return;
      if (!synced.has(k)) return;
      synced.delete(k); removeLocal(coll, id);
    } else {
      const r = p.new, id = String(r.id), k = r.coll + '|' + id, js = JSON.stringify(r.data);
      if (!okRow(r.coll, id)) return;
      if (synced.get(k) === js) return;
      if (hasPending(r.coll, id)) return;
      synced.set(k, js); setLocal(r.coll, id, r.data);
    }
    cacheLocal(); scheduleRender();
  }).subscribe();
}

// 依檔頭位元組判斷是否為 JPEG／PNG／WEBP／HEIC（不信任檔名與瀏覽器回報的類型）
async function isImageBytes(file) {
  let h;
  try { h = new Uint8Array(await file.slice(0, 16).arrayBuffer()); } catch (e) { return false; }
  const ascii = (from, to) => String.fromCharCode(...h.slice(from, to));
  if (h[0] === 0xFF && h[1] === 0xD8 && h[2] === 0xFF) return true;                                   // JPEG
  if (h[0] === 0x89 && ascii(1, 4) === 'PNG' && h[4] === 0x0D && h[5] === 0x0A && h[6] === 0x1A && h[7] === 0x0A) return true;  // PNG
  if (ascii(0, 4) === 'RIFF' && ascii(8, 12) === 'WEBP') return true;                                // WEBP
  if (ascii(4, 8) === 'ftyp' && /^(heic|heix|hevc|hevx|heim|heis|mif1|msf1)$/.test(ascii(8, 12))) return true;  // HEIC／HEIF
  return false;
}

function drawPhotoBlob(im, maxEdge, q, stamp) {
  const long = Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height) || 1;
  const r = Math.min(1, maxEdge / long);
  const w = Math.max(1, Math.round((im.naturalWidth || im.width) * r)), h = Math.max(1, Math.round((im.naturalHeight || im.height) * r));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  if (!cx) return Promise.resolve(null);
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
  cx.drawImage(im, 0, 0, w, h);
  if (stamp) {
    const fs = Math.max(12, Math.round(h * 0.035));
    cx.font = `bold ${fs}px system-ui,"Microsoft JhengHei",sans-serif`;
    cx.textAlign = 'right'; cx.textBaseline = 'bottom';
    cx.lineWidth = Math.max(2, Math.round(fs / 5)); cx.strokeStyle = 'rgba(0,0,0,.85)'; cx.fillStyle = '#fff';

/* ================= 張數計算 ================= */
function readingsOf(devId) {
  const dv = S.devices.find(x => x.id === devId);
  return visitsOf(devId).filter(l => l.bw != null)
    .map(l => ({dt: toDate(l.date), date: l.date, bw: l.bw, color: colorOf(dv, l)}))
    .sort((a, b) => a.dt - b.dt);
}
function basisOf(r, key) {
  if (!r) return null;
  if (key === 'bw') return r.bw ?? null;
  if (key === 'color') return r.color ?? null;
  if (key === 'total') return r.total != null ? r.total : (r.bw == null ? null : r.bw + (r.color || 0));
  return null;
}
function lastReading(devId) {
  const rs = readingsOf(devId);
  return rs.length ? rs[rs.length - 1] : null;
}
// 近六個月月均張數：首尾讀數差 ÷ 月數；視窗前最後一筆作為起點
function avgOf(devId, key, at) {
  const t = at || today(), start = new Date(t.getTime() - WIN * DAY);
  const pts = readingsOf(devId).map(r => ({dt: r.dt, v: basisOf(r, key)})).filter(p => p.v != null && p.dt <= t);
  const inWin = pts.filter(p => p.dt >= start);
  const before = pts.filter(p => p.dt < start).pop();
  const seq = before ? [before, ...inWin] : inWin;
  if (seq.length < 2) return {avg:null, msg:'張數讀數不足（近六個月內需至少兩筆）'};
  const first = seq[0], last = seq[seq.length - 1];
  const pages = last.v - first.v;
  if (pages < 0) return {avg:null, msg:'張數倒退，請確認是否換機或歸零'};
  const months = (last.dt - first.dt) / DAY / MONTH;
  if (months <= 0) return {avg:null, msg:'讀數日期相同，無法計算'};
  return {avg: pages / months, msg: `${iso(first.dt)} ～ ${iso(last.dt)}，${seq.length} 筆`};
}
function currentEstimate(devId) {
  const lr = lastReading(devId);
  if (!lr) return null;
  const ms = Math.max(0, (today() - lr.dt) / DAY / MONTH);
  const aBw = avgOf(devId, 'bw').avg ?? 0, aCo = avgOf(devId, 'color').avg ?? 0;
  return {bw: lr.bw + aBw * ms, color: (lr.color ?? 0) + aCo * ms};
}

/* ================= 耗材推估（v39） ================= */
// 有效壽命：列印機為原廠張數 × 實際使用比率；清淨機為原廠天數
const effLife = c => c.basis === 'days' ? c.ratedLife : c.ratedLife * (c.coverage ?? 100) / 100;
const unitOf = c => c.basis === 'days' ? '天' : '張';
const TONER = ['黑色碳粉', '藍色碳粉', '紅色碳粉', '黃色碳粉'];
const isToner = c => TONER.includes(c.category);
// 計量依據：碳粉依顏色自動決定（黑色碳粉看黑白張數，彩色碳粉看彩色張數）；其他耗材沿用設定
const effBasis = c => c.basis === 'days' ? 'days' : isToner(c) ? (c.category === '黑色碳粉' ? 'bw' : 'color') : c.basis;
// 合併計算：同一客戶、同一機種的碳粉可合併張數與庫存；感光滾筒、廢粉回收盒、其他一律逐機計算
const isMerged = dev => { const cu = custOf(dev); return !!(dev && isPrint(dev) && cu && cu.merge && cu.merge[dev.model]); };
const SRC_TAG = {actual: '<span class="tag t-ok">實際抄表</span>', mixed: '<span class="tag t-info">抄表＋估計</span>',
  est: '<span class="tag t-warn">本月無抄表・以平均估計</span>', err: '<span class="tag t-danger">張數倒退</span>'};
let dashMonth = null, rngFrom = null, rngTo = null;   // 儀表板的月份；自訂期間起迄（YYYY-MM，重繪時保持）
// 每月用量（張或天）
function monthlyUsage(c) {
  const dev = S.devices.find(x => x.id === c.deviceId);
  if (!dev) return null;
  const b = effBasis(c);
  if (b === 'days') return MONTH;
  return avgOf(dev.id, b).avg;
}
// 依過去更換紀錄算出實際使用比率（實際用量 ÷ 原廠壽命）
function observedRatio(c) {
  if (effBasis(c) === 'days') return null;
  const evs = S.events.filter(e => e.consId === c.id && e.rated && e.consumed != null);
  if (!evs.length) return null;
  return {n: evs.length, r: evs.reduce((a, e) => a + e.consumed / e.rated, 0) / evs.length};
}

/*
 單台推估（v39）
 1. 未填寫庫存 → 略過，提醒「尚未填寫耗材庫存」
 2. 目前估計張數 = 最後一次抄表 + 近六個月月均 × 距今月數（依耗材計量依據）
 3. 本支已用 = 目前估計 − 更換時張數；本支剩餘 = 有效壽命 − 本支已用
 4. 日均用量 = 月均 ÷ 30.4；本支可用天數 = 本支剩餘 ÷ 日均
 5. 庫存可撐天數 = (本支剩餘 + 庫存件數 × 有效壽命) ÷ 日均
*/
function consStatus(c, stockOv, dm) {
  const dev = dm ? dm.get(c.deviceId) : S.devices.find(x => x.id === c.deviceId);
  if (!dev || !isPrint(dev)) return null;   // V63：除味設備的耗材不推估
  const t = today(), b = effBasis(c);
  const L = effLife(c), u = unitOf(c), lead = c.leadDays ?? 7;
  const stock = stockOv !== undefined ? stockOv : (c.stock == null ? null : c.stock);
  const base = {c, dev, cat: c.category, L, u, stock, lead, basis: b, basisLabel: BASIS_LABEL[b], toner: isToner(c), ok: false, reason: ''};
  if (stock == null) return {...base, reason: '尚未填寫耗材庫存'};
  let used, daily, est = null, avg = null;
  if (b === 'days') {
    used = daysBetween(toDate(c.installDate), t);
    daily = 1;
  } else {
    const v = avgOf(dev.id, b), lr = lastReading(dev.id);
    const instVal = basisOf({bw: c.installBw, color: c.installColor, total: c.installTotal}, b);
    if (!lr) return {...base, reason: '缺少張數讀數'};
    if (instVal == null) return {...base, reason: '未填更換時張數'};
    if (v.avg == null) return {...base, reason: v.msg};
    if (v.avg <= 0) return {...base, reason: '近六個月月均張數為零，無法推估'};
    const ms = Math.max(0, (t - lr.dt) / DAY / MONTH);
    est = basisOf(lr, b) + v.avg * ms;
    avg = v.avg;
    used = est - instVal;
    daily = v.avg / MONTH;
  }
  const remaining = L - used;
  const daysLeft = remaining / daily;
  return {...base, ok: true, est, avg, used, remaining, daily, monthly: daily * MONTH, daysLeft,
          cycle: L / daily, dueDate: addDays(t, daysLeft)};
}
// 同一合併群組的碳粉耗材（庫存共用）；非合併者僅回傳本身
function mergeMates(c) {
  const dev = S.devices.find(x => x.id === c.deviceId);
  if (!dev || !isToner(c) || !isMerged(dev)) return [c];
  const key = `M|${dev.customerId}|${dev.model}|${c.catalogId}`;
  return S.consumables.filter(x => {
    const d = S.devices.find(y => y.id === x.deviceId);
    return d && isToner(x) && isMerged(d) && `M|${d.customerId}|${d.model}|${x.catalogId}` === key;
  });
}
const sharedStock = c => { const m = mergeMates(c).find(x => x.stock != null); return m ? m.stock : null; };
const setSharedStock = (c, v) => mergeMates(c).forEach(x => { x.stock = v; });
// 群組推估：單機為一組；合併（同客戶同機種的碳粉）則庫存共用（只看總量，任一台登打即同步），張數與用量加總
function consGroupStatus(list, dm) {
  const shared = list.length > 1 && isToner(list[0]);
  const stockOv = shared ? (list.find(c => c.stock != null)?.stock ?? null) : undefined;
  const sts = list.map(c => consStatus(c, stockOv, dm)).filter(Boolean);
  if (!sts.length) return null;
  const first = sts[0], merged = sts.length > 1;
  const head = {members: sts, merged, c: first.c, name: first.c.name, cat: first.cat, toner: first.toner, u: first.u,
    basisLabel: first.basisLabel, dev: first.dev, lead: Math.min(...sts.map(s => s.lead)),
    missing: shared ? stockOv == null : sts.some(s => s.stock == null)};
  if (shared && stockOv == null) return {...head, ok: false, reason: '尚未填寫耗材庫存'};
  const bad = sts.filter(s => !s.ok);
  if (bad.length) return {...head, ok: false, reason: merged ? `${bad.length} 台：${bad[0].reason}` : bad[0].reason};
  const t = today(), lead = head.lead;
  const D = sts.reduce((a, s) => a + s.daily, 0);                    // 合計日均用量
  const remaining = sts.reduce((a, s) => a + s.remaining, 0);         // 合計本支剩餘
  const stock = sts[0].stock;                                         // 群組庫存（共用，單機即本機庫存）
  const Lbar = sts.reduce((a, s) => a + s.L, 0) / sts.length;
  const supply = remaining + stock * Lbar;                            // 本支剩餘 ＋ 庫存件數 × 有效壽命
  const daysLeft = Math.min(...sts.map(s => s.daysLeft));             // 最先需要更換的那一台
  const coverDays = supply / D;                                       // 庫存可撐天數
  const exhaust = addDays(t, coverDays);
  const orderDate = addDays(exhaust, -lead);
  const orderIn = Math.round(coverDays - lead);
  const buy = Math.max(0, Math.ceil(Math.max(0, WARN_CONS * D - supply) / Lbar));   // 60 天內還缺幾件
  const tier = coverDays < 0 ? 'out' : coverDays <= URGENT_DAYS ? 'urgent' : coverDays <= WARN_CONS ? 'prep' : null;
  return {...head, ok: true, D, daily: D, monthly: D * MONTH, remaining, stock, supply, L: Lbar, daysLeft,
          dueDate: addDays(t, daysLeft), coverDays, exhaust, orderDate, orderIn, buy, tier,
          remind: tier !== null, overdue: daysLeft < 0};
}
function consGroups() {
  const map = new Map(), dm = new Map(S.devices.map(d => [d.id, d]));   // V65：先建設備索引，避免每項耗材都掃一遍全部設備
  S.consumables.forEach(c => {
    const dev = dm.get(c.deviceId);
    if (!dev || !isPrint(dev)) return;
    const key = isToner(c) && isMerged(dev) ? `M|${dev.customerId}|${dev.model}|${c.catalogId}` : `S|${c.id}`;
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);

  return [...map.values()].map(l => consGroupStatus(l, dm)).filter(Boolean);
}
// 預期週期（天）：有效壽命 ÷ 近六個月日均用量；不需要庫存資料
function expectedCycle(c) {
  const dev = S.devices.find(x => x.id === c.deviceId); if (!dev) return null;
  const L = effLife(c), b = effBasis(c);
  if (b === 'days') return L;
  const v = avgOf(dev.id, b).avg;
  return v && v > 0 ? L / (v / MONTH) : null;
}
// 逐機使用週期（僅碳粉以外）：相鄰兩次更換的間隔，與預期週期比較
function cycleSignal(c) {
  if (isToner(c)) return null;
  const evs = S.events.filter(e => e.consId === c.id).sort((a, b) => a.date.localeCompare(b.date));
  if (evs.length < 2) return {n: evs.length, last: null, avg: null, expect: null, abnormal: false};
  const lastDate = evs[evs.length - 1].date;
  const gaps = evs.slice(1).map((e, i) => daysBetween(toDate(evs[i].date), toDate(e.date)));
  const last = gaps[gaps.length - 1], avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;

}
// 提醒標籤：21 天內可能用完（立即）／60 天內需備料（備料）／未填寫庫存（略過）
const tierTag = g => !g.ok ? (g.missing ? '<span class="tag t-info">尚未填寫庫存</span>' : '<span class="muted">尚無法推估</span>')

  : '<span class="tag t-ok">充足</span>';

/* ================= 歷月印量（抄表差）與期間統計 ================= */
// 計數器在某日的值：讀數之間以直線內插；超過最後一筆以月均速率推估；距離讀數 3 天內視為實際抄表
function valueAt(rs, t, key, rate) {
  const pts = rs.map(r => ({dt: r.dt, v: basisOf(r, key)})).filter(p => p.v != null);
  if (!pts.length || t < pts[0].dt) return null;
  const near = p => Math.abs(t - p.dt) / DAY <= 3;
  const last = pts[pts.length - 1];
  if (t >= last.dt) return {v: last.v + (rate || 0) * (t - last.dt) / DAY / MONTH, exact: near(last)};
  let i = 0;
  while (i < pts.length - 2 && pts[i + 1].dt <= t) i++;
  const a = pts[i], b = pts[i + 1];
  if (near(a)) return {v: a.v, exact: true};
  if (near(b)) return {v: b.v, exact: true};
  return {v: a.v + (b.v - a.v) * (t - a.dt) / (b.dt - a.dt), exact: false};
}
// 某月印量：月底計數值 − 上月底計數值；該月無抄表則整月以之前的近六個月月均估計（不跨月攤提）
function monthVol(dev, y, m) {
  const ms = new Date(y, m, 1), me = new Date(y, m + 1, 0), t = today();
  const out = {y, m, bw: null, color: null, src: null};
  if (ms > t) return out;
  const rs = readingsOf(dev.id);
  const aBw = avgOf(dev.id, 'bw', ms).avg;
  const aCo = dev.hasColor ? avgOf(dev.id, 'color', ms).avg : null;
  const estOut = () => {
    if (aBw == null) return out;
    const days = (me - ms) / DAY + 1;
    return {...out, bw: aBw * days / MONTH, color: dev.hasColor && aCo != null ? aCo * days / MONTH : null, src: 'est'};
  };
  if (!rs.some(r => r.dt >= ms && r.dt <= me)) return estOut();
  const endRef = me, prevEnd = new Date(y, m, 0);   // 整月：當月未過完的部分以月均推算
  const calc = key => {
    const rate = me > t ? (key === 'bw' ? avgOf(dev.id, 'bw').avg : (dev.hasColor ? avgOf(dev.id, 'color').avg : null)) : (key === 'bw' ? aBw : aCo);
    const s = valueAt(rs, prevEnd, key, rate), e = valueAt(rs, endRef, key, rate);
    return s && e ? {d: e.v - s.v, exact: s.exact && e.exact} : null;
  };
  const bw = calc('bw');
  if (!bw) return estOut();
  if (bw.d < 0) return {...out, src: 'err'};
  const co = dev.hasColor ? calc('color') : null;
  const exact = me <= t && bw.exact && (!dev.hasColor || !co || co.exact);
  return {y, m, bw: bw.d, color: co ? co.d : null, src: exact ? 'actual' : 'mixed'};
}
const printDevs = () => S.devices.filter(d => isPrint(d) && devVisible(d)).sort((a, b) => custName(a).localeCompare(custName(b), 'zh-TW') || String(a.location || '').localeCompare(String(b.location || ''), 'zh-TW'));
const dashMonthOf = () => { const t = today(); return dashMonth || new Date(t.getFullYear(), t.getMonth(), 1); };
function setDashMonth(off) { const c = dashMonthOf(); dashMonth = new Date(c.getFullYear(), c.getMonth() + off, 1); render(); }

/* ================= 重置推估、庫存登打、合併設定 ================= */
// 目前本支已用量（不依賴庫存，供重置時顯示推估值）
function usageNow(c) {
  const dev = S.devices.find(x => x.id === c.deviceId); if (!dev) return null;
  const b = effBasis(c), L = effLife(c);
  if (b === 'days') return {used: daysBetween(toDate(c.installDate), today()), L};
  const lr = lastReading(dev.id), v = avgOf(dev.id, b).avg;
  const instVal = basisOf({bw: c.installBw, color: c.installColor, total: c.installTotal}, b);
  if (!lr || instVal == null) return null;
  const ms = Math.max(0, (today() - lr.dt) / DAY / MONTH);

// 重置推估：依實際盤點校正庫存與本支已用比例（推估與實際有落差時使用）
function resetCons(id) {
  const c = S.consumables.find(x => x.id === id); if (!c) return;
  const dev = S.devices.find(x => x.id === c.deviceId); if (!dev) return;
  const L = effLife(c), b = effBasis(c);
  const u0 = usageNow(c);
  const stockIn = prompt('實際盤點庫存（件）；留空表示尚未盤點', c.stock == null ? '' : String(c.stock));
  if (stockIn === null) return;
  const sv = stockIn.trim();
  if (sv !== '' && !(+sv >= 0)) return toast('庫存數量格式不正確');
  const curPct = u0 ? Math.round(u0.used / L * 100) : 0;
  const pIn = prompt(`本支目前已用比例（%），依實際狀況填寫（推估值 ${curPct}%）`, String(curPct));
  if (pIn === null) return;
  const pct = +pIn;
  if (!(pct >= 0 && pct <= 150)) return toast('已用比例請填 0 至 150');
  if (b === 'days') {
    c.installDate = iso(addDays(today(), -Math.round(L * pct / 100)));
  } else {
    const lr = lastReading(dev.id), v = avgOf(dev.id, b).avg;
    if (!lr || v == null) return toast('尚無足夠讀數，無法重置推估');
    const ms = Math.max(0, (today() - lr.dt) / DAY / MONTH);
    const est = basisOf(lr, b) + v * ms;
    const inst = Math.round(est - L * pct / 100);
    if (b === 'bw') c.installBw = inst; else if (b === 'color') c.installColor = inst; else c.installTotal = inst;
    c.installDate = iso(today());
  }
  if (sv !== '') setSharedStock(c, Math.floor(+sv));
  c.resetAt = iso(today());
  logOp('重置耗材推估', `${c.name}（${custName(dev)}｜${dev.model}）：庫存 ${c.stock == null ? '未填' : c.stock}，本支已用 ${pct}%`);
  save(); toast('已重置推估'); render();
}
// 實際庫存直接登打（留空＝尚未填寫）
function setStock(e, id) {
  e.preventDefault();
  const c = S.consumables.find(x => x.id === id); if (!c) return toast('找不到此耗材');
  const raw = new FormData(e.target).get('stock');
  const v = raw == null ? '' : String(raw).trim();
  if (v !== '' && !(Number.isFinite(+v) && +v >= 0)) return toast('庫存數量格式不正確');
  const before = c.stock;
  setSharedStock(c, v === '' ? null : Math.floor(+v));
  logOp('登打庫存', `${c.name}：${before == null ? '未填' : before} → ${c.stock == null ? '未填' : c.stock}`);
  save(); toast(c.stock == null ? '已清除庫存（尚未填寫）' : '已更新庫存'); render();
}
// 同客戶同機種的合併設定（碳粉）
function setMergeEl(el) {
  const c = S.customers.find(x => x.id === el.dataset.cid); if (!c) return;
  c.merge = {...(c.merge || {})};
  if (el.checked) c.merge[el.dataset.model] = true; else delete c.merge[el.dataset.model];
  if (el.checked) {   // 開始合併時，同機種碳粉以第一個有填的庫存為共用值
    const cons = S.consumables.filter(x => { const d = S.devices.find(y => y.id === x.deviceId); return d && d.customerId === c.id && d.model === el.dataset.model && isToner(x); });
    const sv = cons.map(x => x.stock).find(v => v != null);
    if (sv != null) cons.forEach(x => { x.stock = sv; });
  }
  logOp('設定耗材合併', `${c.name}｜${el.dataset.model}：${el.checked ? '合併計算' : '分開計算'}`);
  save(); toast(el.checked ? '已設為合併計算碳粉' : '已改為分開計算'); render();
}
function mergeToggleHtml(c) {
  if (!c) return '';
  const cnt = {};
  devsOf(c.id).filter(isPrint).forEach(d => { cnt[d.model] = (cnt[d.model] || 0) + 1; });
  const models = Object.keys(cnt).filter(m => cnt[m] >= 2);
  if (!models.length) return '';
  return `<div class="card" style="margin:8px 0;background:#f8fafc"><b>耗材合併計算（同客戶、同機種）</b>
    <p class="note" style="margin:4px 0 8px">勾選後，該機種的碳粉會合併計算張數與庫存，並以總用量預估補貨時機。感光滾筒、廢粉回收盒、其他仍逐機計算。</p>
    ${models.map(m => `<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-cid="${esc(c.id)}" data-model="${esc(m)}" onchange="setMergeEl(this)" ${c.merge && c.merge[m] ? 'checked' : ''}> ${esc(m)}（${cnt[m]} 台）合併計算碳粉</label>`).join('')}</div>`;
}

function svcStatus(dev) {
  const logs = S.logs.filter(l => l.deviceId === dev.id && isSvcLog(l)).sort((a, b) => b.date.localeCompare(a.date));
  if (!logs.length) return {last:null, due:null, left:null};
  const due = addDays(toDate(logs[0].date), devCycleDays(dev));
  return {last: logs[0].date, due, left: daysBetween(today(), due)};
}
// V49：保養狀態以「月」為單位呈現；不顯示剩餘天數
function svcMonthState(dev) {
  const logs = svcVisitsOf(dev.id);
  if (!logs.length) return {state: 'new', last: null, months: 0};
  const cm = devCycle(dev).m, t = today(), cur = t.getFullYear() * 12 + t.getMonth();
  const last = logs[logs.length - 1], lt = toDate(last.date);
  if (logs.some(l => { const d0 = toDate(l.date); return d0.getFullYear() * 12 + d0.getMonth() === cur; }))
    return {state: 'done', last: last.date, months: 0};
  const dueIdx = lt.getFullYear() * 12 + lt.getMonth() + cm;
  if (dueIdx < cur) return {state: 'overdue', last: last.date, months: cur - dueIdx};
  if (dueIdx === cur) return {state: 'due', last: last.date, months: 0};
  return {state: 'ok', last: last.date, months: dueIdx - cur};
}
const SVC_TAG = {new: '<span class="tag t-info">尚無紀錄</span>', done: '<span class="tag t-ok">本月已保養</span>',
  due: '<span class="tag t-warn">本月應保養</span>', ok: '<span class="tag t-ok">正常</span>'};
function svcMonthTag(dev) {
  const m = svcMonthState(dev);
  return m.state === 'overdue' ? `<span class="tag t-warn">逾期 ${m.months} 個月未保養</span>` : SVC_TAG[m.state];
}
const svcNeedsNow = dev => ['due', 'overdue', 'new'].includes(svcMonthState(dev).state);
const leftTxt = s => s.daysLeft < 0
  ? `已超過 ${Math.abs(Math.round(s.daysLeft))} 天`

/* ================= 月保養名單 ================= */
let rosterMonth = null;

// V61：每台設備依「所屬組別」的週期推算本月是否應保養。
//  ‧本月應保養（含逾期、從未保養）→ 列出；本月有任何服務紀錄 → 已完成
//  ‧本月不在週期內 → 不列出（即使本月有維修等紀錄）
const monIdxOf = l => { const t = toDate(l.date); return t.getFullYear() * 12 + t.getMonth(); };
function rosterRowOf(d, ms) {
  const cur = ms.getFullYear() * 12 + ms.getMonth();
  const c = S.customers.find(x => x.id === d.customerId);
  const cyc = devCycle(d), logs = svcVisitsOf(d.id);
  const inMonth = logs.filter(l => monIdxOf(l) === cur), done = inMonth.length > 0;
  const prev = logs.filter(l => monIdxOf(l) < cur).pop() || null;
  let status, overdue = 0;
  if (!prev) status = done ? 'done' : 'new';
  else {
    const dueIdx = monIdxOf(prev) + cyc.m;
    if (dueIdx > cur) return null;
    status = done ? 'done' : dueIdx < cur ? 'overdue' : 'due';
    if (!done) overdue = cur - dueIdx;
  }
  const last = done ? inMonth[inMonth.length - 1] : prev;
  return {d, c, label: cyc.label, last: last ? last.date : null, status, overdue, grp: grpOfKind(d.kind), first: !prev};

  const rows = S.devices.filter(devVisible).map(d => rosterRowOf(d, ms)).filter(Boolean);
  const order = {overdue: 0, due: 1, new: 2, done: 3};
  return rows.sort((a, b) => order[a.status] - order[b.status] || (a.c?.name || '').localeCompare(b.c?.name || ''));
}

const PLAN_KEY_RE = /^\d{4}-\d{2}$/;

// 實際顯示的完成狀態：auto＝依紀錄自動判斷
function planDoneOf(r, key) {

  return {auto, mark: mk, done: auto ? mk !== 'off' : mk === 'on'};
}

  const d = S.devices.find(x => x.id === devId);
  if (!d) return toast('找不到此設備，可能已被刪除');
  if (!PLAN_KEY_RE.test(String(key))) return;
  const t = today();
  if (key > planKeyOf(new Date(t.getFullYear(), t.getMonth(), 1))) return toast('未來月份不能標記完成');
  const [y, m] = key.split('-').map(Number);

// 指定期間的印量：期末讀數 − 期初讀數；期初缺少時以期間內第一筆為起點並標註資料不完整
function periodUsage(devId, fromEx, toIn) {
  const rs = readingsOf(devId);
  const endR = rs.filter(r => r.dt <= toIn).pop();
  if (!endR) return null;
  let startR = rs.filter(r => r.dt <= fromEx).pop(), partial = false;
  if (!startR) { startR = rs.find(r => r.dt > fromEx && r.dt <= toIn); partial = true; if (!startR) return null; }
  if (startR === endR) return {bw: 0, co: 0, partial};
  const bw = endR.bw - startR.bw;
  if (bw < 0) return null;                      // 計數器歸零或換機，略過
  const co = endR.color != null && startR.color != null ? Math.max(0, endR.color - startR.color) : 0;
  return {bw, co, partial};
}
function custAnalysis(c) {
  const t = today(), d = n => addDays(t, -n);

    printDevs.forEach(dv => { const u = periodUsage(dv.id, w[0], w[1]); if (u) { any = true; total += u.bw + u.co; partial = partial || u.partial; } });
    return any ? {total, partial} : null;
  };
  const cur = use(W.cur), prev = use(W.prev), half = use(W.half);
  const halfM = half ? half.total / 6 : null;
  const repairs = w => S.logs.filter(l => devs.some(x => x.id === l.deviceId) && isRepairLog(l) &&
    toDate(l.date) > w[0] && toDate(l.date) <= w[1]).length;
  const rc = repairs(W.cur), rp = repairs(W.prev), rh = repairs(W.half) / 6;
  return {cur, prev, half, halfM, rc, rp, rh, hasPrint: printDevs.length > 0};
}

function devPlanState(d, c, idx, curIdx) {
  const logs = svcVisitsOf(d.id);
  if (!logs.length) return null;
  const idxOf = l => { const t = toDate(l.date); return t.getFullYear() * 12 + t.getMonth(); };
  const cm = devCycle(d).m;
  const anchor = Math.max(...logs.map(idxOf));
  const first = Math.min(...logs.map(idxOf));
  const served = logs.some(l => idxOf(l) === idx);
  const scheduled = (((idx - anchor) % cm) + cm) % cm === 0;
  if (scheduled && served) return 'ok';
  if (scheduled && !served && idx < curIdx && idx >= first) return 'miss';
  if (scheduled && !served && idx >= curIdx) return 'plan';
  if (!scheduled && served) return 'ok';
  return null;
}

        : c.complete ? `<td class="num">${fmt(c.co)}</td><td>${chgTag(p.complete ? chgPct(c.co, p.co) : null)}</td>` : '<td colspan="2" class="muted">資料不齊全</td>';
      const prevCell = p.complete ? `<td class="num">${fmt(p.bw)}</td><td class="num">${d.hasColor ? fmt(p.co) : '—'}</td>` : '<td colspan="2" class="muted">前期資料不齊全</td>';
      return `<tr><td>${esc(d.location || '—')}・${esc(d.model)}</td>${bwCell}${coCell}${prevCell}</tr>`;
    }).join('');
    const hasColor = list.some(d => d.hasColor);
    const cmpB = chgPct(gB, gpB), cmpC = chgPct(gC, gpC);
    return `<details class="fold" data-cid="${esc(cid)}" ${openPer.has(cid) ? 'open' : ''} ontoggle="togglePeriodCust('${esc(cid)}', this.open)">
      <summary style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
        <div style="display:flex;flex:1;min-width:0;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span><b style="font-size:16px">${esc(cust ? cust.name : '（未指定客戶）')}</b> <span class="tag t-info">${list.length} 台</span>${gOk < list.length ? ` <span class="tag t-warn">齊全 ${gOk}/${list.length}</span>` : ''}</span>
          <span style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px">
            <span>區間黑白 <b>${gOk ? fmt(gb) : '資料不齊全'}</b> ${gOk ? chgTag(cmpB) : ''}</span>
            ${hasColor ? `<span>區間彩色 <b>${gOk ? fmt(gc) : '—'}</b> ${gOk ? chgTag(cmpC) : ''}</span>` : ''}
          </span><span class="muted" style="font-size:13px;font-weight:400">（點開展開）</span></div></summary>
      <div class="card" style="overflow-x:auto"><table style="min-width:620px"><thead><tr><th>設備</th>
        <th class="num">區間黑白</th><th>增減</th><th class="num">區間彩色</th><th>增減</th><th class="num">前期黑白</th><th class="num">前期彩色</th></tr></thead>
        <tbody>${rows}</tbody></table></div></details>`;
  }).join('');
  const tile = (label, v, sub) => `<div class="stat"><div class="muted">${label}</div><div class="n">${fmt(v)}</div><div style="margin-top:4px">${sub}</div></div>`;
  const cmpB = chgPct(bB, pB), cmpC = chgPct(bC, pC);
  return quick + picker + (devs.length ? `
    <div class="stats">${tile(`區間黑白合計（齊全 ${nOk}/${devs.length} 台）`, tb, '<span class="muted">只計資料齊全的設備</span>')}
      ${tile('區間彩色合計', tc, '<span class="muted">只計資料齊全的設備</span>')}
      ${tile('與前一同長度期間相比（黑白）', cmpB == null ? 0 : bB, cmpB == null ? '<span class="muted">無可比較資料</span>' : chgTag(cmpB) + ` <span class="muted">前期 ${fmt(pB)}</span>`)}
      ${tile('與前一同長度期間相比（彩色）', cmpC == null ? 0 : bC, cmpC == null ? '<span class="muted">無可比較資料</span>' : chgTag(cmpC) + ` <span class="muted">前期 ${fmt(pC)}</span>`)}</div>
    <details class="fold" style="margin-top:10px" ${periodAllOpen ? 'open' : ''} ontoggle="periodAllOpen = this.open"><summary>各客戶印量明細（共 ${groups.size} 位客戶，點開展開）</summary>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0"><button class="ghost" onclick="periodToggleAll(true)">全部展開</button><button class="ghost" onclick="periodToggleAll(false)">全部收合</button></div>
    <div id="periodList">${cards}</div></details>`
    : '<div class="empty">尚無事務設備。</div>')
    + `<p class="note">依客戶收折，展開可看各設備。資料齊全 ＝ 區間內每個月都有實際抄表（月底附近有讀數）。資料不齊全的設備不計入合計，也不做增減比較。增減比較的對象是緊接在區間前、長度相同的期間，且兩期皆齊全才顯示。區間最長 36 個月。</p>`;
}

function groupDevCell(g) {
  if (!g.merged) return siteName(g.dev);
  return `${esc(custName(g.dev))}<div class="muted">${esc(KIND[g.dev.kind])} ${esc(g.dev.model)}・合併 ${g.members.length} 台</div>
    <div class="muted" style="font-size:12px">${g.members.map(s => esc(s.dev.location || '—')).join('、')}</div>`;
}
function groupDevCell(g) {
  if (!g.merged) return siteName(g.dev);
  return `${esc(custName(g.dev))}<div class="muted">${esc(KIND[g.dev.kind])} ${esc(g.dev.model)}・合併 ${g.members.length} 台</div>
    <div class="muted" style="font-size:12px">${g.members.map(s => esc(s.dev.location || '—')).join('、')}</div>`;
}
function viewDash() {
  const groups = consGroups().filter(g => g.members.every(m => devVisible(m.dev)));
  const ok = groups.filter(g => g.ok), bad = groups.filter(g => !g.ok);
  const missing = bad.filter(g => g.missing);   // V65：資料不足（無法推估）不列入提醒
  const urgent = ok.filter(g => g.tier === 'urgent' || g.tier === 'out').sort((a, b) => a.coverDays - b.coverDays);
  const prep = ok.filter(g => g.tier === 'prep').sort((a, b) => a.coverDays - b.coverDays);
  const list = [...urgent, ...prep, ...missing];
  const cyc = S.consumables.filter(c => !isToner(c)).map(c => ({c, dev: S.devices.find(d => d.id === c.deviceId), sig: cycleSignal(c)}))
    .filter(x => x.dev && isPrint(x.dev) && devVisible(x.dev) && x.sig && x.sig.abnormal);
  const svcDue = S.devices.filter(d => devVisible(d) && ['due', 'overdue'].includes(svcMonthState(d).state));
  const visEv = e => { const c = S.consumables.find(x => x.id === e.consId); const d = c && S.devices.find(x => x.id === c.deviceId); return !d || (isPrint(d) && devVisible(d)); };
  const abn = S.events.filter(e => e.flags && e.flags.length && visEv(e) && daysBetween(toDate(e.date), today()) <= WARN_ABN_DAYS)
    .sort((a, b) => b.date.localeCompare(a.date));

  const visLog = l => { const d = S.devices.find(x => x.id === l.deviceId); return !d || devVisible(d); };
  const sigRecent = S.logs.filter(l => l.purchaseSignal && visLog(l) && daysBetween(toDate(l.date), today()) <= 30);
  const signals = [...S.logs].filter(l => l.purchaseSignal && visLog(l)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10);
  const signalHtml = signals.length
    ? `<table><thead><tr><th>日期</th><th>客戶／地點</th><th>採購信號</th><th>耗材庫存</th></tr></thead><tbody>${signals.map(l => {
        const d = S.devices.find(x => x.id === l.deviceId);
        return `<tr><td>${l.date}</td><td>${d ? siteLabel(d) : '—'}</td><td>${esc(l.purchaseSignal)}</td><td style="font-size:13px">${esc(l.consumableStock || '—')}</td></tr>`;
      }).join('')}</tbody></table>`
    : '<div class="empty">目前沒有採購信號。</div>';

  const reminderRows = list.map(g => {
    const cn = `${esc(g.name)}<div class="muted">${esc(g.cat)}・${esc(g.basisLabel)}${g.toner ? '（依顏色）' : '（逐機）'}</div>`;
    if (!g.ok) return `<tr style="background:#f8fafc"><td>${groupDevCell(g)}</td><td>${cn}</td>
      <td colspan="5"><span class="muted">${esc(g.reason)}</span>　<span class="muted">請到「設備資料總覽」補齊後即可推估</span></td>
      <td>${tierTag(g)}</td></tr>`;
    return `<tr><td>${groupDevCell(g)}</td><td>${cn}</td>
      <td style="font-size:13px">月均用量 ${fmt(g.monthly)} ${g.u}（${g.merged ? '合併' : '單機'}）<div class="muted">有效壽命 ${fmt(g.L)} ${g.u}</div></td>
      <td>${fmt(g.remaining)} ${g.u}<div class="muted">最先更換：${leftTxt({daysLeft: g.daysLeft})}</div></td>
      <td>${g.stock} 件${g.buy > 0 ? `<div><span class="tag t-warn">60 天內建議採購 ${g.buy} 件</span></div>` : ''}</td>
      <td>${iso(g.exhaust)}<div class="muted">約 ${Math.round(g.coverDays)} 天</div></td>
      <td>${g.orderIn < 0 ? `<span class="tag t-danger">已逾期 ${-g.orderIn} 天</span>` : `${iso(g.orderDate)}<div class="muted">${g.orderIn} 天後</div>`}</td>
      <td>${tierTag(g)}</td></tr>`;
  }).join('');

  const cycRows = cyc.map(({c, dev, sig}) => `<tr><td>${siteName(dev)}</td><td>${esc(c.name)}</td><td>${sig.n} 次更換</td>
      <td>最近一次間隔 ${sig.last} 天／平均 ${fmt(sig.avg)} 天</td><td>預期約 ${fmt(sig.expect)} 天</td>
      <td><span class="tag t-warn">週期偏短（可能機器異常或更換不當）</span></td></tr>`).join('');

  const catRows = CATS.map(cat => {
    const gs = groups.filter(g => g.cat === cat);
    if (!gs.length) return '';
    const okG = gs.filter(g => g.ok);
    const stockSum = okG.reduce((a, g) => a + g.stock, 0);
    const need = okG.filter(g => g.tier === 'prep' || g.tier === 'urgent' || g.tier === 'out').length;
    const buy = okG.reduce((a, g) => a + g.buy, 0);
    const miss = gs.filter(g => g.missing).length;
    const status = buy > 0 ? `<span class="tag t-warn">需採購 ${buy} 件</span>`
      : miss ? '<span class="tag t-info">有未填寫庫存</span>' : '<span class="tag t-ok">足夠</span>';
    return `<tr><td>${catLabel(cat)}</td><td class="num">${stockSum}</td><td class="num">${need}</td><td class="num">${buy}</td><td class="num">${miss}</td><td>${status}</td></tr>`;
  }).join('');

  const abnRows = abn.map(e => {
    const c = S.consumables.find(x => x.id === e.consId);
    const dev = c && S.devices.find(x => x.id === c.deviceId);
    return `<tr><td>${e.date}</td><td>${dev ? siteLabel(dev) : '（已刪除）'}</td><td>${c ? esc(c.name) : '—'}</td>
      <td>${fmt(e.consumed)} ／ ${fmt(e.effLife ?? e.life)}</td>
      <td>${e.flags.map(f => `<span class="tag t-warn">${esc(f)}</span>`).join('<br>')}</td></tr>`;
  }).join('');

  return `
  <div class="stats">
    <div class="stat"><div class="muted">採購信號（近 30 日・見下方明細）</div><div class="n" style="color:var(--yellow)">${sigRecent.length}</div></div>
    <div class="stat"><div class="muted">21 天內可能用完（立即提醒）</div><div class="n" style="color:var(--danger)">${urgent.length}</div></div>
    <div class="stat"><div class="muted">60 天內需備料</div><div class="n" style="color:var(--yellow)">${prep.length}</div></div>
    <div class="stat"><div class="muted">尚未填寫耗材庫存（略過）</div><div class="n" style="color:var(--brand)">${missing.length}</div></div>
    <div class="stat"><div class="muted">使用週期異常（碳粉以外）</div><div class="n" style="color:var(--yellow)">${cyc.length}</div></div>
    <div class="stat"><div class="muted">異常更換（${WARN_ABN_DAYS} 天內）</div><div class="n" style="color:var(--yellow)">${abn.length}</div></div>
    <div class="stat"><div class="muted">本月應保養（含逾期）</div><div class="n" style="color:var(--yellow)">${svcDue.length}</div></div>
  </div>

  ${abn.length ? `<div class="alert-box">有 ${abn.length} 筆耗材更換異常。請優先檢查機器狀況與更換作業，展開下方「採購信號・備料彙整・異常更換」。</div>` : ''}
  ${missing.length ? `<div class="alert-box">有 ${missing.length} 項耗材尚未填寫庫存，已略過推估。請到「設備資料總覽」的耗材區登打實際庫存。</div>` : ''}

  <div class="card">
    <h2>耗材提醒（21 天內立即提醒・60 天內備料）</h2>
    ${list.length ? `<div style="overflow-x:auto"><table style="min-width:1120px"><thead><tr>
        <th>設備</th><th>耗材</th><th>月均用量</th><th>預估剩餘</th>
        <th>庫存</th><th>庫存可用至</th><th>建議補貨日</th><th>狀態</th></tr></thead>
      <tbody>${reminderRows}</tbody></table></div>`
      : '<div class="empty">目前沒有需要提醒的耗材。</div>'}
    <p class="note">庫存可撐天數 ＝（各台本支剩餘 ＋ 庫存件數 × 有效壽命）÷ 日均用量。碳粉可合併計算（同客戶同機種，於設備頁或保養客戶一覽設定）；感光滾筒、廢粉回收盒、其他逐機計算。未填寫庫存的項目會略過並提醒。</p>
  </div>

  <div class="card">
    <h2>本月印量統計</h2>
    ${monthTableHtml()}
  </div>

  <div class="card">
    <h2>自訂期間印量統計</h2>
    ${periodSummaryHtml()}
  </div>

  <div class="card sec-cons">
    <h2>使用週期異常（碳粉以外・逐機）</h2>
    ${cyc.length ? `<div style="overflow-x:auto"><table style="min-width:900px"><thead><tr><th>設備</th><th>耗材</th><th>更換次數</th><th>間隔</th><th>預期週期</th><th>提醒</th></tr></thead><tbody>${cycRows}</tbody></table></div>`
      : '<div class="empty">目前沒有使用週期異常。</div>'}
    <p class="note">以相鄰兩次更換的間隔，對照依近六個月月均推算的預期週期；間隔低於預期的 60% 即提醒。</p>
  </div>

  <details class="fold"><summary>採購信號・備料彙整・異常更換（低頻查詢，點開展開）</summary>
  <div class="card">
    <h2>採購信號（服務人員回報）</h2>
    ${signalHtml}
    <p class="note">來自「服務紀錄」的採購信號欄位，依日期由新到舊，最多列 10 筆。</p>
  </div>

  <div class="card">
    <h2>備料彙整（依分類）</h2>
    <table style="min-width:680px"><thead><tr><th>耗材分類</th><th class="num">庫存合計（件）</th><th class="num">60 天內需備料項目</th><th class="num">建議採購（件）</th><th class="num">未填寫庫存（項）</th><th>狀態</th></tr></thead>
    <tbody>${catRows || '<tr><td colspan="6" class="empty">尚未設定耗材。</td></tr>'}</tbody></table>
  </div>

  <div class="card">
    <h2>異常更換提醒</h2>
    ${abn.length ? `<table><thead><tr><th>更換日</th><th>設備</th><th>耗材</th><th>實際用量 ／ 有效壽命</th><th>異常說明</th></tr></thead><tbody>${abnRows}</tbody></table>`
                 : '<div class="empty">近期沒有異常更換紀錄。</div>'}
    <p class="note">可能原因請依序檢查：（1）機器其他故障，如漏印、定影異常、感光滾筒磨損、進紙或清潔機構問題造成耗材額外消耗；（2）更換不當，如裝錯、未完全安裝、重複更換；（3）使用習慣或環境改變，如大量彩色列印、用紙不同；（4）耗材品質問題。</p>
  </div>

  </details>
  <details class="fold"><summary>客戶分析（近30日 ／ 前30日 ／ 前六個月）（點開展開）</summary>
  ${analysisCardHtml()}
  </details>`;
}

/* ================= 設備資料總覽（單一頁面） ================= */
let selCust = null, selDev = null, chartIdx = null;
const devsOf = cid => S.devices.filter(d => d.customerId === cid && devVisible(d));
// 客戶的合約：由其設備彙總（例：計張 2、租賃 1、未設定 1）
function contractCounts(c) {
  const m = new Map();
  devsOf(c.id).forEach(d => { const k = devContract(d) || '未設定'; m.set(k, (m.get(k) || 0) + 1); });
  return [...CONTRACTS, '未設定'].filter(k => m.has(k)).map(k => [k, m.get(k)]);
}
const contractText = c => contractCounts(c).map(([k, n]) => `${k} ${n}`).join('、');
const contractTagOf = c => contractCounts(c).map(([k, n]) => `<span class="tag ${CONTRACT_CLS[k] || 't-gray'}">${esc(k)} ${n}</span>`).join(' ');
// 設備表單的合約型態選項（依設備類別）
function contractOptsHtml(kind, cur) {
  return `<option value="">請選擇合約型態</option>` + contractsFor(kind).map(x => `<option ${x === cur ? 'selected' : ''}>${x}</option>`).join('');
}
const contractFieldHtml = (kind, cur) => `<div><label>合約型態</label><select name="contract" required>${contractOptsHtml(kind, cur)}</select></div>`;
function ensureSel() {
  if (!S.devices.some(d => d.id === selDev)) selDev = S.devices.length ? S.devices[0].id : null;
  const dev = S.devices.find(d => d.id === selDev);
  selCust = dev ? dev.customerId : (S.customers.length ? S.customers[0].id : null);
}
function pickDev(id) { selDev = id; devPanel = id; chartIdx = null; pendingPanelScroll = true; render(); }
function goVisit(i) { chartIdx = i; render(); setTimeout(() => { const el = document.getElementById('visitDetail'); if (el) el.scrollIntoView({block: 'start'}); }, 0); }
let LOGIDX = null;   // 設備 → 已排序的服務紀錄（重繪或資料變動時清除）
function logIdx() {
  if (LOGIDX) return LOGIDX;
  LOGIDX = new Map();
  (S.logs || []).forEach(l => { if (!LOGIDX.has(l.deviceId)) LOGIDX.set(l.deviceId, []); LOGIDX.get(l.deviceId).push(l); });
  const nz = x => x == null || x === '' || isNaN(+x) ? -1 : +x;
  // V54：依服務日期排序；同一天再依讀數（張數只增不減）排序，與登打先後無關
  LOGIDX.forEach(arr => arr.sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))
    || nz(a.bw) - nz(b.bw) || nz(a.color) - nz(b.color) || nz(a.colorLarge) - nz(b.colorLarge)));
  return LOGIDX;
}
function visitsOf(devId) { return (logIdx().get(devId) || []).slice(); }
function svcVisitsOf(devId) { return visitsOf(devId).filter(isSvcLog); }
// V54：服務紀錄序號——日期最近的為第 1 筆。k 為由舊到新的索引、n 為總筆數
const seqNo = (n, k) => n - k;
const seqTag = (n, k) => n - k === 1 ? ' <span class="tag t-ok">最近</span>' : '';
const clip = (x, n = 28) => { const t = String(x ?? ''); return t.length > n ? esc(t.slice(0, n)) + '…' : esc(t); };

// V65 設備的提醒：只列「需要人處理、處理後會消失」的項目——耗材（尚未填寫庫存／60 天內／已用完）、最近一次紀錄的張數問題、近期使用週期異常、近期異常更換
// 不列：耗材資料不足（無法處理）、保養到期（「保養狀態」「本月狀態」欄已經寫了）、拜訪間隔／月用量偏高偏低（只是參考，留在服務歷史）
let remCgMemo = null;   // V65：畫「設備資料總覽」時只算一次耗材分組，畫完立刻清掉（不會用到舊資料）
function reminderItems(dev, cg) {
  const items = [];
  (cg || remCgMemo || consGroups()).filter(g => g.members.some(s => s.dev.id === dev.id)).forEach(g => {
    const mine = g.members.filter(s => s.dev.id === dev.id).map(s => s.c.id);
    if (!g.ok) { if (g.missing) items.push({kind: 'cons', cons: mine, tag: '<span class="tag t-info">尚未填寫庫存</span>', text: `${g.name}：尚未填寫耗材庫存，本次略過推估`}); }
    else if (g.tier) items.push({kind: 'cons', cons: mine, tag: tierTag(g),
      text: `${g.name}${g.merged ? `（與同機種 ${g.members.length - 1} 台合併計算）` : ''}：庫存可撐約 ${Math.round(g.coverDays)} 天，建議補貨 ${g.orderIn < 0 ? '已逾期' : iso(g.orderDate)}`});
  });
  const myCons = S.consumables.filter(c => c.deviceId === dev.id);
